<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>算法动态演示</title>
<style>
/* =====================================================================
   ENGINE STYLE —— 通用布局与风格（固定，生成新演示时不要改动）
   ===================================================================== */
:root {
  --bg: #f5f7fb; --card: #fff; --line: #e5e7eb; --text: #1f2937; --muted: #6b7280;
  --blue: #2563eb; --green: #16a34a; --red: #dc2626; --amber: #d97706; --purple: #7c3aed; --gray: #64748b;
  --blue-l: #eff6ff; --green-l: #f0fdf4; --red-l: #fef2f2; --amber-l: #fffbeb; --purple-l: #f5f3ff;
  --dur: 420ms; --ease: cubic-bezier(.4, 0, .2, 1);
  --code-w: 720px; --code-fs: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
body.instant *, body.instant *::before, body.instant *::after { transition: none !important; animation: none !important; }

header { flex: none; display: flex; align-items: baseline; gap: 14px; padding: 12px 20px 8px; min-width: 0; }
header h1 { margin: 0; font-size: 19px; white-space: nowrap; }
header .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 12px var(--code-w);
  padding: 0 16px 14px 20px; transition: grid-template-columns var(--dur) var(--ease); }
.app.dragging { transition: none; user-select: none; }
.app.code-collapsed { grid-template-columns: minmax(0, 1fr) 12px 44px; }
.left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: auto; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px;
  font-weight: 600; font-size: 15px; }
.card-h .hint { font-weight: 400; text-align: right; }
.hint { color: var(--muted); font-size: 12px; }
.mono { font-family: Consolas, "Courier New", monospace; }
.dim { opacity: .5; transition: opacity var(--dur); }

/* 工具栏 */
.toolbar { flex: none; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar label { color: var(--muted); }
input[type=text], input[type=number] { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;
  font-family: inherit; transition: border-color .15s, box-shadow .15s; }
input[type=text]:focus, input[type=number]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px #dbeafe; }
button { padding: 6px 12px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer;
  font-size: 14px; font-family: inherit; color: var(--text); transition: background .15s, border-color .15s; }
button:hover { background: #eef2ff; border-color: #a5b4fc; }
button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
button.primary:hover { background: #1d4ed8; }
button.preset { font-size: 12px; padding: 3px 9px; }
button.preset.on { background: var(--blue); color: #fff; border-color: var(--blue); box-shadow: 0 0 0 2px #bfdbfe; }
button.preset.on:hover { background: #1d4ed8; }
.progress { flex: 1; min-width: 140px; height: 8px; background: var(--line); border-radius: 4px; cursor: pointer;
  position: relative; touch-action: none; margin: 0 8px; }
.progress::before { content: ""; position: absolute; left: -8px; right: -8px; top: -9px; bottom: -9px; }
.progress #prog { height: 100%; background: var(--blue); border-radius: 4px; transition: width var(--dur) var(--ease); }
.progress .thumb { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
  background: #fff; border: 3px solid var(--blue); box-shadow: 0 1px 4px rgba(0, 0, 0, .2); cursor: grab;
  transition: left var(--dur) var(--ease), transform .15s; }
.progress:hover .thumb, .progress.dragging .thumb { transform: scale(1.2); }
.progress.dragging .thumb { cursor: grabbing; }
.progress.dragging #prog, .progress.dragging .thumb { transition: none; }
.progress .tip { position: absolute; bottom: 18px; transform: translateX(-50%); background: var(--text); color: #fff;
  font-size: 12px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
.progress.dragging .tip { opacity: 1; }
.err { color: var(--red); font-size: 13px; }

/* 统计卡片（保持这一风格：标题 + 大号彩色数字） */
.stats { flex: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px; transition: box-shadow .3s; }
.stat .lab { font-size: 14px; font-weight: 600; line-height: 20px; }
.stat .num { font-size: 32px; font-weight: 800; line-height: 1.45; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .num small { font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.stat .sub { font-size: 12px; color: var(--muted); height: 18px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.red .num { color: var(--red); } .stat.green .num { color: var(--green); } .stat.blue .num { color: var(--blue); }
.stat.amber .num { color: var(--amber); } .stat.purple .num { color: var(--purple); } .stat.gray .num { color: var(--gray); }
.stat.bump { animation: bump .6s var(--ease); }
@keyframes bump { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, .35); } 100% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); } }

/* 主画布 + 下方两列 */
.canvas-card { flex: none; }
.bottom { flex: 1; min-height: 200px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.col > .card { flex: none; }
.col > .card.grow { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.card.grow > .card-b { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

/* 步骤说明 */
.desc { font-size: 15px; line-height: 1.75; }
.desc b { color: var(--blue); }
.fade-in { animation: fadeIn var(--dur) var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.tag { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; font-weight: 600; margin-right: 6px; color: #fff; line-height: 20px; }
.tag.pre { background: var(--purple); } .tag.hit { background: var(--green); } .tag.miss { background: var(--red); }
.tag.info { background: var(--blue); } .tag.warn { background: var(--amber); }
.phase { font-size: 12px; font-weight: 600; color: var(--blue); background: var(--blue-l); border-radius: 10px; padding: 1px 10px; }

/* 通用：进入 / 闪烁动画 */
.av-enter { animation: avEnter var(--dur) var(--ease); }
@keyframes avEnter { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.av-flash { animation: avFlash calc(var(--dur) * 1.6) var(--ease); }
@keyframes avFlash { 0% { background: #fde68a; } 100% { background: transparent; } }

/* 分隔条 */
.splitter { position: relative; cursor: col-resize; touch-action: none; }
.splitter::after { content: ""; position: absolute; left: 5px; top: calc(50% - 30px); height: 60px; width: 3px; border-radius: 2px;
  background: #cbd5e1; transition: background .15s; }
.splitter:hover::after, .app.dragging .splitter::after { background: var(--blue); }
.app.code-collapsed .splitter { cursor: default; }

/* 代码位置：深色背景 + VS Code Dark Modern / Pylance 配色 */
.right { min-width: 0; min-height: 0; display: flex; }
.code-card { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #1f1f1f; border: 1px solid #2b2b2b;
  border-radius: 12px; overflow: hidden; }
.code-h { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #181818;
  border-bottom: 1px solid #2b2b2b; color: #cccccc; font-size: 13px; white-space: nowrap; }
.code-h .file { color: #e5e5e5; font-weight: 600; display: flex; align-items: center; gap: 6px; overflow: hidden; text-overflow: ellipsis; }
.code-h .pyicon { width: 16px; height: 16px; border-radius: 3px; background: linear-gradient(135deg, #3572a5 50%, #ffd43b 50%); flex: none; }
.code-h .pos { color: #8b949e; margin-left: auto; }
.code-h button { background: transparent; border: 1px solid #3c3c3c; color: #cccccc; padding: 2px 8px; font-size: 12px; }
.code-h button:hover { background: #2a2d2e; border-color: #555; }
.code-h button.on { border-color: #0078d4; color: #fff; }
.code-body { flex: 1; min-height: 0; position: relative; overflow-y: auto; overflow-x: hidden; padding: 8px 0 35vh;
  font-family: Consolas, "Courier New", monospace; font-size: var(--code-fs); line-height: 1.45; color: #cccccc; }
.code-body::-webkit-scrollbar { width: 12px; } .code-body::-webkit-scrollbar-thumb { background: #424242; }
.code-body::-webkit-scrollbar-track { background: #1f1f1f; }
.ln { display: flex; transition: background var(--dur) var(--ease); }
.ln .g { flex: none; width: 4.4em; padding-right: 1.4em; text-align: right; color: #6e7681; user-select: none; position: relative;
  transition: color var(--dur); }
.ln .s { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-all;
  padding-left: calc(var(--ind) * 1ch + 4ch); text-indent: -4ch; padding-right: 12px;
  background-image: repeating-linear-gradient(90deg, #404040 0 1px, transparent 1px 4ch);
  background-size: calc(var(--ind) * 1ch) 100%; background-repeat: no-repeat; }
.ln.on { background: rgba(255, 215, 0, .13); box-shadow: inset 3px 0 #ffd700; }
.ln.on .g { color: #ffd700; }
.ln.on .g::before { content: "➜"; position: absolute; left: .5em; color: #ffd700; }
.code-body.no-cmt .ln.cmt { display: none; }
.app.code-collapsed .code-body, .app.code-collapsed .code-h > :not(.collapse) { display: none; }
.app.code-collapsed .code-h { flex: 1; flex-direction: column; justify-content: flex-start; padding: 10px 0; border: 0; }
.app.code-collapsed .code-h .collapse::after { content: "代码位置"; display: block; writing-mode: vertical-rl; margin-top: 8px; letter-spacing: 2px; }
.t-kw { color: #569cd6; } .t-ctl { color: #c586c0; } .t-fn { color: #dcdcaa; } .t-cls { color: #4ec9b0; }
.t-str { color: #ce9178; } .t-num { color: #b5cea8; } .t-cmt { color: #6a9955; } .t-var { color: #9cdcfe; }
.t-const { color: #4fc1ff; } .t-op { color: #d4d4d4; }
.t-b0 { color: #ffd700; } .t-b1 { color: #da70d6; } .t-b2 { color: #179fff; }

#av-check { display: none; }

/* 公式：MathML 按论文格式排版（数学字体、斜体变量、真正的上下标与分式） */
math { font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', math; font-size: 1.12em; }
math[display="block"] { margin: 2px 0; }
.formula math { math-style: normal; }
.stat .lab math, .card-h math, #inputs math, header math { font-size: 1em; }

/* =====================================================================
   DEMO STYLE —— 本题专用的可视化样式（生成新演示时替换这里）
   ===================================================================== */
.isl-wrap { position: relative; margin: 2px auto 0; display: grid; gap: var(--gap, 6px);
  grid-template-columns: repeat(var(--C), var(--cs)); grid-auto-rows: var(--cs); width: max-content; }
.isl-wrap svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.isl-wrap svg > g path { fill: none; stroke-width: 2.5; stroke-linecap: round; transition: stroke var(--dur), opacity var(--dur); }
.isl-wrap svg > g path.in { animation: edgeIn var(--dur) var(--ease); }
@keyframes edgeIn { from { opacity: 0; } }
.gc { position: relative; border: 2px solid #bae6fd; border-radius: 7px; background: #f0f9ff;
  transition: border-color var(--dur), background var(--dur), box-shadow var(--dur); }
.gc .v { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-weight: 800; font-size: var(--fs, 16px);
  line-height: 1; color: #7dd3fc; font-family: Consolas, monospace; transition: color var(--dur); }
.gc.land { background: #fde68a; border-color: #f59e0b; }
.gc.land .v { color: #92400e; }
.gc.sunk { border-color: transparent; }
.gc.sunk .v { color: rgba(15, 23, 42, .45); }
.gc.scan { border-color: var(--purple); border-style: dashed; }
.gc.probe-land { border-color: var(--green); box-shadow: 0 0 0 3px #bbf7d0; }
.gc.probe-zero { border-color: #94a3b8; border-style: dashed; box-shadow: 0 0 0 3px #e2e8f0; }
.gc.cur { border-color: var(--blue); border-style: solid; box-shadow: 0 0 0 3px #93c5fd; }
.gc.ghost { border: 2px dashed transparent; background: transparent; }
.gc.ghost .lab { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted);
  font-variant-numeric: tabular-nums; transition: opacity var(--dur); }
.gc.ghost .oob { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
  color: var(--red); opacity: 0; transition: opacity var(--dur); }
.gc.ghost.hitoob { border-color: var(--red); background: var(--red-l); box-shadow: 0 0 0 3px #fecaca; }
.gc.ghost.hitoob .lab { opacity: 0; }
.gc.ghost.hitoob .oob { opacity: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 2px solid transparent; }
.legend i.ln { width: 18px; height: 3px; border: 0; vertical-align: middle; }

.compass { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.dir { border: 2px dashed var(--line); border-radius: 8px; padding: 3px 6px; text-align: center; background: #fff; min-width: 0;
  transition: border-color var(--dur), background var(--dur), box-shadow var(--dur); }
.dir .t1 { font-size: 12px; color: var(--muted); white-space: nowrap; height: 17px; line-height: 17px; }
.dir .t2 { font-size: 13px; font-weight: 700; white-space: nowrap; height: 19px; line-height: 19px; font-family: Consolas, monospace; }
.dir.blank { visibility: hidden; }
.dir.center { border-style: solid; border-color: var(--blue); background: var(--blue-l); }
.dir.oob { border-style: solid; border-color: #fca5a5; background: var(--red-l); } .dir.oob .t2 { color: var(--red); }
.dir.zero { border-style: solid; border-color: #cbd5e1; background: #f8fafc; } .dir.zero .t2 { color: #64748b; }
.dir.land { border-style: solid; border-color: #86efac; background: var(--green-l); } .dir.land .t2 { color: var(--green); }
.dir.now { box-shadow: 0 0 0 3px #ddd6fe; border-color: var(--purple); }
.vars { margin-top: 8px; font-family: Consolas, monospace; font-size: 13px; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.stk { position: relative; display: flex; flex-direction: column; gap: 4px; }
.frame { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; height: 26px; padding: 0 8px; border-radius: 6px;
  border: 1px solid var(--line); background: #fff; font-size: 13px; transition: background var(--dur), border-color var(--dur), color var(--dur); }
.frame .d { color: var(--muted); font-size: 12px; }
.frame .f { font-family: Consolas, monospace; font-weight: 700; }
.frame .s { font-size: 12px; color: var(--muted); }
.frame.top { background: var(--blue-l); border-color: var(--blue); }
.frame.top .s { color: var(--blue); font-weight: 700; }
.qhint { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.que { position: relative; display: flex; flex-wrap: wrap; gap: 6px; min-height: 30px; }
.qi { font-family: Consolas, monospace; font-size: 13px; font-weight: 700; padding: 3px 9px; border-radius: 6px; border: 1px solid #bae6fd;
  background: #f0f9ff; transition: background var(--dur), border-color var(--dur); }
.qi.front { border-color: var(--blue); background: var(--blue-l); }
.qi.fresh { border-color: var(--green); background: var(--green-l); }
.isls { position: relative; display: flex; flex-direction: column; gap: 6px; }
.isl { border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; font-size: 12px; transition: box-shadow var(--dur); }
.isl .h { font-size: 13px; font-weight: 700; }
.isl .h i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.isl .seq { color: #475569; font-family: Consolas, monospace; line-height: 18px; overflow-wrap: anywhere; }
.isl.active { box-shadow: 0 0 0 2px #93c5fd; }
.empty-row { padding: 4px 2px; }
</style>
</head>

<!-- 对应 .py 的完整源码，用 scripts/embed_source.py 写入（保持与源文件一致） -->
<script type="text/plain" id="py-source">
direction = [[0, 1], [1, 0], [0, -1], [-1, 0]]  # 四个方向：上、右、下、左


def dfs(grid, x, y):
    """
    对一块陆地进行深度优先遍历并标记
    """
    for i, j in direction:
        next_x = x + i
        next_y = y + j
        # 下标越界，跳过：
        #   next_x < 0              —— 越过上边界
        #   next_x >= len(grid)     —— 越过下边界
        #   next_y < 0              —— 越过左边界
        #   next_y >= len(grid[0])  —— 越过右边界
        #   四项用 or 连接：任一成立即越界；从左到右短路求值，前项成立就不再检查后项，
        #   因此后面的 grid[next_x][next_y] 只会在下标合法时才被访问
        if next_x < 0 or next_x >= len(grid) or next_y < 0 or next_y >= len(grid[0]):
            continue
        # 未搜索的陆地，沉没并继续深度优先搜索
        if grid[next_x][next_y] == 1:
            grid[next_x][next_y] = 0
            dfs(grid, next_x, next_y)


if __name__ == '__main__':  
    # 版本一
    n, m = map(int, input().split())
    
    # 邻接矩阵
    grid = []
    for i in range(n):
        grid.append(list(map(int, input().split())))
    
    res = 0
    for i in range(n):
        for j in range(m):
            # 判断：如果当前节点是陆地，res+1并标记访问该节点，使用深度搜索标记相邻陆地。
            if grid[i][j] == 1:
                res += 1

<script>
/* =====================================================================
   ENGINE —— 播放器 / 布局 / 代码高亮 / 平滑过渡 / 自检（通用，勿改）

const AV = (() => {

  const anims = new Map();

  // 按 key 复用 DOM：移动 FLIP 平滑过渡，新增淡入，删除淡出（容器需 position:relative）
  function keyed(box, items, keyOf, create, update) {
    const ms = dur();
    const old = new Map();
    for (const c of [...box.children]) if (c.dataset.key != null && !c.classList.contains('av-leaving')) old.set(c.dataset.key, c);
    const first = new Map();
    if (ms) old.forEach((c, k) => first.set(k, c.getBoundingClientRect().top));
    const want = new Set(items.map(it => String(keyOf(it))));
    old.forEach((c, k) => {
      if (want.has(k)) return;

  // ---------- Python 高亮（VS Code Dark Modern + Pylance 语义配色） ----------
  const CTL = new Set('if elif else for while return import from as try except finally raise with break continue pass yield await async del global nonlocal assert match case'.split(' '));
  const KW = new Set('def class lambda None True False and or not in is self cls'.split(' '));
  const CLS = new Set('int float str bool list dict set tuple range object type bytes frozenset complex Exception ValueError KeyError IndexError TypeError deque defaultdict Counter OrderedDict'.split(' '));
  function highlightPython(src) {
    const lines = src.split('\n');
    const modules = new Set();
    for (const l of lines) {
      let m = l.match(/^\s*import\s+([\w., ]+)/);
      if (m) m[1].split(',').forEach(p => { const a = p.trim().split(/\s+as\s+/); modules.add((a[1] || a[0]).split('.')[0].trim()); });

      }
      while (i < line.length) {
        re.lastIndex = i;
        const m = re.exec(line);
        if (!m) break;
        if (m[1]) toks.push(['cmt', m[1]]);
        else if (m[3] !== undefined && (m[3] || m[2])) {
          if (m[2]) toks.push([/[fF]/.test(m[2]) ? 'kw' : 'str', m[2]]);

        else if (m[7]) toks.push(['ws', m[7]]);

        const [type, w] = t;

        else if (CLS.has(w)) c = 'cls';
        else if (/^[A-Z][A-Z0-9_]+$/.test(w)) c = 'const';
        return `<span class="t-${c}">${esc(w)}</span>`;

  // ---------- 代码面板 ----------
  let srcLines = [], codeEls = [], activeCodeLines = new Set();
  function mountCode(fileName) {
    const src = $('py-source').textContent.replace(/\r\n?/g, '\n').replace(/^\n/, '').replace(/\s+$/, '');

  }
  // 按源码内容定位行号：lineOf('res += 1')，nth 表示第几处匹配（忽略注释部分）

    let cnt = 0;

    }
    console.error('[AV] lineOf 未找到：', text, nth);
    return 0;
  }
  function setCodeLines(lines) {
    lines = (lines || []).filter(Boolean);
    const set = new Set(lines);
    if (set.size === activeCodeLines.size && [...set].every(k => activeCodeLines.has(k))) return;
    for (const k of activeCodeLines) if (!set.has(k)) codeEls[k - 1]?.classList.remove('on');
    for (const k of set) if (!activeCodeLines.has(k)) codeEls[k - 1]?.classList.add('on');

    if (!sorted.length) return;

  function setStat(def, val) {

    if (typeof v === 'number' && typeof t.cur === 'number' && t.cur !== v && !instant) {
      const a = t.cur;

  function render(prev) {

    if (setHTML($('desc'), html)) { flash($('desc'), 'fade-in'); }

  function go(k) {

  function stop() { finishDrag?.(); clearTimeout(timer); timer = null; $('btnPlay').textContent = '▶ 播放'; }
  function play() {

  function withInstant(fn) { const was = instant; instant = true; document.body.classList.add('instant'); try { fn(); } finally { instant = was; if (!was) { void document.body.offsetWidth; document.body.classList.remove('instant'); } } }

  }

  // 输入框内容与哪个预设一致就高亮哪个按钮（同值时优先刚点的那个），手动改输入后自动取消
  let lastPreset = -1;
  function markPreset() {

  }

  function buildShell() {

      $('stats').appendChild(box);

    const pn = D.panels || {};
    $('canvasTitle').textContent = pn.canvas?.title || '';

  function wire() {
    $('btnFirst').onclick = () => { stop(); go(0); };

    setCollapsed(!!localStorage.getItem(LS + 'collapsed'));
    $('btnCollapse').onclick = () => setCollapsed(!app.classList.contains('code-collapsed'));

    setCmt(!localStorage.getItem(LS + 'hideCmt'));

    // 画布尺寸变化（窗口缩放、拖动分隔条、折叠代码）时重新排版，不做过渡
    let raf = 0;
    new ResizeObserver(() => {
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => withInstant(() => { D.layout && D.layout(data, P); D.render(steps[cur], null, data, P); }));
    }).observe($('canvas'));
  }

  // ---------- 自检：文字互相遮挡 / 左侧需滚动 / 代码横向滚动 ----------
  function textRects(root) {
    const out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const range = document.createRange();
    const seenMath = new Set();
    while (w.nextNode()) {
      const node = w.currentNode;
      if (!node.textContent.trim()) continue;
      const host = node.parentElement.closest('math') || node.parentElement;
      if (host.closest('.av-leaving, svg defs, .slots .empty')) continue;
      const cs = getComputedStyle(host);
      if (cs.visibility === 'hidden' || +cs.opacity === 0) continue;
      // 公式按整体外框参与检查（上下标、重音符的字形框会互相叠住，不算重叠）
      if (host.localName === 'math') { if (seenMath.has(host)) continue; seenMath.add(host); range.selectNode(host); }
      else range.selectNodeContents(node);

  function checkOnce(stepIdx, issues) {
    const left = $('left');

    for (let i = 0; i < ts.length; i++) for (let j = i + 1; j < ts.length; j++) {
      const a = ts[i], b = ts[j];
      if (a.host === b.host || a.host.contains(b.host) || b.host.contains(a.host)) continue;
      if (inter(a.r, b.r)) issues.push({ step: stepIdx, type: '文字重叠', a: a.text, b: b.text });

      const r = e.getBoundingClientRect(), g = +(e.dataset.ring || 0);

      if (s.e.contains(t.host)) continue;

  }
  function runCheck() {
    const issues = [];
    let total = 0;
    // 逐个预设、逐步检查；没有预设时只检查当前输入
    const runs = D.presets && D.presets.length ? D.presets : [null];
    runs.forEach(p => {
      if (p) { for (const k in p.values) $('in-' + k).value = p.values[k]; if (!apply()) return; }
      const tagged = [];
      withInstant(() => { for (let k = 0; k < steps.length; k++) { go(k); checkOnce(k, tagged); } go(0); });
      total += steps.length;
      tagged.forEach(it => { it.step = (p ? p.label + ' · ' : '') + 'step ' + it.step; issues.push(it); });
    });
    const left = $('left'), body = $('codeBody');
    const uniq = [], seen = new Set();
    for (const it of issues) { const key = it.type + it.a + '|' + it.b; if (!seen.has(key)) { seen.add(key); uniq.push(it); } }
    const res = {
      viewport: [window.innerWidth, window.innerHeight], steps: total, lastSteps: steps.length,
      leftNeedsScroll: Math.max(0, left.scrollHeight - left.clientHeight),
      codeHScroll: Math.max(0, body.scrollWidth - body.clientWidth),
      overlaps: uniq.slice(0, 30), overlapCount: uniq.length,

    document.title = 'AVCHECK ' + (res.leftNeedsScroll || res.codeHScroll || res.overlapCount ? 'FAIL' : 'OK');
  }

  function start(demo) {
    D = demo;
    buildShell();
    wire();
    setSpeed();
    apply();
    const h = new URLSearchParams(location.hash.slice(1));
    const pre = D.presets && D.presets[+h.get('preset')];
    if (h.has('preset') && pre) { for (const k in pre.values) $('in-' + k).value = pre.values[k]; apply(); }
    if (h.has('step')) withInstant(() => go(+h.get('step')));

  }

      Gamma: 'Γ', Delta: 'Δ', Theta: 'Θ', Lambda: 'Λ', Xi: 'Ξ', Pi: 'Π', Sigma: 'Σ', Phi: 'Φ', Psi: 'Ψ', Omega: 'Ω' };

      infty: '∞', nabla: '∇', partial: '∂', sum: '∑', prod: '∏', int: '∫', top: '⊤', mid: '∣', forall: '∀', exists: '∃', circ: '∘', odot: '⊙', otimes: '⊗', oplus: '⊕',
      land: '∧', wedge: '∧', lor: '∨', vee: '∨', neg: '¬', lnot: '¬',
      lfloor: '⌊', rfloor: '⌋', lceil: '⌈', rceil: '⌉', langle: '⟨', rangle: '⟩', lVert: '‖', rVert: '‖', Vert: '‖', lvert: '|', rvert: '|', '|': '‖', '{': '{', '}': '}',
      ldots: '…', cdots: '⋯', dots: '…', '#': '#', '%': '%', '&': '&', _: '_', '$': '$' };
    const FN = new Set('max min exp log ln sin cos tan tanh sigmoid arg det diag std var sup inf lim softmax argmin argmax'.split(' '));

    const SPACE = { ',': '0.17em', ':': '0.22em', ';': '0.28em', ' ': '0.28em', quad: '1em', qquad: '2em', '!': '-0.17em' };
    const SUP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁺': '+', '⁻': '-', 'ᵀ': '\\top ', 'ⁱ': 'i', 'ⁿ': 'n', 'ᵈ': 'd', 'ᵗ': 't' };

    const COMB = { '̂': 'ˆ', '̄': '―', '̅': '―', '̃': '˜', '̇': '˙', '⃗': '→' };

        }
        if (lo && hi) return `<msubsup>${base}${lo}${hi}</msubsup>`;
        if (lo) return `<msub>${base}${lo}</msub>`;
        if (hi) return `<msup>${base}${hi}</msup>`;
        return base;
      }

        const c = s[i];

          i++;
          const n = readName();
          if (n in GREEK) return /[A-Z]/.test(n[0]) ? `<mi mathvariant="normal">${GREEK[n]}</mi>` : `<mi>${GREEK[n]}</mi>`;
          if (n in SPACE) return `<mspace width="${SPACE[n]}"></mspace>`;
          if (FN.has(n)) return `<mi>${n}</mi>`;
          if (n in ACC) return `<mover accent="true">${arg()}<mo>${ACC[n]}</mo></mover>`;
          if (n in OPS) return mo(OPS[n]);
          switch (n) {
            case 'frac': case 'dfrac': case 'tfrac': { const a = arg(); return `<mfrac>${a}${arg()}</mfrac>`; }
            case 'sqrt': return `<msqrt>${arg()}</msqrt>`;
            case 'text': case 'textrm': case 'mbox': return `<mtext>${x(readRaw())}</mtext>`;
            case 'mathrm': case 'operatorname': { const t = readRaw(); return t.length === 1 ? `<mi mathvariant="normal">${x(t)}</mi>` : `<mi>${x(t)}</mi>`; }
            case 'mathbf': return `<mi>${x(styled(readRaw(), 0x1D400, 0x1D41A, 0x1D7CE))}</mi>`;
            case 'boldsymbol': case 'bm': return `<mi>${x(styled(readRaw(), 0x1D468, 0x1D482, 0x1D7CE))}</mi>`;
            case 'mathcal': return `<mi>${[...readRaw()].map(ch => CAL[ch] || styled(ch, 0x1D49C, 0x1D4B6)).join('')}</mi>`;

    const handle = recs => { for (const r of recs) { if (r.type === 'characterData') typeset(r.target); else r.addedNodes.forEach(typeset); } };
    const mo = new MutationObserver(handle);
    mo.observe(document.body, { childList: true, subtree: true, characterData: true });
    const flush = () => handle(mo.takeRecords());
    return { convert, typeset, flush };
  })();

  function setHTML(node, html) {
    html = html == null ? '' : String(html);
    if (node._raw === html) return false;
    node._raw = html;
    node.innerHTML = html;
    TEX.typeset(node);
    return true;
  }

  return { $, el, esc, clamp, dur, animate, flash, setText, keyed, lineOf, start, isInstant: () => instant, setHTML, tex: TEX.convert, typeset: TEX.typeset };
})();

    { key: 'res', label: '岛屿数量 res', color: 'amber' },
    { key: 'scan', label: '主循环位置 (i, j)', color: 'purple' },
    DFS ? { key: 'ds', label: '递归深度（栈）', color: 'blue' } : { key: 'ds', label: '队列长度 len(queue)', color: 'blue' },
    { key: 'sunk', label: '已沉没陆地', color: 'green' },
    { key: 'chk', label: '方向检查次数', color: 'gray' },
  ],
  panels: {
    canvas: { title: '网格 grid', hint: DFS ? '箭头：dfs(x, y) → 递归调用 dfs(next_x, next_y)；外圈为行列号，越界时标红' : '箭头：出队格 → 由它加入队列的格子；外圈为行列号，越界时标红' },
    state: { title: '当前格的四个方向', hint: 'direction 顺序：① 右 ② 下 ③ 左 ④ 上' },
    aux: [
      DFS ? { id: 'ds', title: '递归调用栈', hint: '栈顶在上', grow: true } : { id: 'ds', title: '队列 queue', hint: '队首 popleft · 队尾 append', grow: true },
      { id: 'isl', title: '岛屿列表', hint: '序列 = 沉没顺序', grow: true },
    ],
  },

  parse(v) {
    const rows = String(v.grid).trim().split(/[;；\n]+/).map(r => r.trim()).filter(Boolean).map(r => r.split(/[\s,，]+/).map(Number));
    if (!rows.length) return { error: '网格不能为空' };
    const m = rows[0].length;
    if (rows.some(r => r.length !== m)) return { error: '每行的列数必须相同' };
    if (rows.some(r => r.some(x => x !== 0 && x !== 1))) return { error: '网格只能包含 0 和 1' };
    if (rows.length > 7 || m > 10) return { error: '演示规模限制：n ≤ 7 行，m ≤ 10 列' };
    return { n: rows.length, m, grid: rows, land: rows.flat().filter(Boolean).length };
  },

  build({ n, m, grid: g0, land }) {
    const g = g0.map(r => [...r]), own = g0.map(r => r.map(() => 0));
    const steps = [], edges = [], isl = [], stack = [], queue = [];
    let res = 0, sunk = 0, chk = 0, maxDs = 0, phase = '读入网格';
    let scan = null, cur = null, probe = null, dres = null, fresh = null, searching = false;
    const dsLen = () => (DFS ? stack.length : queue.length);
    const snap = o => {
      maxDs = Math.max(maxDs, dsLen());
      steps.push({
        phase, grid: g.map(r => [...r]), own: own.map(r => [...r]), scan, cur, probe, dres: dres && [...dres], fresh, searching,
        curIsl: res, edges: edges.slice(), isl: isl.map(x => ({ ...x, seq: x.seq.slice() })),
        stack: stack.map(f => ({ ...f })), queue: queue.map(q => [...q]),
        stats: {
          res, scan: scan ? P2(...scan) : '—',
          ds: { v: dsLen(), sub: `最大 ${maxDs}` },
          sunk: { v: sunk, unit: `/ ${land}` }, chk,
        },
        ...o,
      });
    };
    const sink = (x, y, from) => {
      g[x][y] = 0; own[x][y] = res; sunk++;
      isl[res - 1].seq.push([x, y]);
      if (from) edges.push({ a: from, b: [x, y], k: res });
    };

    // 检查 (x, y) 的第 d 个方向，返回是否为未搜索的陆地
    const probeDir = (x, y, d) => {
      const [di, dj] = DIRS[d], nx = x + di, ny = y + dj;
      chk++; fresh = null;
      if (DFS) stack[stack.length - 1].d = d;
      const base = [L('for i, j in direction'), L(DFS ? 'next_x = x + i' : 'next_x = current_x + i'), L(DFS ? 'next_y = y + j' : 'next_y = current_y + j'), L('if next_x < 0')];
      const who = `方向 ${NO[d]} ${DN[d]}：${P2(x, y)} + [${di}, ${dj}] = <b>${P2(nx, ny)}</b>`;
      if (nx < 0 || nx >= n || ny < 0 || ny >= m) {
        dres[d] = 'oob'; probe = { x: nx, y: ny, d, kind: 'oob' };
        const why = nx < 0 ? 'next_x < 0，越过上边界' : nx >= n ? `next_x = ${nx} ≥ len(grid) = ${n}，越过下边界`
          : ny < 0 ? 'next_y < 0，越过左边界' : `next_y = ${ny} ≥ len(grid[0]) = ${m}，越过右边界`;
        snap({ tag: { text: '越界', kind: 'miss' }, lines: [...base, L('continue')],
          desc: `${who}。${why}；or 条件短路成立 → <b>continue</b> 跳过该方向，也就不会用非法下标访问 grid。` });
        return false;
      }
      if (g[nx][ny] === 0) {
        const was = own[nx][ny] > 0;
        dres[d] = was ? 'sunk' : 'water'; probe = { x: nx, y: ny, d, kind: 'zero' };
        snap({ tag: { text: was ? '已沉没' : '海水', kind: 'warn' }, lines: [...base, L('if grid[next_x][next_y] == 1')],
          desc: was
            ? `${who}。下标合法，但 grid = 0：这格<b>已被沉没</b>（已访问过），不再处理——沉没就相当于 visited 标记。`
            : `${who}。下标合法，grid = 0 是<b>海水</b>，不属于岛屿，跳过。` });
        return false;
      }
      dres[d] = 'land'; probe = { x: nx, y: ny, d, kind: 'land' };
      snap({ tag: { text: '相连陆地', kind: 'hit' }, lines: [...base, L('if grid[next_x][next_y] == 1')],
        desc: `${who}。下标合法且 grid = 1：发现与当前格相连、<b>尚未搜索</b>的陆地，它和起点属于同一座岛屿。` });
      return true;
    };

    const dfs = (x, y) => {
      for (let d = 0; d < 4; d++) {
        if (!probeDir(x, y, d)) continue;
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
        sink(nx, ny, [x, y]);
        const saved = dres;
        stack.push({ x: nx, y: ny, d: -1 }); cur = [nx, ny]; dres = [null, null, null, null]; probe = null;
        snap({ tag: { text: '沉没 · 递归', kind: 'hit' }, lines: [L('grid[next_x][next_y] = 0'), L('dfs(grid, next_x, next_y)')],
          desc: `先把 ${P2(nx, ny)} 置 0（沉没）再递归调用 <b>dfs(grid, ${nx}, ${ny})</b>。dfs(${x}, ${y}) 停在方向 ${NO[d]}，压在栈中等待返回——一条路先走到底，这就是“深度优先”。` });
        dfs(nx, ny);
        stack.pop(); cur = [x, y]; dres = saved; probe = null;
        snap({ tag: { text: '回溯', kind: 'pre' }, lines: [L('dfs(grid, next_x, next_y)')],
          desc: `dfs(${nx}, ${ny}) 的四个方向都检查完毕，返回到 <b>dfs(${x}, ${y})</b>，` +
            (d < 3 ? `从方向 ${NO[d + 1]} ${DN[d + 1]} 继续检查。` : '它的四个方向也已全部检查。') });
      }
    };

    snap({ tag: { text: '初始化', kind: 'info' }, lines: [L('n, m = map'), L('grid = []'), L('grid.append'), L('res = 0')],
      desc: `读入 n = ${n} 行、m = ${m} 列的网格（1 = 陆地，0 = 海水），共 ${land} 格陆地；res = 0。` +
        `direction 依次为 [0, 1] 右、[1, 0] 下、[0, -1] 左、[-1, 0] 上（x 是行号，向下增大；y 是列号，向右增大）。` });

    phase = '主循环扫描';
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < m; j++) {
        scan = [i, j]; cur = null; probe = null; dres = null; fresh = null;
        const lines = [L('for i in range(n)', 2), L('for j in range(m)'), L('if grid[i][j] == 1')];
        if (g[i][j] === 0) {
          const k = own[i][j];
          snap({ tag: { text: k ? '已沉没' : '海水', kind: 'warn' }, lines,
            desc: k ? `grid[${i}][${j}] = 0：这格原本是陆地，但已在搜索岛屿 #${k} 时被沉没，所以<b>不会重复计数</b>。`
              : `grid[${i}][${j}] = 0：海水，跳过。` });
          continue;
        }
        snap({ tag: { text: '发现陆地', kind: 'hit' }, lines,
          desc: `grid[${i}][${j}] = 1：这是一块<b>尚未搜索</b>的陆地。之前找到的岛屿都已整体沉没成 0，所以它一定属于一座<b>新岛屿</b>。` });
        res++; isl.push({ k: res, seq: [], start: [i, j] });
        searching = true;
        phase = `${DFS ? 'DFS' : 'BFS'} 沉没岛屿 #${res}`;
        if (DFS) {
          sink(i, j);
          snap({ tag: { text: '计数', kind: 'hit' }, lines: [L('res += 1'), L('grid[i][j] = 0')],
            desc: `res + 1 = <b>${res}</b>，并把起点 ${P2(i, j)} 置 0（沉没），标记为已访问。` });
          stack.push({ x: i, y: j, d: -1 }); cur = [i, j]; dres = [null, null, null, null];
          snap({ tag: { text: '进入 DFS', kind: 'info' }, lines: [L('dfs(grid, i, j)'), L('def dfs')],
            desc: `调用 <b>dfs(grid, ${i}, ${j})</b>：从起点出发，按 右、下、左、上 依次尝试，一遇到相连的陆地就沉没并立刻递归深入。` });
          dfs(i, j);
          stack.pop();
        } else {
          snap({ tag: { text: '计数', kind: 'hit' }, lines: [L('res += 1')],
            desc: `res + 1 = <b>${res}</b>。接下来调用 bfs，把这座岛屿整体沉没。` });
          queue.push([i, j]); sink(i, j); fresh = `${i},${j}`;
          snap({ tag: { text: '进入 BFS', kind: 'info' }, lines: [L('bfs(grid, i, j)'), L('queue = deque'), L('grid[x][y] = 0')],
            desc: `调用 <b>bfs(grid, ${i}, ${j})</b>：起点入队并<b>立即沉没</b>。入队时就置 0，保证同一格不会被重复加入队列。` });
          while (queue.length) {
            const [x, y] = queue.shift();
            cur = [x, y]; dres = [null, null, null, null]; probe = null; fresh = null;
            snap({ tag: { text: '出队', kind: 'info' }, lines: [L('while queue'), L('queue.popleft()')],
              desc: `队列非空：popleft 取出队首 <b>${P2(x, y)}</b>，依次检查它的四个邻居。队列先进先出，离起点近的格子先被处理——按层向外扩展。` });
            for (let d = 0; d < 4; d++) {
              if (!probeDir(x, y, d)) continue;
              const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
              sink(nx, ny, [x, y]); queue.push([nx, ny]); fresh = `${nx},${ny}`; probe = null;
              snap({ tag: { text: '沉没 · 入队', kind: 'hit' }, lines: [L('grid[next_x][next_y] = 0'), L('queue.append')],
                desc: `把 ${P2(nx, ny)} 置 0 并加入<b>队尾</b>。它要等队列前面的格子都处理完才会被展开。` });
            }
          }
        }
        const size = isl[res - 1].seq.length;
        cur = null; dres = null; probe = null; fresh = null; searching = false;
        snap({ tag: { text: '岛屿完成', kind: 'hit' }, lines: DFS ? [L('dfs(grid, i, j)')] : [L('while queue'), L('bfs(grid, i, j)')],
          desc: (DFS ? `dfs(grid, ${i}, ${j}) 返回，调用栈清空。` : '队列为空，bfs 返回。') +
            `岛屿 #${res} 已全部沉没，共 <b>${size}</b> 格；回到主循环继续扫描。` });
        phase = '主循环扫描';
      }
    }
    phase = '输出'; scan = null;
    snap({ tag: { text: '完成', kind: 'hit' }, lines: [L('print(res)')],
      desc: `扫描结束，共 <b style="font-size:20px;color:var(--amber)">${res}</b> 座岛屿。每格最多被主循环访问一次、被邻居检查 4 次，时间 $O(nm)$；` +
        (DFS ? `递归栈最深 ${maxDs} 层（最坏 $O(nm)$）。` : `队列最长 ${maxDs}（最坏 $O(nm)$）。`) +
        `对比右下“岛屿列表”的沉没顺序可看出 ${DFS ? 'DFS 先沿一条路走到底' : 'BFS 由近及远逐层扩展'}。` });
    return steps;
  },

  mount({ n, m }, P) {
    const wrap = el('div', 'isl-wrap');
    wrap.style.setProperty('--C', m + 2);
    const cells = [], ghosts = new Map();
    for (let r = -1; r <= n; r++) {
      const row = [];
      for (let c = -1; c <= m; c++) {
        const real = r >= 0 && r < n && c >= 0 && c < m;
        let node;
        if (real) {
          node = el('div', 'gc', '<span class="v"></span>');
          node.dataset.solid = ''; node.dataset.ring = '3';
          row.push(node);
        } else {
          const lab = r === -1 && c >= 0 && c < m ? c : c === -1 && r >= 0 && r < n ? r : '';
          node = el('div', 'gc ghost', `<span class="lab">${lab}</span><span class="oob">越界</span>`);
          ghosts.set(`${r},${c}`, node);
        }
        wrap.appendChild(node);
      }
      if (row.length) cells.push(row);
    }
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.innerHTML = `<defs>${Object.entries(EC).map(([k, c]) =>
      `<marker id="isl-mk-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${c};stroke:none"/></marker>`).join('')}</defs><g></g>`;
    wrap.appendChild(svg);
    const legend = el('div', 'legend',
      `<span><i style="background:#fde68a;border-color:#f59e0b"></i>陆地 1</span>` +
      `<span><i style="background:#f0f9ff;border-color:#bae6fd"></i>海水 0</span>` +
      `<span><i style="background:${TINT[0]}"></i>已沉没 0（按岛屿着色）</span>` +
      `<span><i style="border-color:${EC.blue}"></i>当前格</span>` +
      `<span><i style="border-color:#7c3aed;border-style:dashed"></i>主循环 (i, j)</span>` +
      `<span><i style="border-color:#16a34a"></i>正在检查</span>` +
      `<span><i class="ln" style="background:${EC.blue}"></i>${DFS ? '递归调用' : '入队来源'}</span>`);
    P.canvas.append(wrap, legend);

    // 四个方向（罗盘布局：上 / 左 中 右 / 下）
    const compass = el('div', 'compass');
    const POS = [null, 3, null, 2, 'c', 0, null, 1, null];
    const dirEls = [];
    let center = null;
    POS.forEach(p => {
      const d = el('div', 'dir', '<div class="t1"></div><div class="t2"></div>');
      if (p === null) d.classList.add('blank');
      else if (p === 'c') { d.classList.add('center'); d.querySelector('.t1').textContent = DFS ? '当前格 (x, y)' : '(current_x, current_y)'; center = d; }
      else { dirEls[p] = d; d.querySelector('.t1').textContent = `${NO[p]} ${DN[p]} [${DIRS[p].join(', ')}]`; }
      compass.appendChild(d);
    });
    const vars = el('div', 'vars');
    P.state.append(compass, vars);

    if (DFS) P.aux.ds.innerHTML = '<div class="stk"></div>';
    else P.aux.ds.innerHTML = '<div class="qhint">队首 ← 出队 ………… 入队 → 队尾</div><div class="que"></div>';
    P.aux.isl.innerHTML = '<div class="isls"></div>';

    U = { wrap, svg, g: svg.querySelector('g'), cells, ghosts, dirEls, center, vars,
      ds: P.aux.ds.querySelector(DFS ? '.stk' : '.que'), isls: P.aux.isl.querySelector('.isls'), edges: new Map(), last: null };
  },

  layout({ n, m }, P) {
    const W = P.canvas.clientWidth;
    const Hmax = clamp(window.innerHeight - 520, 150, 440);
    const C = m + 2, R = n + 2, gap = 6;
    const cs = clamp(Math.floor(Math.min((W - gap * (C - 1)) / C, (Hmax - gap * (R - 1)) / R)), 24, 62);
    U.wrap.style.setProperty('--cs', cs + 'px');
    U.wrap.style.setProperty('--gap', gap + 'px');
    U.wrap.style.setProperty('--fs', Math.round(cs * 0.42) + 'px');
    if (U.last) drawEdges(U.last);
  },

  render(s, prev, { n, m }) {
    U.last = s;
    const pr = s.probe;
    for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) {
      const c = U.cells[i][j], v = s.grid[i][j], k = s.own[i][j];
      c.classList.toggle('land', v === 1);
      c.classList.toggle('sunk', v === 0 && k > 0);
      c.style.background = v === 0 && k > 0 ? TINT[(k - 1) % TINT.length] : '';
      c.classList.toggle('scan', !!s.scan && s.scan[0] === i && s.scan[1] === j);
      c.classList.toggle('cur', !!s.cur && s.cur[0] === i && s.cur[1] === j);
      const hit = pr && pr.x === i && pr.y === j;
      c.classList.toggle('probe-land', !!hit && pr.kind === 'land');
      c.classList.toggle('probe-zero', !!hit && pr.kind === 'zero');
      setText(c.firstChild, v);
    }
    U.ghosts.forEach((gn, key) => gn.classList.toggle('hitoob', !!pr && pr.kind === 'oob' && key === `${pr.x},${pr.y}`));
    drawEdges(s);

    // 四个方向
    const cur = s.cur;
    setText(U.center.querySelector('.t2'), cur ? P2c(...cur) : '—');
    const RES = { oob: '越界', water: '海水', sunk: '已沉没', land: '陆地' };
    U.dirEls.forEach((d, k) => {
      const r = s.dres ? s.dres[k] : null;
      const t = cur ? `${P2c(cur[0] + DIRS[k][0], cur[1] + DIRS[k][1])} ${r ? RES[r] : '待查'}` : '—';
      setText(d.querySelector('.t2'), t);
      d.classList.toggle('oob', r === 'oob');
      d.classList.toggle('zero', r === 'water' || r === 'sunk');
      d.classList.toggle('land', r === 'land');
      d.classList.toggle('now', !!pr && pr.d === k);
    });
    let vt = '主循环中，尚未进入搜索';
    if (cur) {
      vt = DFS ? `x = ${cur[0]}, y = ${cur[1]}` : `current_x, current_y = ${cur[0]}, ${cur[1]}`;
      if (pr) vt += `；next_x, next_y = ${pr.x}, ${pr.y}`;
    } else if (s.phase === '输出') vt = '全部扫描完毕';
    setText(U.vars, vt);

    // 调用栈 / 队列
    if (DFS) {
      const frames = s.stack.map((f, k) => ({ ...f, depth: k + 1 })).reverse();
      keyed(U.ds, frames, f => `${f.depth}:${f.x},${f.y}`,
        () => el('div', 'frame', '<span class="d"></span><span class="f"></span><span class="s"></span>'),
        (row, f) => {
          const top = f.depth === s.stack.length;
          setText(row.children[0], `#${f.depth}`);
          setText(row.children[1], `dfs(${f.x}, ${f.y})`);
          setText(row.children[2], top ? (f.d < 0 ? '刚进入' : `检查 ${NO[f.d]} ${DN[f.d]}`) : `等待返回 · 停在 ${NO[f.d]}`);
          row.classList.toggle('top', top);
        });
    } else {
      keyed(U.ds, s.queue, q => `${q[0]},${q[1]}`,
        () => el('div', 'qi'),
        (chip, q) => {
          setText(chip, P2c(...q));
          chip.classList.toggle('front', q === s.queue[0]);
          chip.classList.toggle('fresh', s.fresh === `${q[0]},${q[1]}`);
        });
    }
    const emptyDs = DFS ? !s.stack.length : !s.queue.length;
    const er = U.ds.parentNode.querySelector('.empty-row');
    if (emptyDs && !er) U.ds.parentNode.appendChild(el('div', 'hint empty-row', '空'));
    if (!emptyDs && er) er.remove();

    // 岛屿列表
    keyed(U.isls, s.isl, o => o.k,
      o => el('div', 'isl', `<div class="h"><i style="background:${TINT[(o.k - 1) % TINT.length]}"></i><span></span></div><div class="seq"></div>`),
      (row, o) => {
        setText(row.querySelector('.h span'), `岛屿 #${o.k} · ${o.seq.length} 格 · 起点 ${P2c(...o.start)}`);
        setText(row.querySelector('.seq'), o.seq.map(p => P2c(...p)).join(' → '));
        row.classList.toggle('active', s.searching && o.k === s.curIsl);
      });
    const ie = U.isls.parentNode.querySelector('.empty-row');
    if (!s.isl.length && !ie) U.isls.parentNode.appendChild(el('div', 'hint empty-row', '尚未发现岛屿'));
    if (s.isl.length && ie) ie.remove();
  },
};

function drawEdges(s) {
  const want = new Set();
  const ctr = node => [node.offsetLeft + node.offsetWidth / 2, node.offsetTop + node.offsetHeight / 2];
  s.edges.forEach(e => {
    const key = `${e.a}>${e.b}`;
    want.add(key);
    let p = U.edges.get(key);
    if (!p) {
      p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      if (!AV.isInstant()) p.classList.add('in');
      U.g.appendChild(p);
      U.edges.set(key, p);
    }
    const [x1, y1] = ctr(U.cells[e.a[0]][e.a[1]]), [x2, y2] = ctr(U.cells[e.b[0]][e.b[1]]);
    const len = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / len, uy = (y2 - y1) / len;
    const cs = U.cells[0][0].offsetWidth, r1 = cs * 0.26, r2 = cs * 0.3;
    p.setAttribute('d', `M${x1 + ux * r1},${y1 + uy * r1} L${x2 - ux * r2},${y2 - uy * r2}`);
    const col = s.searching && e.k === s.curIsl ? 'blue' : 'gray';
    p.style.stroke = EC[col];
    p.setAttribute('marker-end', `url(#isl-mk-${col})`);
  });
  U.edges.forEach((p, key) => { if (!want.has(key)) { p.remove(); U.edges.delete(key); } });
}

AV.start(DEMO);
})();
