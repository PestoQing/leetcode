<!-- 对应 .py 的完整源码，用 scripts/embed_source.py 写入（保持与源文件一致） -->
<script type="text/plain" id="py-source">
import sys
import heapq

# sys.stdin = open('input.txt', 'r')
# 题目描述
# 在象棋中，马和象的移动规则分别是“马走日”和“象走田”。现给定骑士的起始坐标和目标坐标，要求根据骑士的移动规则，计算从起点到达目标点所需的最短步数。



# 棋盘大小 1000 x 1000（棋盘的 x 和 y 坐标均在 [1, 1000] 区间内，包含边界）

# 输入描述
# 第一行包含一个整数 n，表示测试用例的数量，1 <= n <= 100。

# 接下来的 n 行，每行包含四个整数 a1, a2, b1, b2，分别表示骑士的起始位置 (a1, a2) 和目标位置 (b1, b2)。

# 输出描述
# 输出共 n 行，每行输出一个整数，表示骑士从起点到目标点的最短路径长度。

# 输入示例
# 6
# 5 2 5 4
# 1 1 2 2
# 1 1 8 8
# 1 1 8 7
# 2 1 3 3
# 4 6 4 6
# 输出示例
# 2
# 4
# 6
# 5
# 1
# 0

def estimate(x, y, b1, b2):
    dx = abs(x - b1)
    dy = abs(y - b2)
    # 一步在单个方向最多移动 2，两方向的距离和最多减少 3。
    res = max((dx + 1) // 2, (dy + 1) // 2, (dx + dy + 2) // 3)
    # 每走一步，x+y 的奇偶性改变，因此步数的奇偶性也已确定。
    if res % 2 != (dx + dy) % 2:
        res += 1
    return res


data = sys.stdin.read().split()
n = int(data[0])
index = 1
ans = []
direction = [(1, 2), (1, -2), (-1, 2), (-1, -2),
             (2, 1), (2, -1), (-2, 1), (-2, -1)]

for i in range(n):
    a1 = int(data[index])
    a2 = int(data[index + 1])
    b1 = int(data[index + 2])
    b2 = int(data[index + 3])
    index += 4

    # dist 保存已找到的最少步数，发现更短路径时更新。
    dist = {(a1, a2): 0}
    h = estimate(a1, a2, b1, b2)
    # 堆按“已走步数 + 剩余估计”排序，同分时优先剩余估计小的点。
    queue = [(h, h, 0, a1, a2)]

    while queue:
        total, h, step, x, y = heapq.heappop(queue)
        # 同一格子可能先以较大步数入堆，后来又找到更短路径并更新 dist。
        # 旧条目仍留在堆里；若条目的 step 与当前最短记录不同，就已过期。
        # 例如旧条目 step=5，而 dist[(x,y)]=3，跳过旧条目，避免重复扩展。
        # continue 只结束本轮 while，接着取下一个堆顶，不是结束整个搜索。
        if step != dist[(x, y)]:
            continue

        # 估计不超过真实剩余步数，目标出堆时得到最短路。
        if x == b1 and y == b2:
            ans.append(str(step))
            break

        for dx, dy in direction:
            next_x = x + dx
            next_y = y + dy
            if next_x < 1 or next_x > 1000 or next_y < 1 or next_y > 1000:
                continue

            cur = (next_x, next_y)
            if cur not in dist or step + 1 < dist[cur]:
                dist[cur] = step + 1
                h = estimate(next_x, next_y, b1, b2)
                heapq.heappush(queue, (step + 1 + h, h, step + 1, next_x, next_y))

print('\n'.join(ans))


# 思路
# 1. 把每个格子看成一个节点，骑士的八种移动对应八条可能的边，每条边花费 1 步。
# 2. 使用 A* 搜索。step 是已经走的步数，h 是到终点至少还需要的步数估计。
#    优先处理 step+h 最小的格子；同分时优先 h 小的格子，减少无效扩展。
# 3. dist[(x, y)] 保存目前找到的最少步数。发现更短路径时更新并重新入堆。
# 4. 每次检查棋盘边界；目标格子从堆中取出时，step 就是答案。
#
# 常见问题
# 1. 为什么不用普通 BFS？
#    每条边的代价都是 1，BFS 也能求最短路，写法更简单。
#    但棋盘有 100 万个格子，最多 100 组数据；A* 利用目标位置，通常搜索更少。
#
# 2. estimate 中的公式是什么意思，为什么不会高估？
#    一步在 x 或 y 方向最多移动 2，所以至少需要 ceil(dx/2)、ceil(dy/2) 步。
#    一步最多让 dx+dy 减少 3，所以还至少需要 ceil((dx+dy)/3) 步。
#    三个条件必须同时满足，因此取最大值；(dx+1)//2 就是向上取整。
#    每一步都会改变 x+y 的奇偶性，所以总步数必须与 dx+dy 同奇偶。
#    若估计值奇偶不符，就加 1；真实步数也必须满足这个条件，仍不会高估。
#    棋盘边界可能迫使骑士绕路，只会使真实最短路不小于这些下界。
#
# 3. 为什么目标出堆时才结束，而不是第一次发现目标就结束？
#    第一次发现目标只代表找到一条路径，其他待处理路径可能更短。
#    目标出堆时 h=0，且它的 step+h 最小；若还存在更短路径，
#    该路径上待处理节点的估计总步数会更小，应当先出堆，因此不会漏掉更短路径。
#
# 4. 为什么同一个格子可以重复入堆，还要检查 step != dist[(x, y)]？
#    先找到的路径可能较长，之后找到更短路径时需要更新。
#    heapq 不直接修改旧条目，所以把新条目压入堆，旧条目出堆时跳过。
#    heappush 是入堆，heappop 取出最小项；元组按从左到右的字段比较。
#
# 5. 时间和空间复杂度是多少？
#    设棋盘格子数为 V，每个格子最多连接 8 个邻居，所以边数 E=O(V)。
#    本题的估计满足 h(当前格) <= 1+h(邻居)，称为一致性：
#    邻居的估计加 1 已满足当前格的三个距离下界和奇偶条件。
#    因此一个格子以当前最短距离出堆后，不会再被更短路径重新扩展。
#    单组最坏时间 O(V log V)，辅助空间 O(V)，并不保证每组都只搜很少的点。
#    n 组最坏时间 O(n*V log V)；每组重新建立搜索数据，不同时保存 n 张棋盘。
#    计入输入 data 和输出 ans 的存储后，总空间为 O(V+n)。
#
# 6. 起终点相同、位于边角时怎么处理？
#    起终点相同时，起点第一次出堆就输出 0。
#    边角处仍枚举八种移动，但跳过坐标不在 [1, 1000] 内的位置。
#    不能直接把 estimate 当答案，例如 (1,1) 到 (2,2) 的估计是 2，实际需要 4 步。
</script>

<script>
/* =====================================================================
   ENGINE —— 播放器 / 布局 / 代码高亮 / 平滑过渡 / 自检（通用，勿改）
   ===================================================================== */
const AV = (() => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let DUR = 420, instant = false;
  const dur = () => (instant ? 0 : DUR);
  const ease = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // ---------- 动画工具 ----------
  const anims = new Map();
  function animate(key, step, done, ms = dur()) {
    if (anims.has(key)) cancelAnimationFrame(anims.get(key));
    anims.delete(key);
    if (ms <= 0) { step(1); done && done(); return; }
    const t0 = performance.now();
    const f = now => {
      const p = Math.min(1, Math.max(0, now - t0) / ms);   // rAF 时间戳可能早于点击时记下的 t0
      step(ease(p));
      if (p < 1) anims.set(key, requestAnimationFrame(f)); else { anims.delete(key); done && done(); }
    };
    anims.set(key, requestAnimationFrame(f));
  }
  function flash(node, cls) { if (instant) return; node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function setText(node, text, flashCls) {
    const t = String(text);
    if ((node._raw != null ? node._raw : node.textContent) === t) return false;
    node.textContent = t;
    if (t.indexOf('$') >= 0) { node._raw = t; TEX.typeset(node); } else node._raw = null;
    if (flashCls) flash(node, flashCls);
    return true;
  }
  // 按 key 复用 DOM：移动 FLIP 平滑过渡，新增淡入，删除淡出（容器需 position:relative）
  function keyed(box, items, keyOf, create, update) {
    const ms = dur();
    const old = new Map();
    for (const c of [...box.children]) if (c.dataset.key != null && !c.classList.contains('av-leaving')) old.set(c.dataset.key, c);
    const first = new Map();
    if (ms) old.forEach((c, k) => first.set(k, c.getBoundingClientRect().top));
    const want = new Set(items.map(it => String(keyOf(it))));
    old.forEach((c, k) => {
      if (want.has(k)) return;
      if (!ms) { c.remove(); return; }
      const st = { position: 'absolute', top: c.offsetTop + 'px', left: c.offsetLeft + 'px', width: c.offsetWidth + 'px' };
      c.classList.add('av-leaving');
      Object.assign(c.style, st, { transition: `opacity ${ms}ms, transform ${ms}ms`, pointerEvents: 'none' });
      requestAnimationFrame(() => { c.style.opacity = 0; c.style.transform = 'translateX(18px)'; });
      setTimeout(() => c.remove(), ms + 40);
    });
    const nodes = items.map(it => {
      const k = String(keyOf(it));
      let c = old.get(k), isNew = false;
      if (!c) { c = create(it); c.dataset.key = k; isNew = true; }
      update(c, it, isNew);
      box.appendChild(c);
      return c;
    });
    if (!ms) return;
    nodes.forEach(c => {
      const k = c.dataset.key;
      if (!first.has(k)) { flash(c, 'av-enter'); return; }
      const dy = first.get(k) - c.getBoundingClientRect().top;
      if (Math.abs(dy) < .5) return;
      c.style.transition = 'none';
      c.style.transform = `translateY(${dy}px)`;
      void c.offsetWidth;
      c.style.transition = `transform ${ms}ms cubic-bezier(.4,0,.2,1), background ${ms}ms, color ${ms}ms`;
      c.style.transform = '';
      setTimeout(() => { c.style.transition = ''; }, ms + 20);
    });
  }

  // ---------- Python 高亮（VS Code Dark Modern + Pylance 语义配色） ----------
  const CTL = new Set('if elif else for while return import from as try except finally raise with break continue pass yield await async del global nonlocal assert match case'.split(' '));
  const KW = new Set('def class lambda None True False and or not in is self cls'.split(' '));
  const CLS = new Set('int float str bool list dict set tuple range object type bytes frozenset complex Exception ValueError KeyError IndexError TypeError deque defaultdict Counter OrderedDict'.split(' '));
  function highlightPython(src) {
    const lines = src.split('\n');
    const modules = new Set();
    for (const l of lines) {
      let m = l.match(/^\s*import\s+([\w., ]+)/);
      if (m) m[1].split(',').forEach(p => { const a = p.trim().split(/\s+as\s+/); modules.add((a[1] || a[0]).split('.')[0].trim()); });
      m = l.match(/^\s*from\s+([\w.]+)\s+import/);
      if (m) modules.add(m[1].split('.')[0]);
    }
    let depth = 0, triple = null;
    const re = /(#.*)|([rRbBuUfF]{0,2})("""|'''|"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)|(\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?j?)|([A-Za-z_\u00c0-\uffff][\w\u00c0-\uffff]*)|([()[\]{}])|(\s+)|([\s\S])/y;
    return lines.map(raw => {
      const line = raw.replace(/\t/g, '    ');
      const indent = line.match(/^ */)[0].length;
      const toks = [];
      let i = indent;
      if (triple) {
        const end = line.indexOf(triple, i);
        if (end < 0) return { html: `<span class="t-str">${esc(line.slice(i))}</span>`, indent, cmt: false };
        toks.push(['str', line.slice(i, end + 3)]); i = end + 3; triple = null;
      }
      while (i < line.length) {
        re.lastIndex = i;
        const m = re.exec(line);
        if (!m) break;
        if (m[1]) toks.push(['cmt', m[1]]);
        else if (m[3] !== undefined && (m[3] || m[2])) {
          if (m[2]) toks.push([/[fF]/.test(m[2]) ? 'kw' : 'str', m[2]]);
          let s = m[3];
          if (s === '"""' || s === "'''") {
            const end = line.indexOf(s, re.lastIndex);
            if (end < 0) { s = line.slice(m.index + m[2].length); triple = m[3]; re.lastIndex = line.length; }
            else { s = line.slice(m.index + m[2].length, end + 3); re.lastIndex = end + 3; }
          }
          toks.push(['str', s]);
        }
        else if (m[4]) toks.push(['num', m[4]]);
        else if (m[5]) toks.push(['id', m[5]]);
        else if (m[6]) toks.push(['br', m[6]]);
        else if (m[7]) toks.push(['ws', m[7]]);
        else toks.push(['op', m[8]]);
        i = re.lastIndex;
      }
      const sig = toks.map((t, k) => k).filter(k => toks[k][0] !== 'ws');
      const html = toks.map((t, k) => {
        const [type, w] = t;
        if (type === 'ws') return w;
        if (type === 'br') {
          if ('([{'.includes(w)) { const c = depth % 3; depth++; return `<span class="t-b${c}">${w}</span>`; }
          depth = Math.max(0, depth - 1); return `<span class="t-b${depth % 3}">${w}</span>`;
        }
        if (type !== 'id') return `<span class="t-${type}">${esc(w)}</span>`;
        const p = sig.indexOf(k), prev = p > 0 ? toks[sig[p - 1]][1] : '', next = p < sig.length - 1 ? toks[sig[p + 1]][1] : '';
        let c = 'var';
        if (prev === 'def') c = 'fn';
        else if (prev === 'class') c = 'cls';
        else if (CTL.has(w)) c = 'ctl';
        else if (KW.has(w)) c = 'kw';
        else if (prev === '.') c = next === '(' ? 'fn' : 'var';
        else if (modules.has(w)) c = 'cls';
        else if (next === '(') c = CLS.has(w) || /^[A-Z]/.test(w) ? 'cls' : 'fn';
        else if (CLS.has(w)) c = 'cls';
        else if (/^[A-Z][A-Z0-9_]+$/.test(w)) c = 'const';
        return `<span class="t-${c}">${esc(w)}</span>`;
      }).join('');
      return { html, indent, cmt: line.trim().startsWith('#') };
    });
  }

  // ---------- 代码面板 ----------
  let srcLines = [], codeEls = [], activeCodeLines = new Set();
  function mountCode(fileName) {
    const src = $('py-source').textContent.replace(/\r\n?/g, '\n').replace(/^\n/, '').replace(/\s+$/, '');
    srcLines = src.split('\n');
    activeCodeLines = new Set();
    $('fileName').textContent = fileName || '';
    const body = $('codeBody');
    body.innerHTML = '';
    codeEls = highlightPython(src).map((h, k) => {
      const ln = el('div', 'ln' + (h.cmt ? ' cmt' : ''));
      ln.innerHTML = `<span class="g">${k + 1}</span><span class="s" style="--ind:${h.indent}">${h.html || ' '}</span>`;
      body.appendChild(ln);
      return ln;
    });
  }
  // 按源码内容定位行号：lineOf('res += 1')，nth 表示第几处匹配（忽略注释部分）
  function lineOf(text, nth = 1) {
    let cnt = 0;
    for (let k = 0; k < srcLines.length; k++) {
      const code = srcLines[k].replace(/#.*$/, '');
      if (code.includes(text) && ++cnt === nth) return k + 1;
    }
    console.error('[AV] lineOf 未找到：', text, nth);
    return 0;
  }
  function setCodeLines(lines) {
    lines = (lines || []).filter(Boolean);
    const set = new Set(lines);
    if (set.size === activeCodeLines.size && [...set].every(k => activeCodeLines.has(k))) return;
    for (const k of activeCodeLines) if (!set.has(k)) codeEls[k - 1]?.classList.remove('on');
    for (const k of set) if (!activeCodeLines.has(k)) codeEls[k - 1]?.classList.add('on');
    activeCodeLines = set;
    const sorted = [...set].sort((a, b) => a - b);
    $('codePos').textContent = sorted.length ? `第 ${sorted.length > 1 && sorted.at(-1) - sorted[0] === sorted.length - 1 ? sorted[0] + '–' + sorted.at(-1) : sorted.join(', ')} 行` : '';
    if (!sorted.length) return;
    const body = $('codeBody'), a = codeEls[sorted[0] - 1], b = codeEls[sorted.at(-1) - 1];
    const top = a.offsetTop, bottom = b.offsetTop + b.offsetHeight, vt = body.scrollTop, vh = body.clientHeight;
    if (top < vt + vh * .12 || bottom > vt + vh * .82) body.scrollTo({ top: Math.max(0, top - vh * .3), behavior: instant ? 'auto' : 'smooth' });
  }

  // ---------- 播放器与布局 ----------
  let D, data, steps = [], cur = 0, timer = null;
  const statEls = {}, P = { aux: {}, auxCard: {} };
  // 速度从左到右递增，填充越满越快；0 为 2600ms，100 为 300ms。
  const speedMs = () => 2600 - 23 * Number($('speed').value);
  function setSpeed() {
    DUR = clamp(Math.round(speedMs() * .5), 180, 650);
    document.documentElement.style.setProperty('--dur', DUR + 'ms');
  }

  function setStat(def, val) {
    const t = statEls[def.key];
    const o = val !== null && typeof val === 'object' ? val : { v: val };
    const v = o.v ?? '—';
    if (typeof v === 'number' && typeof t.cur === 'number' && t.cur !== v && !instant) {
      const a = t.cur;
      animate('stat-' + def.key, p => { t.n.textContent = Math.round(a + (v - a) * p); });
      flash(t.box, 'bump');
    } else {
      if (anims.has('stat-' + def.key)) { cancelAnimationFrame(anims.get('stat-' + def.key)); anims.delete('stat-' + def.key); }
      t.n.textContent = v;
    }
    t.cur = v;
    t.unit.textContent = o.unit || '';
    t.sub.textContent = o.sub || '';
  }

  function render(prev) {
    const s = steps[cur];
    const pct = (steps.length > 1 ? cur / (steps.length - 1) * 100 : 100) + '%';
    $('prog').style.width = pct;
    $('thumb').style.left = pct;
    $('progTip').style.left = pct;
    $('progTip').textContent = `第 ${cur + 1} 步`;
    $('stepNo').textContent = `${cur + 1} / ${steps.length}`;
    const html = (s.tag ? `<span class="tag ${s.tag.kind || 'info'}">${s.tag.text}</span>` : '') + s.desc;
    if (setHTML($('desc'), html)) { flash($('desc'), 'fade-in'); }
    setText($('phase'), s.phase || '');
    (D.stats || []).forEach(def => setStat(def, s.stats ? s.stats[def.key] : undefined));
    setCodeLines(s.lines);
    D.render(s, prev, data, P);
    TEX.flush();
  }
  function go(k) {
    k = clamp(k, 0, steps.length - 1);
    const prev = steps[cur];
    cur = k;
    render(prev === steps[cur] ? null : prev);
  }
  function stop() { finishDrag?.(); clearTimeout(timer); timer = null; $('btnPlay').textContent = '▶ 播放'; }
  function play() {
    if (timer) return stop();
    if (cur >= steps.length - 1) go(0);
    $('btnPlay').textContent = '⏸ 暂停';
    const tick = () => {
      if (cur >= steps.length - 1) return stop();
      go(cur + 1);
      timer = setTimeout(tick, speedMs());
    };
    timer = setTimeout(tick, 120);
  }
  function withInstant(fn) { const was = instant; instant = true; document.body.classList.add('instant'); try { fn(); } finally { instant = was; if (!was) { void document.body.offsetWidth; document.body.classList.remove('instant'); } } }

  // A gesture owns one pending frame; finish/interrupt always flushes its final position.
  let finishDrag = null;
  function frameDrag(node, begin, update, end) {
    node.addEventListener('pointerdown', e => {
      if (!e.isPrimary || e.button !== 0) return;
      finishDrag?.();
      const context = begin(e);
      if (!context) return;
      e.preventDefault();
      const pointerId = e.pointerId;
      let latestX = e.clientX, frame = 0, dirty = true, ended = false;
      const flush = () => {
        frame = 0;
        if (dirty) { dirty = false; update(latestX, context); }
      };
      const move = ev => {
        if (ev.pointerId !== pointerId) return;
        latestX = ev.clientX; dirty = true;
        if (!frame) frame = requestAnimationFrame(flush);
      };
      const finish = ev => {
        if (ended || (ev?.pointerId != null && ev.pointerId !== pointerId)) return;
        ended = true;
        if (ev?.type === 'pointerup') { latestX = ev.clientX; dirty = true; }
        cancelAnimationFrame(frame);
        finishDrag = null;
        node.removeEventListener('pointermove', move);
        for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) node.removeEventListener(type, finish);
        window.removeEventListener('blur', finish);
        document.removeEventListener('visibilitychange', hidden);
        try { flush(); } finally {
          end(context);
          if (node.hasPointerCapture(pointerId)) node.releasePointerCapture(pointerId);
        }
      };
      const hidden = () => { if (document.hidden) finish(); };
      finishDrag = finish;
      node.addEventListener('pointermove', move);
      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) node.addEventListener(type, finish);
      window.addEventListener('blur', finish);
      document.addEventListener('visibilitychange', hidden);
      node.setPointerCapture(pointerId);
      frame = requestAnimationFrame(flush);
    });
  }
  function beginScrub() {
    const was = instant;
    instant = true;
    document.body.classList.add('instant');
    for (const id of anims.values()) cancelAnimationFrame(id);
    anims.clear();
    // Stop a previously started smooth code scroll before following the pointer.
    const body = $('codeBody');
    body.scrollTo({ top: body.scrollTop, behavior: 'instant' });
    return () => {
      instant = was;
      if (!was) { void document.body.offsetWidth; document.body.classList.remove('instant'); }
    };
  }

  // 输入框内容与哪个预设一致就高亮哪个按钮（同值时优先刚点的那个），手动改输入后自动取消
  let lastPreset = -1;
  function markPreset() {
    const same = p => Object.keys(p.values).every(k => $('in-' + k) && String($('in-' + k).value) === String(p.values[k]));
    const list = D.presets || [], hit = list[lastPreset] && same(list[lastPreset]) ? lastPreset : list.findIndex(same);
    $('inputs').querySelectorAll('button.preset').forEach((b, i) => b.classList.toggle('on', i === hit));
  }
  function apply() {
    stop();
    markPreset();
    const values = {};
    (D.inputs || []).forEach(f => { values[f.id] = $('in-' + f.id).value; });
    const r = D.parse(values);
    if (r.error) { $('err').textContent = r.error; return false; }
    $('err').textContent = '';
    data = r;
    steps = D.build(data);
    for (const k in P.aux) P.aux[k].innerHTML = '';
    $('canvas').innerHTML = ''; $('state').innerHTML = '';
    withInstant(() => {
      D.mount(data, P);
      cur = 0;
      D.layout && D.layout(data, P);
      render(null);
    });
    return true;
  }

  function buildShell() {
    document.title = D.title;
    $('title').textContent = D.title;
    $('subtitle').innerHTML = D.subtitle || '';
    const inputs = $('inputs');
    (D.inputs || []).forEach(f => {
      inputs.appendChild(el('label', '', f.label));
      const inp = el('input');
      inp.type = f.type || 'text'; inp.id = 'in-' + f.id; inp.value = f.value;
      if (f.width) inp.style.width = f.width + 'px';
      if (f.flex) { inp.style.flex = '1'; inp.style.minWidth = '200px'; }
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') apply(); });
      inputs.appendChild(inp);
    });
    const btn = el('button', 'primary', '生成演示'); btn.onclick = apply; inputs.appendChild(btn);
    if (D.presets && D.presets.length) inputs.appendChild(el('span', 'hint', '预设：'));
    (D.presets || []).forEach((p, i) => {
      const b = el('button', 'preset', p.label);
      b.onclick = () => { lastPreset = i; for (const k in p.values) $('in-' + k).value = p.values[k]; apply(); };
      inputs.appendChild(b);
    });
    inputs.addEventListener('input', markPreset);
    inputs.appendChild(el('span', 'err')).id = 'err';

    (D.stats || []).forEach(def => {
      const box = el('div', 'stat ' + (def.color || 'blue'));
      box.innerHTML = `<div class="lab">${def.label}</div><div class="num"><span class="n">—</span><small></small></div><div class="sub"></div>`;
      $('stats').appendChild(box);
      statEls[def.key] = { box, n: box.querySelector('.n'), unit: box.querySelector('small'), sub: box.querySelector('.sub'), cur: null };
    });

    const pn = D.panels || {};
    $('canvasTitle').textContent = pn.canvas?.title || '';
    $('canvasHint').textContent = pn.canvas?.hint || '';
    $('stateTitle').textContent = pn.state?.title || '';
    $('stateHint').textContent = pn.state?.hint || '';
    P.canvas = $('canvas'); P.state = $('state'); P.stateHint = $('stateHint'); P.stateCard = $('stateCard');
    (pn.aux || []).forEach(a => {
      const card = el('div', 'card' + (a.grow ? ' grow' : ''));
      card.innerHTML = `<div class="card-h"><span>${a.title}</span><span class="hint">${a.hint || ''}</span></div><div class="card-b"></div>`;
      $('auxCol').appendChild(card);
      P.aux[a.id] = card.querySelector('.card-b');
      P.auxCard[a.id] = card;
    });
    mountCode(D.file);
  }

  function wire() {
    $('btnFirst').onclick = () => { stop(); go(0); };
    $('btnLast').onclick = () => { stop(); go(steps.length - 1); };
    $('btnPrev').onclick = () => { stop(); go(cur - 1); };
    $('btnNext').onclick = () => { stop(); go(cur + 1); };
    $('btnPlay').onclick = play;
    $('speed').oninput = setSpeed;
    // Cache geometry once; coalesce pointer events and keep snapshots immediate while scrubbing.
    const bar = $('progress');
    frameDrag(bar, () => {
      stop();
      const rect = bar.getBoundingClientRect();
      const restore = beginScrub();
      bar.classList.add('dragging');
      return { rect, restore, first: true };
    }, (x, ctx) => {
      const k = Math.round(clamp((x - ctx.rect.left) / ctx.rect.width, 0, 1) * (steps.length - 1));
      if (ctx.first || k !== cur) { ctx.first = false; go(k); }
    }, ctx => { bar.classList.remove('dragging'); ctx.restore(); });
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
      else if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
      else if (e.key === ' ') { e.preventDefault(); play(); }
      else if (e.key === 'Home') { stop(); go(0); }
      else if (e.key === 'End') { stop(); go(steps.length - 1); }
    });

    // 代码面板：可拖动宽度 / 折叠 / 注释开关 / 字号
    const app = $('app'), sp = $('splitter'), LS = 'algoviz.';
    const defW = () => clamp(Math.round(window.innerWidth * .4), 420, 820);
    const setW = w => app.style.setProperty('--code-w', clamp(w, 320, window.innerWidth - 700) + 'px');
    setW(+localStorage.getItem(LS + 'codeW') || defW());
    frameDrag(sp, () => {
      if (app.classList.contains('code-collapsed')) return null;
      stop();
      const right = app.getBoundingClientRect().right - 16;
      const restore = beginScrub();
      app.classList.add('dragging');
      return { right, restore };
    }, (x, ctx) => setW(ctx.right - x - 6), ctx => {
      app.classList.remove('dragging');
      ctx.restore();
      localStorage.setItem(LS + 'codeW', parseInt(app.style.getPropertyValue('--code-w')));
    });
    sp.ondblclick = () => { localStorage.removeItem(LS + 'codeW'); setW(defW()); };
    const setCollapsed = c => { app.classList.toggle('code-collapsed', c); $('btnCollapse').textContent = c ? '⇤' : '⇥'; localStorage.setItem(LS + 'collapsed', c ? 1 : ''); };
    setCollapsed(!!localStorage.getItem(LS + 'collapsed'));
    $('btnCollapse').onclick = () => setCollapsed(!app.classList.contains('code-collapsed'));
    const setCmt = show => { $('codeBody').classList.toggle('no-cmt', !show); $('btnCmt').classList.toggle('on', show); localStorage.setItem(LS + 'hideCmt', show ? '' : 1); };

  // ---------- 自检：文字互相遮挡 / 左侧需滚动 / 代码横向滚动 ----------

      land: '∧', wedge: '∧', lor: '∨', vee: '∨', neg: '¬', lnot: '¬',

inputs:[{id:'p',label:'起点 x y → 终点 x y',value:presets[0].values.p,flex:true}],presets,
stats:[{key:'g',label:'当前步数',color:'blue'},{key:'h',label:'剩余估计',color:'purple'},{key:'expanded',label:'已扩展格子',color:'amber'},{key:'frontier',label:ASTAR?'堆中条目':'队列长度',color:'blue'},{key:'answer',label:'最短步数',color:'green'}],
panels:{canvas:{title:'1000×1000 棋盘 · 局部栅格',hint:'显示搜索涉及的局部区域；不把视窗当成棋盘边界。格内数字为 dist。'},state:{title:'当前操作',hint:'蓝：当前；浅蓝：待处理；灰：已扩展；黄：候选格；绿：最短路径；S 起点、T 终点'},aux:[{id:'queue',title:ASTAR?'优先队列与距离记录':'FIFO 队列与距离记录',hint:ASTAR?'按 (g+h,h,g,x,y) 排序；展示前3项':'队首先出；展示前3项。dist 存在即已访问。',grow:true}]},
parse(v){const a=v.p.trim().split(/[\s,]+/).map(Number);if(a.length!==4||a.some(x=>!Number.isInteger(x)||x<1||x>1000))return {error:'请输入四个 1～1000 的整数。'};if(Math.abs(a[0]-a[2])>9||Math.abs(a[1]-a[3])>9)return {error:'为保证逐步演示流畅，动画起终点各方向相距最多9格；Python代码支持完整棋盘。'};return {a};},
build({a}){
const [sx,sy,tx,ty]=a,dist=new Map([[key(sx,sy),0]]),parent=new Map(),closed=new Set(),steps=[];let current=null,g=0,h=estimate(sx,sy,tx,ty),queue=[[h,h,0,sx,sy]],path=[],answer=null,candidate=null,detail="";
const order=(a,b)=>{for(let i=0;i<5;i++){if(a[i]!==b[i])return a[i]-b[i];}return 0;};
function snap(phase,desc,line){steps.push({phase,desc,tag:{text:phase,kind:answer===null?'info':'hit'},lines:[L(line)],dist:[...dist],closed:[...closed],queue:queue.map(q=>q.slice()),current:current&&current.slice(),candidate:candidate&&candidate.slice(),detail,path:path.map(p=>p.slice()),answer,stats:{g,h:ASTAR?h:'—',expanded:closed.size,frontier:queue.length,answer:answer===null?'—':answer}});}
snap('初始化','起点距离设为0，加入待处理队列。',ASTAR?'queue = [(h, h, 0, a1, a2)]':'queue = deque([(a1, a2)])');
while(queue.length){
if(ASTAR)queue.sort(order);
const item=queue.shift();const x=item[3],y=item[4];g=item[2];h=ASTAR?item[1]:0;current=[x,y];candidate=null;detail='';
snap('取出节点',`当前 (${x},${y})，条目步数 step=${g}${ASTAR?'，h='+h+'，f='+(g+h):'；队首最先取出'}。`,ASTAR?'total, h, step, x, y = heapq.heappop(queue)':'x, y = queue.popleft()');
if(ASTAR){
 const stale=g!==dist.get(key(x,y));
 snap('检查过期条目',`step=${g}，dist[(${x},${y})]=${dist.get(key(x,y))}；step != dist → ${stale?'True，旧路径已被更短记录替代，跳过本轮。':'False，当前条目有效，继续搜索。'}`,'if step != dist[(x, y)]:');
 if(stale){snap('跳过旧条目','continue 返回 while 顶部，取下一个堆顶，不扩展当前旧路径。','continue');continue;}
}
if(x===tx&&y===ty){
 answer=g;const full=[];let p=[tx,ty];while(p){full.push(p);p=parent.get(key(...p));}full.reverse();
 snap('到达终点',`最短步数为 ${g}。下面从起点逐跳回放路径，每次增加一条合法骑士移动。`,'ans.append(str(step))');
 for(let i=0;i<full.length;i++){path=full.slice(0,i+1);detail=`路径回放：已经走 ${i} / ${g} 步；当前位置 (${full[i].join(',')})。`;snap(i===0?'路径起点':'路径第 '+i+' 步',detail+' 此回放是动画额外展示，不属于提交代码执行。','ans.append(str(step))');}
 snap('最终答案',`最短路径共 ${g} 步；每条绿色箭头代表一步。`,'print(');break;
}
closed.add(key(x,y));
for(let dir=0;dir<dirs.length;dir++){
 const [dx,dy]=dirs[dir],nx=x+dx,ny=y+dy;candidate=[nx,ny];
 detail=`方向 ${dir+1}/8：偏移 (${dx},${dy})，候选 (${nx},${ny})，候选步数 ${g}+1=${g+1}。`;
 snap('枚举第 '+(dir+1)+' 个方向',detail,'for dx, dy in direction:');
 snap('计算 next_x',`next_x = ${x} + (${dx}) = ${nx}。`,'next_x = x + dx');
 snap('计算 next_y',`next_y = ${y} + (${dy}) = ${ny}。`,'next_y = y + dy');
 const outside=nx<1||nx>1000||ny<1||ny>1000;
 snap('检查边界',`候选 (${nx},${ny}) ${outside?'超出':'位于'}完整棋盘 [1,1000] 范围${outside?'，跳过该方向。':'，继续检查访问记录。'}`,'if next_x < 1');
 if(outside)continue;
 const k=key(nx,ny),known=dist.has(k),improve=!known||(ASTAR&&g+1<dist.get(k));
 snap('判断是否入队',`候选步数 ${g+1}；原记录 ${known?dist.get(k):'不存在'}。${improve?'首次发现或找到更短路径，可以更新。':'已有相同或更短路径，跳过。'}`,ASTAR?'if cur not in dist or step + 1 < dist[cur]:':'if cur not in dist:');
 if(improve){
 dist.set(k,g+1);parent.set(k,[x,y]);snap('记录最短步数',`dist[(${nx},${ny})] = ${g} + 1 = ${g+1}。入队前标记，防止重复发现。`,'dist[cur] = step + 1');
 const nh=estimate(nx,ny,tx,ty);
 if(ASTAR)snap('计算剩余估计',`候选 (${nx},${ny}) 的 h=${nh}，预计总步数 ${g+1}+${nh}=${g+1+nh}。`,'h = estimate(next_x, next_y, b1, b2)');
 queue.push([g+1+nh,nh,g+1,nx,ny]);
 snap(ASTAR?'加入优先队列':'加入队尾',ASTAR?`压入 (${g+1+nh}, ${nh}, ${g+1}, ${nx}, ${ny})，按 f、h 等字段排序。`:`把 (${nx},${ny}) 加入队尾，后续从队首取出。`,ASTAR?'heapq.heappush(queue,':'queue.append(cur)');
 }
}
candidate=null;detail='八个方向枚举完成，准备取出下一个节点。';
}

return steps;
},
mount(d,P){
P.canvas.innerHTML='<div class="kn-map"><svg><defs><marker id="kn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#16a34a"/></marker></defs><g class="kn-grid"></g><g class="kn-route"></g></svg></div>';
P.state.innerHTML='<div class="kn-explain"></div><div class="kn-path"></div>';
P.aux.queue.innerHTML='<div class="kn-front"></div><div class="kn-distance"></div>';
U={svg:P.canvas.querySelector('svg'),grid:P.canvas.querySelector('.kn-grid'),route:P.canvas.querySelector('.kn-route'),explain:P.state.querySelector('.kn-explain'),path:P.state.querySelector('.kn-path'),front:P.aux.queue.querySelector('.kn-front'),distance:P.aux.queue.querySelector('.kn-distance'),cells:[],lines:[],state:null};
},
layout(d){
const states=D.build(d),last=states.at(-1),points=last.dist.map(([k])=>k.split(',').map(Number));points.push([d.a[0],d.a[1]],[d.a[2],d.a[3]]);
U.x0=Math.max(1,Math.min(...points.map(p=>p[0]))-1);U.x1=Math.min(1000,Math.max(...points.map(p=>p[0]))+1);U.y0=Math.max(1,Math.min(...points.map(p=>p[1]))-1);U.y1=Math.min(1000,Math.max(...points.map(p=>p[1]))+1);
const cols=U.x1-U.x0+1,rows=U.y1-U.y0+1;U.size=Math.min((U.svg.clientWidth-52)/cols,(U.svg.clientHeight-32)/rows,40);const w=cols*U.size,hh=rows*U.size;U.ox=(U.svg.clientWidth-w)/2;U.oy=(U.svg.clientHeight-hh)/2;U.grid.replaceChildren();U.route.replaceChildren();U.cells=[];U.lines=[];
const sv=t=>document.createElementNS('http://www.w3.org/2000/svg',t);
for(let y=U.y0;y<=U.y1;y++)for(let x=U.x0;x<=U.x1;x++){
const r=sv('rect'),t=sv('text');r.setAttribute('x',U.ox+(x-U.x0)*U.size);r.setAttribute('y',U.oy+(U.y1-y)*U.size);r.setAttribute('width',U.size);r.setAttribute('height',U.size);r.setAttribute('stroke','#dbe3ef');t.setAttribute('x',U.ox+(x-U.x0+.5)*U.size);t.setAttribute('y',U.oy+(U.y1-y+.5)*U.size);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');t.setAttribute('font-size',Math.max(7,Math.min(12,U.size*.4)));U.grid.append(r,t);U.cells.push({x,y,r,t});}
for(let x=U.x0;x<=U.x1;x++){const t=sv('text');t.textContent=x;t.setAttribute('x',U.ox+(x-U.x0+.5)*U.size);t.setAttribute('y',U.oy+hh+15);t.setAttribute('font-size','9');t.setAttribute('text-anchor','middle');U.grid.append(t);}
for(let y=U.y0;y<=U.y1;y++){const t=sv('text');t.textContent=y;t.setAttribute('x',U.ox-6);t.setAttribute('y',U.oy+(U.y1-y+.5)*U.size);t.setAttribute('font-size','9');t.setAttribute('text-anchor','end');U.grid.append(t);}
for(let i=0;i<last.path.length-1;i++){const line=sv('line');line.setAttribute('stroke','#16a34a');line.setAttribute('stroke-width','2');line.setAttribute('marker-end','url(#kn-arrow)');line.style.opacity=0;U.route.append(line);U.lines.push(line);}
},
render(s,prev,d){
const dist=new Map(s.dist),closed=new Set(s.closed),path=new Set(s.path.map(p=>key(...p))),[sx,sy,tx,ty]=d.a;
for(const c of U.cells){const k=key(c.x,c.y),start=c.x===sx&&c.y===sy,target=c.x===tx&&c.y===ty,cur=s.current&&c.x===s.current[0]&&c.y===s.current[1],trying=s.candidate&&c.x===s.candidate[0]&&c.y===s.candidate[1];c.r.style.fill=trying?'#fcd34d':path.has(k)?'#bbf7d0':cur?'#93c5fd':start?'#ddd6fe':target?'#fecaca':closed.has(k)?'#e2e8f0':dist.has(k)?'#dbeafe':'#fff';setText(c.t,(start&&target?'ST':start?'S':target?'T':dist.has(k)?dist.get(k):''));}
for(let i=0;i<U.lines.length;i++){const line=U.lines[i];line.style.opacity=i<s.path.length-1?'1':'0';if(i<s.path.length-1){const a=s.path[i],b=s.path[i+1];line.setAttribute('x1',U.ox+(a[0]-U.x0+.5)*U.size);line.setAttribute('y1',U.oy+(U.y1-a[1]+.5)*U.size);line.setAttribute('x2',U.ox+(b[0]-U.x0+.5)*U.size);line.setAttribute('y2',U.oy+(U.y1-b[1]+.5)*U.size);}}
setText(U.explain,s.detail?s.detail:s.current?`当前位置 (${s.current.join(', ')})；step=${s.stats.g}${ASTAR?'，h='+s.stats.h:''}。`:'S 为起点，T 为终点；坐标仍属于完整1000×1000棋盘。');setText(U.path,s.answer===null?'目标出队后逐跳回放最短路径。':`路径回放 ${Math.max(0,s.path.length-1)}/${s.answer} 步：`+s.path.map(p=>'('+p.join(',')+')').join(' → '));
const q=ASTAR?s.queue.slice().sort((a,b)=>{for(let i=0;i<5;i++){if(a[i]!==b[i])return a[i]-b[i];}return 0;}):s.queue;
setText(U.front,(ASTAR?'堆顶顺序：':'队首 → 队尾：')+'\n'+q.slice(0,3).map(p=>`(${p[3]},${p[4]}) g=${p[2]}`+(ASTAR?` h=${p[1]} f=${p[0]}`:'')).join('\n')+(q.length>3?'\n……其余 '+(q.length-3)+' 项':''));
setText(U.distance,'独立访问记录：坐标 → dist（存在即已访问）\n'+s.dist.slice(-4).map(([k,v])=>'['+k+'] → '+v+' / True').join('\n'));
}
};window.KNIGHT_DEMO=D;AV.start(D);
})();

</script>
