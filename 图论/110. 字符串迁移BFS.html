/* =====================================================================

   ===================================================================== */
:root {

  --blue: #2563eb; --green: #16a34a; --red: #dc2626; --amber: #d97706; --purple: #7c3aed; --gray: #64748b;
  --blue-l: #eff6ff; --green-l: #f0fdf4; --red-l: #fef2f2; --amber-l: #fffbeb; --purple-l: #f5f3ff;
  --dur: 420ms; --ease: cubic-bezier(.4, 0, .2, 1);
  --code-w: 720px; --code-fs: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

  padding: 0 16px 14px 20px; transition: grid-template-columns var(--dur) var(--ease); }

<!-- 对应 .py 的完整源码，用 scripts/embed_source.py 写入（保持与源文件一致） -->
<script type="text/plain" id="py-source">
def judge(s1,s2):
    count=0
    for i in range(len(s1)):
        if s1[i]!=s2[i]:
            count+=1
    return count==1


import sys
from collections import deque

sys.stdin = open('input.txt', 'r')
n=int(input())
beginstr,endstr=map(str,input().split())
if beginstr==endstr:
    # 序列只包含起点本身，因此字符串数为 1。
    print(1)
    exit()

# 节点 0 是起点，节点 1 至 n 是 strlist 中的字符串，节点 n + 1 是终点
# 收录所有字符串
strlist=[]
for i in range(n):
    strlist.append(input())

nodes = [beginstr] + strlist + [endstr]
node_count = n + 2

# 建立连接矩阵：两个字符串只相差一个字符时，表示两个节点相连
graph = [[0] * node_count for _ in range(node_count)]
for i in range(node_count):
    for j in range(i + 1, node_count):
        if judge(nodes[i], nodes[j]):
            graph[i][j] = 1
            graph[j][i] = 1

# 使用 BFS 搜索从节点 0 到节点 n + 1 的最短路径
# 集合保存已经发现的节点编号，成员查询平均为 O(1)。
visited = set()
distance = [0] * node_count
queue = deque([0])
visited.add(0)

while queue:
    current = queue.popleft()
    if current == n + 1:
        # distance 记录迁移次数（边数），字符串数需要再加上起点。
        print(distance[current] + 1)
        break

    for next_node in range(node_count):
        # 两个条件必须同时成立，才发现并加入一个新的相邻节点：
        # 1. graph[current][next_node] == 1：两个字符串恰好相差一位，可以直接迁移。
        # 2. next_node not in visited：这个节点以前没有被发现，避免重复入队。
        # and 从左到右短路判断：如果不相连，就不再检查第二个条件。
        if graph[current][next_node] == 1 and next_node not in visited:
            # 发现时立即加入集合，避免同一节点被不同邻居重复放入队列。
            visited.add(next_node)
            distance[next_node] = distance[current] + 1
            queue.append(next_node)
else:
    print(0)
</script>

    });

      const k = String(keyOf(it));

      if (!c) { c = create(it); c.dataset.key = k; isNew = true; }

    });

  // ---------- Python 高亮（VS Code Dark Modern + Pylance 语义配色） ----------
  const CTL = new Set('if elif else for while return import from as try except finally raise with break continue pass yield await async del global nonlocal assert match case'.split(' '));
  const KW = new Set('def class lambda None True False and or not in is self cls'.split(' '));
  const CLS = new Set('int float str bool list dict set tuple range object type bytes frozenset complex Exception ValueError KeyError IndexError TypeError deque defaultdict Counter OrderedDict'.split(' '));
  function highlightPython(src) {
    const lines = src.split('\n');
    const modules = new Set();
    for (const l of lines) {
      let m = l.match(/^\s*import\s+([\w., ]+)/);
      if (m) m[1].split(',').forEach(p => { const a = p.trim().split(/\s+as\s+/); modules.add((a[1] || a[0]).split('.')[0].trim()); });
      m = l.match(/^\s*from\s+([\w.]+)\s+import/);
      if (m) modules.add(m[1].split('.')[0]);
    }
    let depth = 0, triple = null;
    const re = /(#.*)|([rRbBuUfF]{0,2})("""|'''|"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)|(\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?j?)|([A-Za-z_\u00c0-\uffff][\w\u00c0-\uffff]*)|([()[\]{}])|(\s+)|([\s\S])/y;
    return lines.map(raw => {
      const line = raw.replace(/\t/g, '    ');
      const indent = line.match(/^ */)[0].length;
      const toks = [];
      let i = indent;
      if (triple) {
        const end = line.indexOf(triple, i);
        if (end < 0) return { html: `<span class="t-str">${esc(line.slice(i))}</span>`, indent, cmt: false };
        toks.push(['str', line.slice(i, end + 3)]); i = end + 3; triple = null;
      }
      while (i < line.length) {
        re.lastIndex = i;
        const m = re.exec(line);
        if (!m) break;
        if (m[1]) toks.push(['cmt', m[1]]);
        else if (m[3] !== undefined && (m[3] || m[2])) {
          if (m[2]) toks.push([/[fF]/.test(m[2]) ? 'kw' : 'str', m[2]]);
          let s = m[3];
          if (s === '"""' || s === "'''") {
            const end = line.indexOf(s, re.lastIndex);
            if (end < 0) { s = line.slice(m.index + m[2].length); triple = m[3]; re.lastIndex = line.length; }
            else { s = line.slice(m.index + m[2].length, end + 3); re.lastIndex = end + 3; }
          }
          toks.push(['str', s]);
        }
        else if (m[4]) toks.push(['num', m[4]]);
        else if (m[5]) toks.push(['id', m[5]]);
        else if (m[6]) toks.push(['br', m[6]]);
        else if (m[7]) toks.push(['ws', m[7]]);
        else toks.push(['op', m[8]]);
        i = re.lastIndex;
      }
      const sig = toks.map((t, k) => k).filter(k => toks[k][0] !== 'ws');
      const html = toks.map((t, k) => {
        const [type, w] = t;
        if (type === 'ws') return w;
        if (type === 'br') {
          if ('([{'.includes(w)) { const c = depth % 3; depth++; return `<span class="t-b${c}">${w}</span>`; }
          depth = Math.max(0, depth - 1); return `<span class="t-b${depth % 3}">${w}</span>`;
        }
        if (type !== 'id') return `<span class="t-${type}">${esc(w)}</span>`;
        const p = sig.indexOf(k), prev = p > 0 ? toks[sig[p - 1]][1] : '', next = p < sig.length - 1 ? toks[sig[p + 1]][1] : '';

        else if (prev === 'class') c = 'cls';
        else if (CTL.has(w)) c = 'ctl';
        else if (KW.has(w)) c = 'kw';
        else if (prev === '.') c = next === '(' ? 'fn' : 'var';
        else if (modules.has(w)) c = 'cls';
        else if (next === '(') c = CLS.has(w) || /^[A-Z]/.test(w) ? 'cls' : 'fn';
        else if (CLS.has(w)) c = 'cls';
        else if (/^[A-Z][A-Z0-9_]+$/.test(w)) c = 'const';
        return `<span class="t-${c}">${esc(w)}</span>`;
      }).join('');
      return { html, indent, cmt: line.trim().startsWith('#') };
    });
  }

  // ---------- 代码面板 ----------
  let srcLines = [], codeEls = [], activeCodeLines = new Set();
  function mountCode(fileName) {
    const src = $('py-source').textContent.replace(/\r\n?/g, '\n').replace(/^\n/, '').replace(/\s+$/, '');
    srcLines = src.split('\n');
    activeCodeLines = new Set();
    $('fileName').textContent = fileName || '';
    const body = $('codeBody');
    body.innerHTML = '';
    codeEls = highlightPython(src).map((h, k) => {
      const ln = el('div', 'ln' + (h.cmt ? ' cmt' : ''));
      ln.innerHTML = `<span class="g">${k + 1}</span><span class="s" style="--ind:${h.indent}">${h.html || ' '}</span>`;
      body.appendChild(ln);
      return ln;
    });
  }
  // 按源码内容定位行号：lineOf('res += 1')，nth 表示第几处匹配（忽略注释部分）
  function lineOf(text, nth = 1) {
    let cnt = 0;
    for (let k = 0; k < srcLines.length; k++) {
      const code = srcLines[k].replace(/#.*$/, '');
      if (code.includes(text) && ++cnt === nth) return k + 1;
    }
    console.error('[AV] lineOf 未找到：', text, nth);
    return 0;
  }
  function setCodeLines(lines) {
    lines = (lines || []).filter(Boolean);
    const set = new Set(lines);
    if (set.size === activeCodeLines.size && [...set].every(k => activeCodeLines.has(k))) return;
    for (const k of activeCodeLines) if (!set.has(k)) codeEls[k - 1]?.classList.remove('on');
    for (const k of set) if (!activeCodeLines.has(k)) codeEls[k - 1]?.classList.add('on');
    activeCodeLines = set;
    const sorted = [...set].sort((a, b) => a - b);
    $('codePos').textContent = sorted.length ? `第 ${sorted.length > 1 && sorted.at(-1) - sorted[0] === sorted.length - 1 ? sorted[0] + '–' + sorted.at(-1) : sorted.join(', ')} 行` : '';
    if (!sorted.length) return;
    const body = $('codeBody'), a = codeEls[sorted[0] - 1], b = codeEls[sorted.at(-1) - 1];
    const top = a.offsetTop, bottom = b.offsetTop + b.offsetHeight, vt = body.scrollTop, vh = body.clientHeight;

  }

  // ---------- 播放器与布局 ----------

  // 速度从左到右递增，填充越满越快；0 为 2600ms，100 为 300ms。

  function setStat(def, val) {

    const v = o.v ?? '—';
    if (typeof v === 'number' && typeof t.cur === 'number' && t.cur !== v && !instant) {
      const a = t.cur;
      animate('stat-' + def.key, p => { t.n.textContent = Math.round(a + (v - a) * p); });
      flash(t.box, 'bump');
    } else {
      if (anims.has('stat-' + def.key)) { cancelAnimationFrame(anims.get('stat-' + def.key)); anims.delete('stat-' + def.key); }
      t.n.textContent = v;
    }

    t.unit.textContent = o.unit || '';
    t.sub.textContent = o.sub || '';

  function render(prev) {

    $('thumb').style.left = pct;
    $('progTip').style.left = pct;
    $('progTip').textContent = `第 ${cur + 1} 步`;
    $('stepNo').textContent = `${cur + 1} / ${steps.length}`;
    const html = (s.tag ? `<span class="tag ${s.tag.kind || 'info'}">${s.tag.text}</span>` : '') + s.desc;
    if (setHTML($('desc'), html)) { flash($('desc'), 'fade-in'); }

    setCodeLines(s.lines);

  // 输入框内容与哪个预设一致就高亮哪个按钮（同值时优先刚点的那个），手动改输入后自动取消
  let lastPreset = -1;
  function markPreset() {
    const same = p => Object.keys(p.values).every(k => $('in-' + k) && String($('in-' + k).value) === String(p.values[k]));

  }
  function apply() {
    stop();
    markPreset();

    (D.inputs || []).forEach(f => { values[f.id] = $('in-' + f.id).value; });
    const r = D.parse(values);
    if (r.error) { $('err').textContent = r.error; return false; }
    $('err').textContent = '';

    steps = D.build(data);
    for (const k in P.aux) P.aux[k].innerHTML = '';
    $('canvas').innerHTML = ''; $('state').innerHTML = '';

      D.mount(data, P);
      cur = 0;
      D.layout && D.layout(data, P);
      render(null);
    });
    return true;
  }

  function buildShell() {
    document.title = D.title;
    $('title').textContent = D.title;
    $('subtitle').innerHTML = D.subtitle || '';
    const inputs = $('inputs');
    (D.inputs || []).forEach(f => {
      inputs.appendChild(el('label', '', f.label));
      const inp = el('input');
      inp.type = f.type || 'text'; inp.id = 'in-' + f.id; inp.value = f.value;
      if (f.width) inp.style.width = f.width + 'px';
      if (f.flex) { inp.style.flex = '1'; inp.style.minWidth = '200px'; }
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') apply(); });
      inputs.appendChild(inp);
    });
    const btn = el('button', 'primary', '生成演示'); btn.onclick = apply; inputs.appendChild(btn);
    if (D.presets && D.presets.length) inputs.appendChild(el('span', 'hint', '预设：'));
    (D.presets || []).forEach((p, i) => {
      const b = el('button', 'preset', p.label);

      $('stats').appendChild(box);

    });

    $('canvasTitle').textContent = pn.canvas?.title || '';
    $('canvasHint').textContent = pn.canvas?.hint || '';

  function wire() {
    $('btnFirst').onclick = () => { stop(); go(0); };

    $('btnPrev').onclick = () => { stop(); go(cur - 1); };
    $('btnNext').onclick = () => { stop(); go(cur + 1); };

  // ---------- 自检：文字互相遮挡 / 左侧需滚动 / 代码横向滚动 ----------
  function textRects(root) {

      if (!node.textContent.trim()) continue;

      if (host.closest('.av-leaving, svg defs, .slots .empty')) continue;
      const cs = getComputedStyle(host);
      if (cs.visibility === 'hidden' || +cs.opacity === 0) continue;
      // 公式按整体外框参与检查（上下标、重音符的字形框会互相叠住，不算重叠）
      if (host.localName === 'math') { if (seenMath.has(host)) continue; seenMath.add(host); range.selectNode(host); }
      else range.selectNodeContents(node);

          if (rr - l <= 1 || b - t <= 1) continue;

        }
        if (r.width > 1 && r.height > 1) out.push({ r, host, text: host.localName === 'math' ? host.textContent.trim().slice(0, 16) : node.textContent.trim().slice(0, 16) });

  const inter = (a, b, pad = 0) => Math.min(a.right + pad, b.right + pad) - Math.max(a.left - pad, b.left - pad) > 1.5 &&
    Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top) > 1.5;
  function checkOnce(stepIdx, issues) {
    const left = $('left');
    const ts = textRects(left);
    for (let i = 0; i < ts.length; i++) for (let j = i + 1; j < ts.length; j++) {
      const a = ts[i], b = ts[j];

    }

 if(count===1){graph[i][j]=1;snap('graph[i][j] = 1',`写入 graph[${i}][${j}] = 1。`);graph[j][i]=1;snap('graph[j][i] = 1',`写入 graph[${j}][${i}] = 1；无向连接建立完成。`);}}
 phase='初始化 BFS';pair=null;count=null;visitedReady=true;snap('visited = set()','创建空集合 visited=set()。只有已发现的节点编号才会加入集合。');distance.fill(0);snap('distance = [0]','一次列表乘法创建 distance，初值全部为 0；尚未访问的点没有有效距离。');queue.push(0);snap('queue = deque([0])','起点 0 入队。');visited.add(0);snap('visited.add(0)','visited.add(0)：把起点编号 0 加入集合，防止重复入队。');
 phase='BFS';while(queue.length){current=queue.shift();next=null;snap('current = queue.popleft()',`从队首取出 current=${current}（${nodes[current]}），distance=${distance[current]}。`);snap('if current == n + 1:',`检查 current 是否等于终点编号 ${N-1}：${current===N-1?'是，准备输出最短距离':'否，遍历这一行邻接矩阵'}。`);
 if(current===N-1){answer=distance[current]+1;for(let p=current;p!==-1;p=parent[p])path.unshift(p);phase='结束';snap('print(distance[current] + 1)',`输出 <b>${answer}</b> 个字符串。路径示意：${path.map(p=>nodes[p]).join(' → ')}。distance=${distance[current]} 次迁移，加上起点，字符串数为 ${answer}。随后 break 跳过 while 的 else。路径由演示辅助记录。`,'hit');return steps;}
 for(next=0;next<N;next++){const ok=graph[current][next]===1&&!visited.has(next);snap('if graph[current][next_node]',`next_node=${next}：graph[${current}][${next}]=${graph[current][next]}；${graph[current][next]!==1?'不相连，and 短路，跳过':visited.has(next)?'已访问，跳过以避免重复入队':'相连且未访问，准备发现新节点'}。`,ok?'hit':'info');if(ok){visited.add(next);parent[next]=current;snap('visited.add(next_node)',`visited.add(${next})：在入队前把节点编号 ${next} 加入集合，后续用 next_node not in visited 判断是否发现过。`);distance[next]=distance[current]+1;snap('distance[next_node] =',`distance[${next}] = distance[${current}] + 1 = ${distance[current]} + 1 = ${distance[next]}。`);queue.push(next);snap('queue.append(next_node)',`将 ${next}（${nodes[next]}）加入队尾，稍后按层处理。`);}}
 next=null;}answer=0;phase='结束';snap('print(0)', '队列耗尽，未遇到终点，执行 while 的 else，输出 0（表示不可达）。','miss');return steps;},
 mount(d,P){const main=el('div','mig-main');main.innerHTML='<svg class="mig-graph" viewBox="0 0 400 300"><defs><marker id="mig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#94a3b8"/></marker></defs><g class="edges"></g><g class="nodes"></g></svg><div class="mig-matrix"></div>';P.canvas.append(main);const svg=main.querySelector('svg'),eg=svg.querySelector('.edges'),ng=svg.querySelector('.nodes'),matrix=main.querySelector('.mig-matrix');const ns='http://www.w3.org/2000/svg';const make=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;};
 const pos=d.nodes.map((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/d.N;return [200+140*Math.cos(a),150+108*Math.sin(a)];});const edges=[];for(let i=0;i<d.N;i++)for(let j=i+1;j<d.N;j++){const a=pos[i],b=pos[j],len=Math.hypot(b[0]-a[0],b[1]-a[1]),dx=(b[0]-a[0])/len*32,dy=(b[1]-a[1])/len*32;const e=make('path',{d:`M${a[0]+dx},${a[1]+dy} L${b[0]-dx},${b[1]-dy}`,fill:'none',stroke:'#94a3b8','stroke-width':2,'marker-start':'url(#mig-arrow)','marker-end':'url(#mig-arrow)'});eg.append(e);edges.push({i,j,e});}
 const circles=[],labels=[];pos.forEach(([x,y],i)=>{const c=make('circle',{cx:x,cy:y,r:30,fill:'#f1f5f9',stroke:'#cbd5e1','stroke-width':2});const t=make('text',{x,y:y+4,'text-anchor':'middle'});ng.append(c,t);circles.push(c);labels.push(t);});
 const cells=[];for(let i=-1;i<d.N;i++)for(let j=-1;j<d.N;j++){const c=el('div','mig-cell'+(i<0||j<0?' head':''));c.textContent=i<0?(j<0?'#':j):j<0?i:'·';matrix.append(c);if(i>=0&&j>=0)cells.push({i,j,c});}
 P.state.innerHTML='<div class="mig-info"><div class="mig-visited-label">显示按发现顺序排列；集合本身无序。visited 集合：只保存已发现的节点编号；蓝框表示本步加入</div><div class="mig-set-text"></div><div class="mig-visited"></div><div class="mig-vars"></div><div class="mig-compare"></div><div class="mig-note">0 为起点，最后一个编号为终点。蓝：当前；绿：已访问。相同字符串仍是不同编号，差 0 位不连边。</div></div>';
 P.aux.arrays.innerHTML='<div class="mig-info"><div>queue（队首 → 队尾）</div><div class="mig-queue"></div><div class="mig-table"><div class="mig-row"><b>#</b><b>nodes</b><b>集合成员</b><b>distance</b></div></div></div>';const visitBox=P.state.querySelector('.mig-visited');const table=P.aux.arrays.querySelector('.mig-table');const rows=d.nodes.map(()=>{const r=el('div','mig-row');for(let k=0;k<4;k++)r.append(el('span'));table.append(r);return r;});U={visitBox,setText:P.state.querySelector('.mig-set-text'),main,matrix,edges,circles,labels,cells,rows,vars:P.state.querySelector('.mig-vars'),compare:P.state.querySelector('.mig-compare'),queue:P.aux.arrays.querySelector('.mig-queue')};},
 layout(d){const size=Math.max(18,Math.min(32,Math.floor((U.main.clientHeight-16)/(d.N+1)),Math.floor((U.matrix.clientWidth-16)/(d.N+1))));U.matrix.style.gridTemplateColumns=`repeat(${d.N+1},${size}px)`;U.matrix.style.gridAutoRows=size+'px';},
 render(s,prev,d){const active=(i)=>s.pair?s.pair.includes(i):i===s.current||i===s.next;
 U.edges.forEach(({i,j,e})=>{e.style.opacity=s.graph[i][j]===1&&s.graph[j][i]===1?'1':'0';});
 U.circles.forEach((c,i)=>{c.setAttribute('fill',active(i)?'#dbeafe':s.visited.includes(i)?'#dcfce7':'#f1f5f9');c.setAttribute('stroke',active(i)?'#2563eb':'#cbd5e1');setText(U.labels[i],s.ready?`${i}: ${d.nodes[i]}`:`${i}: ·`);});
 U.cells.forEach(({i,j,c})=>{setText(c,s.graph[i][j]??'·');const a=s.pair?s.pair[0]===i&&s.pair[1]===j:s.current===i&&s.next===j;c.className='mig-cell'+(s.graph[i][j]===1?' edge':'')+(a?' active':'');});
 setText(U.setText,!s.visitedReady?'visited：尚未创建':s.visited.length?'visited = {'+s.visited.join(', ')+'}':'visited = set()');
 AV.keyed(U.visitBox,s.visited,x=>x,()=>el('div','mig-visit'),(cell,x)=>{setText(cell,x);cell.className='mig-visit seen'+(s.visitWrite===x?' writing':'');});

 U.rows.forEach((r,i)=>{r.className='mig-row'+(active(i)?' active':s.visited.includes(i)?' seen':'');const values=[i,s.ready?d.nodes[i]:(i>0&&i<=s.read?d.nodes[i]:'·'),!s.visitedReady?'·':s.visited.includes(i)?'在集合中':'未加入',s.distance[i]??'·'];values.forEach((v,k)=>setText(r.children[k],v));});
 setText(U.vars,`current = ${s.current??'·'}    next_node = ${s.next??'·'}\n建图 (i, j) = ${s.pair?s.pair.join(', '):'·'}    judge 内 i = ${s.char??'·'}`);
 setText(U.compare,s.pair?`s1 = ${d.nodes[s.pair[0]]}\ns2 = ${d.nodes[s.pair[1]]}\n${s.char===null?'比较完成 / 准备比较':`第 ${s.char} 位：${d.nodes[s.pair[0]][s.char]} vs ${d.nodes[s.pair[1]][s.char]}`}    count = ${s.count??'·'}`:s.answer!==null?`输出 = ${s.answer}`:`strlist 已读入 ${s.read} / ${d.words.length} 项`);
 AV.keyed(U.queue,s.queue,x=>x,()=>el('span','mig-item'),(e,x)=>setText(e,`${x}: ${d.nodes[x]}`));}
};
