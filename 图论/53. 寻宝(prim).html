/* =====================================================================

   ===================================================================== */
:root {

  --dur: 420ms; --ease: cubic-bezier(.4, 0, .2, 1);

}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

<!-- 对应 .py 的完整源码，用 scripts/embed_source.py 写入（保持与源文件一致） -->
<script type="text/plain" id="py-source">
# 题目描述
# 在世界的某个区域，有一些分散的神秘岛屿，每个岛屿上都有一种珍稀的资源或者宝藏。国王打算在这些岛屿上建公路，方便运输。

# 不同岛屿之间，路途距离不同，国王希望你可以规划建公路的方案，如何可以以最短的总公路距离将 所有岛屿联通起来（注意：这是一个无向图）。 

# 给定一张地图，其中包括了所有的岛屿，以及它们之间的距离。以最小化公路建设长度，确保可以链接到所有岛屿。

# 输入描述
# 第一行包含两个整数V 和 E，V代表顶点数，E代表边数 。顶点编号是从1到V。例如：V=2，一个有两个顶点，分别是1和2。

# 接下来共有 E 行，每行三个整数 v1，v2 和 val，v1 和 v2 为边的起点和终点，val代表边的权值。

# 输出描述
# 输出联通所有岛屿的最小路径总距离

# 输入示例
# 7 11
# 1 2 1
# 1 3 1
# 1 5 2
# 2 6 1
# 2 4 2
# 2 3 2
# 3 4 1
# 4 5 1
# 5 6 2
# 5 7 1
# 6 7 1
# 输出示例
# 6

import sys

# sys.stdin = open('input.txt', 'r')

data = sys.stdin.read().split()
n = int(data[0])
m = int(data[1])
inf = float('inf')

grid = []
for i in range(n + 1):
    row = []
    for j in range(n + 1):
        row.append(inf)
    grid.append(row)

index = 2
for i in range(m):
    a = int(data[index])
    b = int(data[index + 1])
    v = int(data[index + 2])
    # 无向图写两个方向，重边只保留较小权值。
    # grid[a][b] = min(grid[a][b], v)
    # grid[b][a] = min(grid[b][a], v)
    grid[a][b] = v
    grid[b][a] = v
    index += 3

dist = []
seen = []
for i in range(n + 1):
    dist.append(inf)
    seen.append(False)

# dist[i] 是将岛屿 i 接入当前生成树所需的最小边权。
dist[1] = 0
res = 0
for i in range(n):
    cur = -1
    for j in range(1, n + 1):
        if seen[j]:
            continue
        # 还没有候选，或当前岛屿的接入成本更小，就更新 cur。
        # cur==-1 时 or 短路，不会读取 dist[-1]。
        if cur == -1 or dist[j] < dist[cur]:
            cur = j

    # 没有候选，或候选仍不可达，说明无法连接全部岛屿。
    if cur == -1 or dist[cur] == inf:
        res = -1
        break

    seen[cur] = True
    res += dist[cur]
    for j in range(1, n + 1):
        if not seen[j]:
            dist[j] = min(dist[j], grid[cur][j])

print(res)


# 思路
# 本题要求连接所有岛屿的总边权最小，是最小生成树问题。
# Prim 从岛屿1开始，每次选择接入当前树成本最小的未加入岛屿。
# 将它加入树并累计对应边权，再用它的出边更新其他岛屿的接入成本。
# 起点的 dist[1]=0，只是为了让它首先被选中，不会多算一条边。
#
# 常见问题
# 1. dist 和 Dijkstra 中的距离有什么区别？
#    这里 dist[j] 是岛屿 j 到当前树的最小连接边权，不是起点到 j 的路径长度。
#    因此更新用 grid[cur][j]，不能加上 dist[cur]。
# 2. 为什么每次选最小连接边是正确的？
#    当前树内外形成一个割，跨越这个割的最小边可以属于某棵最小生成树。
#    每次选这样的安全边，不会失去最优解。
# 3. 为什么不产生环？
#    每次只把一个尚未加入树的岛屿接进来，不连接两个已经在树内的点。
# 4. 时间和空间复杂度是多少？
#    建矩阵 O(n²)，读取道路 O(m)，n轮中各进行两次 O(n) 扫描。
#    总时间 O(n²+m)；不计输入token的空间 O(n²)，计入后 O(n²+m)。
# 5. 重边、同权边、负权边、自环怎么处理？
#    重边取最小值，同权时可以任取一条，生成树可能不同但最小总权值不变。
#    Prim 支持零权和负权；更新只考虑未加入的岛屿，自环不会被选中。
# 6. 如果只有一个岛屿，或者图不连通呢？
#    单岛屿无需建路，输出0。
#    不连通时不存在生成树；题面未规定此时输出，本实现额外约定输出-1。


# 原使用 best 的选点写法，完整注释保留：
# for i in range(n):
#     cur = -1
#     best = inf
#     for j in range(1, n + 1):
#         if not seen[j] and dist[j] < best:
#             best = dist[j]
#             cur = j
#
#     # 没有可接入的岛屿，说明图不连通，不存在生成树。
#     if cur == -1:
#         res = -1
#         break
#
#     seen[cur] = True
#     res += best
#     for j in range(1, n + 1):
#         if not seen[j]:
#             dist[j] = min(dist[j], grid[cur][j])
</script>

<script>
/* =====================================================================
   ENGINE —— 播放器 / 布局 / 代码高亮 / 平滑过渡 / 自检（通用，勿改）
   ===================================================================== */
const AV = (() => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let DUR = 420, instant = false;
  const dur = () => (instant ? 0 : DUR);
  const ease = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // ---------- 动画工具 ----------
  const anims = new Map();
  function animate(key, step, done, ms = dur()) {
    if (anims.has(key)) cancelAnimationFrame(anims.get(key));
    anims.delete(key);
    if (ms <= 0) { step(1); done && done(); return; }
    const t0 = performance.now();
    const f = now => {
      const p = Math.min(1, Math.max(0, now - t0) / ms);   // rAF 时间戳可能早于点击时记下的 t0
      step(ease(p));
      if (p < 1) anims.set(key, requestAnimationFrame(f)); else { anims.delete(key); done && done(); }
    };
    anims.set(key, requestAnimationFrame(f));
  }
  function flash(node, cls) { if (instant) return; node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function setText(node, text, flashCls) {
    const t = String(text);
    if ((node._raw != null ? node._raw : node.textContent) === t) return false;
    node.textContent = t;
    if (t.indexOf('$') >= 0) { node._raw = t; TEX.typeset(node); } else node._raw = null;
    if (flashCls) flash(node, flashCls);
    return true;
  }
  // 按 key 复用 DOM：移动 FLIP 平滑过渡，新增淡入，删除淡出（容器需 position:relative）
  function keyed(box, items, keyOf, create, update) {
    const ms = dur();
    const old = new Map();
    for (const c of [...box.children]) if (c.dataset.key != null && !c.classList.contains('av-leaving')) old.set(c.dataset.key, c);
    const first = new Map();
    if (ms) old.forEach((c, k) => first.set(k, c.getBoundingClientRect().top));
    const want = new Set(items.map(it => String(keyOf(it))));
    old.forEach((c, k) => {
      if (want.has(k)) return;
      if (!ms) { c.remove(); return; }
      const st = { position: 'absolute', top: c.offsetTop + 'px', left: c.offsetLeft + 'px', width: c.offsetWidth + 'px' };
      c.classList.add('av-leaving');
      Object.assign(c.style, st, { transition: `opacity ${ms}ms, transform ${ms}ms`, pointerEvents: 'none' });
      requestAnimationFrame(() => { c.style.opacity = 0; c.style.transform = 'translateX(18px)'; });
      setTimeout(() => c.remove(), ms + 40);
    });
    const nodes = items.map(it => {
      const k = String(keyOf(it));
      let c = old.get(k), isNew = false;
      if (!c) { c = create(it); c.dataset.key = k; isNew = true; }
      update(c, it, isNew);
      box.appendChild(c);
      return c;
    });
    if (!ms) return;
    nodes.forEach(c => {
      const k = c.dataset.key;
      if (!first.has(k)) { flash(c, 'av-enter'); return; }
      const dy = first.get(k) - c.getBoundingClientRect().top;
      if (Math.abs(dy) < .5) return;
      c.style.transition = 'none';
      c.style.transform = `translateY(${dy}px)`;
      void c.offsetWidth;
      c.style.transition = `transform ${ms}ms cubic-bezier(.4,0,.2,1), background ${ms}ms, color ${ms}ms`;
      c.style.transform = '';
      setTimeout(() => { c.style.transition = ''; }, ms + 20);
    });
  }

  // ---------- Python 高亮（VS Code Dark Modern + Pylance 语义配色） ----------
  const CTL = new Set('if elif else for while return import from as try except finally raise with break continue pass yield await async del global nonlocal assert match case'.split(' '));
  const KW = new Set('def class lambda None True False and or not in is self cls'.split(' '));
  const CLS = new Set('int float str bool list dict set tuple range object type bytes frozenset complex Exception ValueError KeyError IndexError TypeError deque defaultdict Counter OrderedDict'.split(' '));
  function highlightPython(src) {
    const lines = src.split('\n');
    const modules = new Set();
    for (const l of lines) {
      let m = l.match(/^\s*import\s+([\w., ]+)/);
      if (m) m[1].split(',').forEach(p => { const a = p.trim().split(/\s+as\s+/); modules.add((a[1] || a[0]).split('.')[0].trim()); });
      m = l.match(/^\s*from\s+([\w.]+)\s+import/);
      if (m) modules.add(m[1].split('.')[0]);
    }
    let depth = 0, triple = null;
    const re = /(#.*)|([rRbBuUfF]{0,2})("""|'''|"(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?)|(\d[\d_]*(?:\.\d*)?(?:[eE][+-]?\d+)?j?)|([A-Za-z_\u00c0-\uffff][\w\u00c0-\uffff]*)|([()[\]{}])|(\s+)|([\s\S])/y;
    return lines.map(raw => {
      const line = raw.replace(/\t/g, '    ');
      const indent = line.match(/^ */)[0].length;
      const toks = [];
      let i = indent;
      if (triple) {
        const end = line.indexOf(triple, i);
        if (end < 0) return { html: `<span class="t-str">${esc(line.slice(i))}</span>`, indent, cmt: false };
        toks.push(['str', line.slice(i, end + 3)]); i = end + 3; triple = null;
      }
      while (i < line.length) {
        re.lastIndex = i;
        const m = re.exec(line);
        if (!m) break;
        if (m[1]) toks.push(['cmt', m[1]]);
        else if (m[3] !== undefined && (m[3] || m[2])) {
          if (m[2]) toks.push([/[fF]/.test(m[2]) ? 'kw' : 'str', m[2]]);
          let s = m[3];
          if (s === '"""' || s === "'''") {
            const end = line.indexOf(s, re.lastIndex);
            if (end < 0) { s = line.slice(m.index + m[2].length); triple = m[3]; re.lastIndex = line.length; }
            else { s = line.slice(m.index + m[2].length, end + 3); re.lastIndex = end + 3; }
          }
          toks.push(['str', s]);
        }
        else if (m[4]) toks.push(['num', m[4]]);
        else if (m[5]) toks.push(['id', m[5]]);
        else if (m[6]) toks.push(['br', m[6]]);
        else if (m[7]) toks.push(['ws', m[7]]);
        else toks.push(['op', m[8]]);
        i = re.lastIndex;
      }
      const sig = toks.map((t, k) => k).filter(k => toks[k][0] !== 'ws');
      const html = toks.map((t, k) => {
        const [type, w] = t;
        if (type === 'ws') return w;
        if (type === 'br') {
          if ('([{'.includes(w)) { const c = depth % 3; depth++; return `<span class="t-b${c}">${w}</span>`; }
          depth = Math.max(0, depth - 1); return `<span class="t-b${depth % 3}">${w}</span>`;
        }
        if (type !== 'id') return `<span class="t-${type}">${esc(w)}</span>`;
        const p = sig.indexOf(k), prev = p > 0 ? toks[sig[p - 1]][1] : '', next = p < sig.length - 1 ? toks[sig[p + 1]][1] : '';
        let c = 'var';
        if (prev === 'def') c = 'fn';
        else if (prev === 'class') c = 'cls';
        else if (CTL.has(w)) c = 'ctl';
        else if (KW.has(w)) c = 'kw';
        else if (prev === '.') c = next === '(' ? 'fn' : 'var';
        else if (modules.has(w)) c = 'cls';
        else if (next === '(') c = CLS.has(w) || /^[A-Z]/.test(w) ? 'cls' : 'fn';
        else if (CLS.has(w)) c = 'cls';
        else if (/^[A-Z][A-Z0-9_]+$/.test(w)) c = 'const';
        return `<span class="t-${c}">${esc(w)}</span>`;
      }).join('');
      return { html, indent, cmt: line.trim().startsWith('#') };
    });
  }

  // ---------- 代码面板 ----------
  let srcLines = [], codeEls = [], activeCodeLines = new Set();
  function mountCode(fileName) {
    const src = $('py-source').textContent.replace(/\r\n?/g, '\n').replace(/^\n/, '').replace(/\s+$/, '');
    srcLines = src.split('\n');
    activeCodeLines = new Set();
    $('fileName').textContent = fileName || '';
    const body = $('codeBody');
    body.innerHTML = '';
    codeEls = highlightPython(src).map((h, k) => {
      const ln = el('div', 'ln' + (h.cmt ? ' cmt' : ''));
      ln.innerHTML = `<span class="g">${k + 1}</span><span class="s" style="--ind:${h.indent}">${h.html || ' '}</span>`;
      body.appendChild(ln);
      return ln;
    });
  }
  // 按源码内容定位行号：lineOf('res += 1')，nth 表示第几处匹配（忽略注释部分）
  function lineOf(text, nth = 1) {
    let cnt = 0;
    for (let k = 0; k < srcLines.length; k++) {
      const code = srcLines[k].replace(/#.*$/, '');
      if (code.includes(text) && ++cnt === nth) return k + 1;
    }
    console.error('[AV] lineOf 未找到：', text, nth);
    return 0;
  }
  function setCodeLines(lines) {
    lines = (lines || []).filter(Boolean);
    const set = new Set(lines);
    if (set.size === activeCodeLines.size && [...set].every(k => activeCodeLines.has(k))) return;
    for (const k of activeCodeLines) if (!set.has(k)) codeEls[k - 1]?.classList.remove('on');
    for (const k of set) if (!activeCodeLines.has(k)) codeEls[k - 1]?.classList.add('on');
    activeCodeLines = set;
    const sorted = [...set].sort((a, b) => a - b);
    $('codePos').textContent = sorted.length ? `第 ${sorted.length > 1 && sorted.at(-1) - sorted[0] === sorted.length - 1 ? sorted[0] + '–' + sorted.at(-1) : sorted.join(', ')} 行` : '';
    if (!sorted.length) return;
    const body = $('codeBody'), a = codeEls[sorted[0] - 1], b = codeEls[sorted.at(-1) - 1];
    const top = a.offsetTop, bottom = b.offsetTop + b.offsetHeight, vt = body.scrollTop, vh = body.clientHeight;
    if (top < vt + vh * .12 || bottom > vt + vh * .82) body.scrollTo({ top: Math.max(0, top - vh * .3), behavior: instant ? 'auto' : 'smooth' });
  }

  // ---------- 播放器与布局 ----------
  let D, data, steps = [], cur = 0, timer = null;
  const statEls = {}, P = { aux: {}, auxCard: {} };
  // 速度从左到右递增，填充越满越快；0 为 2600ms，100 为 300ms。
  const speedMs = () => 2600 - 23 * Number($('speed').value);
  function setSpeed() {
    DUR = clamp(Math.round(speedMs() * .5), 180, 650);
    document.documentElement.style.setProperty('--dur', DUR + 'ms');
  }

  function setStat(def, val) {
    const t = statEls[def.key];
    const o = val !== null && typeof val === 'object' ? val : { v: val };
    const v = o.v ?? '—';
    if (typeof v === 'number' && typeof t.cur === 'number' && t.cur !== v && !instant) {
      const a = t.cur;
      animate('stat-' + def.key, p => { t.n.textContent = Math.round(a + (v - a) * p); });
      flash(t.box, 'bump');
    } else {
      if (anims.has('stat-' + def.key)) { cancelAnimationFrame(anims.get('stat-' + def.key)); anims.delete('stat-' + def.key); }
      t.n.textContent = v;
    }
    t.cur = v;
    t.unit.textContent = o.unit || '';
    t.sub.textContent = o.sub || '';
  }

  function render(prev) {
    const s = steps[cur];
    const pct = (steps.length > 1 ? cur / (steps.length - 1) * 100 : 100) + '%';
    $('prog').style.width = pct;
    $('thumb').style.left = pct;
    $('progTip').style.left = pct;
    $('progTip').textContent = `第 ${cur + 1} 步`;
    $('stepNo').textContent = `${cur + 1} / ${steps.length}`;
    const html = (s.tag ? `<span class="tag ${s.tag.kind || 'info'}">${s.tag.text}</span>` : '') + s.desc;
    if (setHTML($('desc'), html)) { flash($('desc'), 'fade-in'); }
    setText($('phase'), s.phase || '');
    (D.stats || []).forEach(def => setStat(def, s.stats ? s.stats[def.key] : undefined));
    setCodeLines(s.lines);
    D.render(s, prev, data, P);
    TEX.flush();
  }
  function go(k) {
    k = clamp(k, 0, steps.length - 1);
    const prev = steps[cur];
    cur = k;
    render(prev === steps[cur] ? null : prev);
  }
  function stop() { finishDrag?.(); clearTimeout(timer); timer = null; $('btnPlay').textContent = '▶ 播放'; }
  function play() {
    if (timer) return stop();
    if (cur >= steps.length - 1) go(0);
    $('btnPlay').textContent = '⏸ 暂停';
    const tick = () => {
      if (cur >= steps.length - 1) return stop();
      go(cur + 1);
      timer = setTimeout(tick, speedMs());
    };
    timer = setTimeout(tick, 120);
  }
  function withInstant(fn) { const was = instant; instant = true; document.body.classList.add('instant'); try { fn(); } finally { instant = was; if (!was) { void document.body.offsetWidth; document.body.classList.remove('instant'); } } }

  // A gesture owns one pending frame; finish/interrupt always flushes its final position.
  let finishDrag = null;
  function frameDrag(node, begin, update, end) {
    node.addEventListener('pointerdown', e => {
      if (!e.isPrimary || e.button !== 0) return;
      finishDrag?.();
      const context = begin(e);
      if (!context) return;
      e.preventDefault();
      const pointerId = e.pointerId;
      let latestX = e.clientX, frame = 0, dirty = true, ended = false;
      const flush = () => {
        frame = 0;
        if (dirty) { dirty = false; update(latestX, context); }
      };
      const move = ev => {
        if (ev.pointerId !== pointerId) return;
        latestX = ev.clientX; dirty = true;
        if (!frame) frame = requestAnimationFrame(flush);
      };
      const finish = ev => {
        if (ended || (ev?.pointerId != null && ev.pointerId !== pointerId)) return;
        ended = true;
        if (ev?.type === 'pointerup') { latestX = ev.clientX; dirty = true; }
        cancelAnimationFrame(frame);
        finishDrag = null;
        node.removeEventListener('pointermove', move);
        for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) node.removeEventListener(type, finish);
        window.removeEventListener('blur', finish);
        document.removeEventListener('visibilitychange', hidden);
        try { flush(); } finally {
          end(context);
          if (node.hasPointerCapture(pointerId)) node.releasePointerCapture(pointerId);
        }
      };
      const hidden = () => { if (document.hidden) finish(); };
      finishDrag = finish;
      node.addEventListener('pointermove', move);
      for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) node.addEventListener(type, finish);
      window.addEventListener('blur', finish);
      document.addEventListener('visibilitychange', hidden);
      node.setPointerCapture(pointerId);
      frame = requestAnimationFrame(flush);
    });
  }
  function beginScrub() {
    const was = instant;
    instant = true;
    document.body.classList.add('instant');
    for (const id of anims.values()) cancelAnimationFrame(id);
    anims.clear();
    // Stop a previously started smooth code scroll before following the pointer.
    const body = $('codeBody');
    body.scrollTo({ top: body.scrollTop, behavior: 'instant' });
    return () => {
      instant = was;
      if (!was) { void document.body.offsetWidth; document.body.classList.remove('instant'); }
    };
  }

  // 输入框内容与哪个预设一致就高亮哪个按钮（同值时优先刚点的那个），手动改输入后自动取消
  let lastPreset = -1;
  function markPreset() {
    const same = p => Object.keys(p.values).every(k => $('in-' + k) && String($('in-' + k).value) === String(p.values[k]));
    const list = D.presets || [], hit = list[lastPreset] && same(list[lastPreset]) ? lastPreset : list.findIndex(same);
    $('inputs').querySelectorAll('button.preset').forEach((b, i) => b.classList.toggle('on', i === hit));
  }
  function apply() {
    stop();
    markPreset();
    const values = {};
    (D.inputs || []).forEach(f => { values[f.id] = $('in-' + f.id).value; });
    const r = D.parse(values);
    if (r.error) { $('err').textContent = r.error; return false; }
    $('err').textContent = '';
    data = r;
    steps = D.build(data);
    for (const k in P.aux) P.aux[k].innerHTML = '';
    $('canvas').innerHTML = ''; $('state').innerHTML = '';
    withInstant(() => {
      D.mount(data, P);
      cur = 0;
      D.layout && D.layout(data, P);
      render(null);
    });
    return true;
  }

  function buildShell() {
    document.title = D.title;
    $('title').textContent = D.title;
    $('subtitle').innerHTML = D.subtitle || '';
    const inputs = $('inputs');
    (D.inputs || []).forEach(f => {
      inputs.appendChild(el('label', '', f.label));
      const inp = el('input');
      inp.type = f.type || 'text'; inp.id = 'in-' + f.id; inp.value = f.value;
      if (f.width) inp.style.width = f.width + 'px';
      if (f.flex) { inp.style.flex = '1'; inp.style.minWidth = '200px'; }
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') apply(); });
      inputs.appendChild(inp);
    });
    const btn = el('button', 'primary', '生成演示'); btn.onclick = apply; inputs.appendChild(btn);
    if (D.presets && D.presets.length) inputs.appendChild(el('span', 'hint', '预设：'));
    (D.presets || []).forEach((p, i) => {
      const b = el('button', 'preset', p.label);
      b.onclick = () => { lastPreset = i; for (const k in p.values) $('in-' + k).value = p.values[k]; apply(); };
      inputs.appendChild(b);
    });
    inputs.addEventListener('input', markPreset);
    inputs.appendChild(el('span', 'err')).id = 'err';

    (D.stats || []).forEach(def => {
      const box = el('div', 'stat ' + (def.color || 'blue'));
      box.innerHTML = `<div class="lab">${def.label}</div><div class="num"><span class="n">—</span><small></small></div><div class="sub"></div>`;
      $('stats').appendChild(box);
      statEls[def.key] = { box, n: box.querySelector('.n'), unit: box.querySelector('small'), sub: box.querySelector('.sub'), cur: null };
    });

    const pn = D.panels || {};
    $('canvasTitle').textContent = pn.canvas?.title || '';
    $('canvasHint').textContent = pn.canvas?.hint || '';
    $('stateTitle').textContent = pn.state?.title || '';
    $('stateHint').textContent = pn.state?.hint || '';
    P.canvas = $('canvas'); P.state = $('state'); P.stateHint = $('stateHint'); P.stateCard = $('stateCard');
    (pn.aux || []).forEach(a => {
      const card = el('div', 'card' + (a.grow ? ' grow' : ''));
      card.innerHTML = `<div class="card-h"><span>${a.title}</span><span class="hint">${a.hint || ''}</span></div><div class="card-b"></div>`;
      $('auxCol').appendChild(card);
      P.aux[a.id] = card.querySelector('.card-b');
      P.auxCard[a.id] = card;
    });
    mountCode(D.file);
  }

  function wire() {
    $('btnFirst').onclick = () => { stop(); go(0); };
    $('btnLast').onclick = () => { stop(); go(steps.length - 1); };
    $('btnPrev').onclick = () => { stop(); go(cur - 1); };
    $('btnNext').onclick = () => { stop(); go(cur + 1); };
    $('btnPlay').onclick = play;
    $('speed').oninput = setSpeed;
    // Cache geometry once; coalesce pointer events and keep snapshots immediate while scrubbing.
    const bar = $('progress');
    frameDrag(bar, () => {
      stop();
      const rect = bar.getBoundingClientRect();
      const restore = beginScrub();
      bar.classList.add('dragging');
      return { rect, restore, first: true };
    }, (x, ctx) => {
      const k = Math.round(clamp((x - ctx.rect.left) / ctx.rect.width, 0, 1) * (steps.length - 1));
      if (ctx.first || k !== cur) { ctx.first = false; go(k); }
    }, ctx => { bar.classList.remove('dragging'); ctx.restore(); });
    document.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
      else if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
      else if (e.key === ' ') { e.preventDefault(); play(); }
      else if (e.key === 'Home') { stop(); go(0); }
      else if (e.key === 'End') { stop(); go(steps.length - 1); }
    });

    // 代码面板：可拖动宽度 / 折叠 / 注释开关 / 字号
    const app = $('app'), sp = $('splitter'), LS = 'algoviz.';
    const defW = () => clamp(Math.round(window.innerWidth * .4), 420, 820);
    const setW = w => app.style.setProperty('--code-w', clamp(w, 320, window.innerWidth - 700) + 'px');
    setW(+localStorage.getItem(LS + 'codeW') || defW());
    frameDrag(sp, () => {
      if (app.classList.contains('code-collapsed')) return null;
      stop();
      const right = app.getBoundingClientRect().right - 16;
      const restore = beginScrub();
      app.classList.add('dragging');
      return { right, restore };
    }, (x, ctx) => setW(ctx.right - x - 6), ctx => {
      app.classList.remove('dragging');
      ctx.restore();
      localStorage.setItem(LS + 'codeW', parseInt(app.style.getPropertyValue('--code-w')));
    });

inputs:[{id:'n',label:'岛屿 n',value:7,type:'number',width:56},{id:'edges',label:'无向道路 a b v；',value:presets[0].values.edges,flex:true}],presets,
stats:[{key:'round',label:'当前轮次',color:'purple'},{key:'cur',label:'候选岛屿 cur',color:'blue'},{key:'cost',label:'候选接入成本 dist[cur]',color:'amber'},{key:'count',label:'已加入岛屿数',color:'green'},{key:'res',label:'累计总边权 res',color:'red'}],
panels:{canvas:{title:'无向道路 · 邻接矩阵 grid',hint:'绿色道路已进入树；紫色是当前检查边；矩阵对称'},state:{title:'当前变量与计算',hint:'dist[j] 只与 grid[cur][j] 比较，不加 dist[cur]'},aux:[{id:'dist',title:'dist 与 seen 按节点一一配对',hint:'同一行属于同一个节点；· 未初始化，False 未加入，True 已加入',grow:true}]},
parse(v){const n=Number(v.n);if(!Number.isInteger(n)||n<1||n>7)return {error:'动画支持1～7个岛屿。'};const edges=[];for(const part of v.edges.split(/[;；\n]+/).filter(x=>x.trim())){const a=part.trim().split(/[\s,，]+/).map(Number);if(a.length!==3||a.some(x=>!Number.isSafeInteger(x))||a[0]<1||a[0]>n||a[1]<1||a[1]>n||Math.abs(a[2])>99)return {error:'每条输入 a b v，城市编号1～n，权值-99～99。'};edges.push(a);}if(edges.length>15)return {error:'动画最多15条道路。'};return {n,edges};},
build({n,edges}){
const steps=[],grid=[],dist=[],seen=[],parent=Array(n+1).fill(-1),tree=[];let round=0,cur=-1,j=null,edge=null,updated=null,res=0,calc='',kind='info',row=null;
function push(phase,desc,line){steps.push({phase,desc,lines:[L(line)],tag:{text:phase,kind},grid:grid.map(r=>r.slice()),dist:dist.slice(),seen:seen.slice(),parent:parent.slice(),tree:tree.map(e=>e.slice()),round,cur,j,edge:edge&&edge.slice(),updated,res,calc,row,stats:{round,cur,cost:cur<1?'—':fmt(dist[cur]),count:seen.filter(Boolean).length,res}});}
push('读取地图',`共有${n}个岛屿，${edges.length}条输入道路。`,'n = int(data[0])');
for(let i=0;i<=n;i++){grid.push(Array(n+1).fill(INF));row=i;push('创建矩阵行',`第${i}行使用独立列表初始化为∞，0行0列占位。`,'grid.append(row)');}row=null;
for(const [a,b,v]of edges){edge=[a,b];grid[a][b]=v;calc=`grid[${a}][${b}] = ${v}`;push('写入正向',calc+'。按当前Python源码直接赋值；有重边时后输入覆盖。','grid[a][b] = v');grid[b][a]=v;calc=`grid[${b}][${a}] = ${v}`;push('写入反向','无向道路需要对称写入两个方向。','grid[b][a] = v');}edge=null;
for(let i=0;i<=n;i++){dist.push(INF);updated=i;push('初始化接入成本',`dist[${i}] = ∞，尚不知道连接方式。`,'dist.append(inf)');seen.push(false);push('初始化加入状态',`seen[${i}] = False，尚未进入树。`,'seen.append(False)');}updated=1;dist[1]=0;calc='dist[1] = 0';push('指定起点','起点不需要连接边，设置0使岛屿1首先被选中。','dist[1] = 0');updated=null;res=0;push('清空总边权','res=0，后续每加入一个岛屿，累计对应接入成本。','res = 0');
for(let i=0;i<n;i++){
round=i+1;cur=-1;j=null;edge=null;kind='info';calc='cur=-1';push('开始选点','只记录候选节点cur，直接读取dist[cur]比较接入成本。','cur = -1');
for(let k=1;k<=n;k++){
 j=k;calc=`seen[${k}] = ${seen[k]?'True':'False'}`;push('检查加入状态',seen[k]?'该岛屿已在树中，跳过。':'尚未加入树，参与候选比较。','if seen[j]:');
 if(seen[k]){push('跳过已加入岛屿','continue 回到选点循环，检查下一个j。','continue');continue;}
 const choose=cur===-1||dist[k]<dist[cur];calc=cur===-1?'cur == -1 → True，尚无候选，or短路。':`dist[${k}]=${fmt(dist[k])} < dist[${cur}]=${fmt(dist[cur])} → ${choose}`;
 push('比较接入成本',choose?'更新候选cur，之后还要扫描剩余岛屿。':'保留当前候选cur。','if cur == -1 or dist[j] < dist[cur]:');
 if(choose){cur=k;calc=`cur=${k}，dist[cur]=${fmt(dist[cur])}`;push('更新 cur',calc,'cur = j');}
}

j=null;calc=`cur=${cur}`;push('检查是否可接入',cur===-1||dist[cur]===INF?'没有有限接入成本，无法连接全部岛屿。':'扫描已完成，候选接入成本有限，可以加入。','if cur == -1 or dist[cur] == inf:');
if(cur===-1||dist[cur]===INF){res=-1;kind='miss';push('不存在生成树','按当前代码约定输出-1；已选边只是局部森林，不能称为完整最小生成树。','res = -1');push('结束循环','break 退出外层选点循环。','break');break;}
seen[cur]=true;kind='hit';if(parent[cur]!==-1)tree.push([parent[cur],cur,dist[cur]]);calc=`seen[${cur}] = True`;push('加入生成树',parent[cur]===-1?`岛屿${cur}作为起点加入，没有连接边。`:`选择边 ${parent[cur]} — ${cur}，权值${dist[cur]}。`,'seen[cur] = True');const old=res;res+=dist[cur];calc=`res = ${old} + (${dist[cur]}) = ${res}`;push('累计边权',calc,'res += dist[cur]');
for(let k=1;k<=n;k++){j=k;updated=null;kind='info';edge=[cur,k];calc=`not seen[${k}] = ${!seen[k]}`;push('枚举待更新岛屿',seen[k]?'已在树中，不再更新它的接入成本。':'尚未加入，用当前岛屿的道路尝试改善接入方式。','if not seen[j]:');if(!seen[k]){const old=dist[k],weight=grid[cur][k];if(weight<old)parent[k]=cur;dist[k]=Math.min(old,weight);updated=k;kind=weight<old?'hit':'info';calc=`dist[${k}] = min(${fmt(old)}, ${fmt(weight)}) = ${fmt(dist[k])}`;push('更新接入成本',calc+'。只比较这条边的权值，不累加到起点的路程。','dist[j] = min(dist[j], grid[cur][j])');}}
j=null;updated=null;edge=null;
}
kind=seen.filter(Boolean).length===n?'hit':'miss';calc=`print(res) → ${res}`;push('最终结果',seen.filter(Boolean).length===n?`已连接全部${n}个岛屿，选了${tree.length}条边，总长度${res}。矩阵Prim时间 $O(n^2+m)$，不计输入token空间 $O(n^2)$。`:'图不连通，不存在覆盖全部岛屿的生成树，按代码约定输出-1。','print(res)');return steps;
},
 mount(d,P){
  P.canvas.innerHTML=`<div class="science-view"><div class="road-graph"><svg><defs>${Object.entries(colors).map(([k,c])=>`<marker id="arrow-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('')}</defs><g class="roads"></g><g class="nodes"></g></svg></div><div class="grid-side"><div class="hint">grid[i][j] · 无向边 · ∞ 无边</div><div class="adj"></div></div></div><div class="legend"><span style="color:#2563eb">● 当前候选 cur</span><span style="color:#d97706">● 正在扫描 j</span><span style="color:#16a34a">● 已加入生成树 / 更新成功</span><span style="color:#7c3aed">● 当前检查的出边</span></div>`;
  const ns='http://www.w3.org/2000/svg',sv=t=>document.createElementNS(ns,t),svg=P.canvas.querySelector('svg'),roadEls=[],nodeEls=[];
  for(const key of new Set(d.edges.map(([a,b])=>Math.min(a,b)+','+Math.max(a,b)))){const [a,b]=key.split(',').map(Number),path=sv('path'),text=sv('text');svg.querySelector('.roads').append(path,text);roadEls.push({a,b,path,text});}
  for(let i=1;i<=d.n;i++){const g=sv('g'),circle=sv('circle'),text=sv('text');circle.setAttribute('r',18);text.setAttribute('class','node-label');text.textContent=i;g.append(circle,text);svg.querySelector('.nodes').append(g);nodeEls[i]={g,circle};}
  const adj=P.canvas.querySelector('.adj');adj.style.setProperty('--cols',d.n+1);adj.append(el('div','axis','i/j'));for(let j=1;j<=d.n;j++)adj.append(el('div','axis',j));const cells=[];
  for(let i=1;i<=d.n;i++){adj.append(el('div','axis',i));cells[i]=[];for(let j=1;j<=d.n;j++)cells[i][j]=adj.appendChild(el('div','','∞'));}
  P.state.innerHTML='<div class="vars"></div><div class="calc"></div>';const variables={};for(const key of ['cur','dist[cur]','j','dist[j]','grid[cur][j]','res']){P.state.querySelector('.vars').append(el('div','name',key));variables[key]=P.state.querySelector('.vars').appendChild(el('div','value','—'));}
  P.aux.dist.innerHTML='<div class="dist-table"><div class="dist-row head"><span>节点</span><span>接入成本 dist[i]</span><span>加入状态 seen[i]</span><span>连接自</span></div></div><div class="route-text"></div>';
  const rows=[];for(let i=1;i<=d.n;i++)rows[i]=P.aux.dist.querySelector('.dist-table').appendChild(el('div','dist-row',`<span>#${i}</span><span>dist[${i}] = ·</span><span>seen[${i}] = ·</span><span>—</span>`));
  U={n:d.n,graph:P.canvas.querySelector('.road-graph'),svg,roadEls,nodeEls,cells,variables,calc:P.state.querySelector('.calc'),rows,route:P.aux.dist.querySelector('.route-text')};
 },
 layout(d){
  const w=U.graph.clientWidth,h=U.graph.clientHeight,rx=Math.max(50,Math.min(w/2-70,260)),ry=h/2-45;
  const pos=Array.from({length:d.n+1},(_,i)=>{const a=-Math.PI/2+2*Math.PI*(i-1)/d.n;return d.n===1?{x:w/2,y:h/2}:{x:w/2+rx*Math.cos(a),y:h/2+ry*Math.sin(a)};});
  const occupied=pos.slice(1).map(p=>({...p,w:42,h:42}));
  const collides=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2+5&&Math.abs(a.y-b.y)<(a.h+b.h)/2+5;
  for(let i=1;i<=d.n;i++)U.nodeEls[i].g.setAttribute('transform',`translate(${pos[i].x},${pos[i].y})`);
  for(const e of U.roadEls){const a=pos[e.a],b=pos[e.b];let tx,ty;
   if(e.a===e.b){e.path.setAttribute('d',`M${a.x-13},${a.y-14} C${a.x-48},${a.y-48} ${a.x+48},${a.y-48} ${a.x+13},${a.y-14}`);tx=a.x;ty=a.y-42;}
   else{const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,bend=24,cx=(a.x+b.x)/2+nx*bend,cy=(a.y+b.y)/2+ny*bend;
    const l0=Math.hypot(cx-a.x,cy-a.y),l1=Math.hypot(b.x-cx,b.y-cy),x0=a.x+(cx-a.x)*21/l0,y0=a.y+(cy-a.y)*21/l0,x1=b.x-(b.x-cx)*24/l1,y1=b.y-(b.y-cy)*24/l1;
    e.path.setAttribute('d',`M${x0},${y0} Q${cx},${cy} ${x1},${y1}`);
    let best=null,bestCount=Infinity;
    for(const t of [.5,.36,.64,.25,.75])for(const offset of [8,19,-8,30,-19]){const x=(1-t)**2*x0+2*(1-t)*t*cx+t*t*x1+nx*offset,y=(1-t)**2*y0+2*(1-t)*t*cy+t*t*y1+ny*offset,candidate={x,y,w:30,h:15};const count=occupied.filter(p=>collides(candidate,p)).length+(x<20||x>w-20||y<10||y>h-10?100:0);if(count<bestCount){bestCount=count;best=candidate;}}
    tx=best.x;ty=best.y;
   }
   occupied.push({x:tx,y:ty,w:30,h:15});e.text.setAttribute('x',tx);e.text.setAttribute('y',ty);
  }
 },

render(s,prev,d){
for(const e of U.roadEls){const weight=s.grid[e.a]?s.grid[e.a][e.b]:INF,active=s.edge&&((s.edge[0]===e.a&&s.edge[1]===e.b)||(s.edge[0]===e.b&&s.edge[1]===e.a)),selected=s.tree.some(([a,b])=>a===e.a&&b===e.b||a===e.b&&b===e.a),color=selected?'green':active?'purple':'gray';e.path.style.opacity=weight===INF?0:1;e.text.style.opacity=weight===INF?0:1;setText(e.text,weight===INF?'':weight);e.path.style.stroke=colors[color];e.path.style.strokeWidth=selected?4:active?3:1.5;e.text.style.fill=colors[color];}
for(let i=1;i<=d.n;i++){const color=s.updated===i?'green':s.j===i?'amber':s.cur===i?'blue':s.seen[i]?'green':'gray';U.nodeEls[i].circle.style.stroke=colors[color];U.nodeEls[i].circle.style.fill=s.seen[i]?'#dcfce7':s.cur===i?'#dbeafe':'white';const r=U.rows[i];r.className='dist-row '+(s.updated===i?'updated':s.j===i?'scan':s.cur===i?'current':'');setText(r.children[1],`dist[${i}] = ${fmt(s.dist[i])}`);setText(r.children[2],`seen[${i}] = ${s.seen[i]===undefined?'·':s.seen[i]?'True':'False'}`);setText(r.children[3],s.parent[i]<0?'—':s.parent[i]);for(let j=1;j<=d.n;j++){const c=U.cells[i][j],v=s.grid[i]?s.grid[i][j]:null;setText(c,fmt(v));c.className=s.edge&&s.edge[0]===i&&s.edge[1]===j?'active':v===INF?'inf':'';}}
const vars={cur:s.cur,'dist[cur]':s.cur>0?fmt(s.dist[s.cur]):'—',j:s.j??'—','dist[j]':s.j?fmt(s.dist[s.j]):'—','grid[cur][j]':s.cur>0&&s.j?fmt(s.grid[s.cur][s.j]):'—',res:s.res};for(const [k,v]of Object.entries(vars))setText(U.variables[k],v);setText(U.calc,s.calc||'dist 表示接入树的最小边权。');setText(U.route,'已选树边：'+(s.tree.length?s.tree.map(([a,b,w])=>`${a}—${b} (${w})`).join('；'):'无')+'。前驱parent仅用于演示。');
}
