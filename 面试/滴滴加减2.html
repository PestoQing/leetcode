/* =====================================================================

   ===================================================================== */
:root {

  --blue-l: #eff6ff; --green-l: #f0fdf4; --red-l: #fef2f2; --amber-l: #fffbeb; --purple-l: #f5f3ff;
  --dur: 420ms; --ease: cubic-bezier(.4, 0, .2, 1);
  --code-w: 720px; --code-fs: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
body.instant *, body.instant *::before, body.instant *::after { transition: none !important; animation: none !important; }

  padding: 0 16px 14px 20px; transition: grid-template-columns var(--dur) var(--ease); }

<!-- 对应 .py 的完整源码，用 scripts/embed_source.py 写入（保持与源文件一致） -->
<script type="text/plain" id="py-source">
import sys

def solve():
    data = sys.stdin.read().split()
    if not data:
        return

    n = int(data[0])
    q = int(data[1])

    nums = [int(x) for x in data[2 : 2 + n]]
    asks = [int(x) for x in data[2 + n : 2 + n + q]]

    # 使用 append 动态构建数组，不需要一开始开好 MAX 大小的数组
    cnt = []
    sums = []
    odd = []

    # 1. 动态扩展并填充 nums 的信息
    for v in nums:
        # 如果当前数字超过了列表长度，动态 append(0) 扩展到足够长度
        while len(cnt) <= v:
            cnt.append(0)
            sums.append(0)
            odd.append(0)
            
        cnt[v] += 1
        sums[v] += v
        if v % 2 == 1:
            odd[v] += 1

    # 2. 确保查询需要用到的最大索引也存在（处理 x+1 越界问题）
    # 因为查询 x 可能比 nums 中的最大数字还要大
    max_x = max(asks) if asks else 0
    while len(cnt) <= max_x + 1:
        cnt.append(0)
        sums.append(0)
        odd.append(0)

    # 3. 动态计算前缀和
    for i in range(1, len(cnt)):
        cnt[i] += cnt[i - 1]
        sums[i] += sums[i - 1]
        odd[i] += odd[i - 1]

    # 相当于原代码中的 sums[MAX + 1]，现在直接用列表的最后一个元素
    total_cnt = cnt[-1]
    total_sum = sums[-1]
    total_odd = odd[-1]

    ans = []
    for x in asks:
        # --- 左侧部分：数值 <= x-1 ---
        if x >= 1:
            c1 = cnt[x - 1]
            s1 = sums[x - 1]
            o1 = odd[x - 1]
        else:
            c1 = s1 = o1 = 0

        # --- 右侧部分：数值 >= x+1 ---
        if x + 1 < len(cnt):
            c2 = total_cnt - cnt[x + 1]
            s2 = total_sum - sums[x + 1]
            o2 = total_odd - odd[x + 1]
        else:
            c2 = s2 = o2 = 0

        # --- 计算奇偶性冲突导致“多花一步”的数字个数 bad ---
        bad = 0
        if x % 2 == 0:
            bad = o1 + o2
        else:
            bad = (c1 - o1) + (c2 - o2)

        # --- 计算最小操作数 ---
        res = (abs(x * c1 - s1) + abs(x * c2 - s2) - bad) // 2
        ans.append(str(res))

    print(' '.join(ans))

if __name__ == '__main__':
    solve()
</script>

/* =====================================================================
   ENGINE —— 播放器 / 布局 / 代码高亮 / 平滑过渡 / 自检（通用，勿改）
   ===================================================================== */
const AV = (() => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let DUR = 420, instant = false;
  const dur = () => (instant ? 0 : DUR);
  const ease = t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  // ---------- 动画工具 ----------
  const anims = new Map();
  function animate(key, step, done, ms = dur()) {
    if (anims.has(key)) cancelAnimationFrame(anims.get(key));
    anims.delete(key);
    if (ms <= 0) { step(1); done && done(); return; }
    const t0 = performance.now();
    const f = now => {
      const p = Math.min(1, (now - t0) / ms);
      step(ease(p));

    }
    const solids = [...left.querySelectorAll('[data-solid]')].map(e => {
      const r = e.getBoundingClientRect(), g = +(e.dataset.ring || 0);
      return { e, r: { left: r.left - g, right: r.right + g, top: r.top - g, bottom: r.bottom + g } };
    });
    for (const path of left.querySelectorAll('svg [marker-end], svg [marker-start]')) {
      if (path.closest('.av-leaving') || +getComputedStyle(path.closest('g') || path).opacity === 0) continue;
      const id = (path.getAttribute('marker-end') || path.getAttribute('marker-start')).match(/#([^)]+)/)?.[1];
      const head = id && document.getElementById(id)?.querySelector('path, polygon');
      const cs = head && getComputedStyle(head);
      if (!cs || (cs.fill === 'none' && (cs.stroke === 'none' || parseFloat(cs.strokeWidth) === 0)))
        issues.push({ step: stepIdx, type: '连线缺少箭头', a: id || '(无 marker)', b: path.getAttribute('d')?.slice(0, 20) || '' });
    }
    for (const t of ts) for (const s of solids) {
      if (s.e.contains(t.host)) continue;
      if (inter(t.r, s.r)) issues.push({ step: stepIdx, type: '元素遮挡文字', a: t.text, b: s.e.className });
    }
  }
  function runCheck() {
    const issues = [];
    let total = 0;
    // 逐个预设、逐步检查；没有预设时只检查当前输入
    const runs = D.presets && D.presets.length ? D.presets : [null];
    runs.forEach(p => {
      if (p) { for (const k in p.values) $('in-' + k).value = p.values[k]; if (!apply()) return; }
      const tagged = [];
      withInstant(() => { for (let k = 0; k < steps.length; k++) { go(k); checkOnce(k, tagged); } go(0); });
      total += steps.length;
      tagged.forEach(it => { it.step = (p ? p.label + ' · ' : '') + 'step ' + it.step; issues.push(it); });
    });
    const left = $('left'), body = $('codeBody');
    const uniq = [], seen = new Set();
    for (const it of issues) { const key = it.type + it.a + '|' + it.b; if (!seen.has(key)) { seen.add(key); uniq.push(it); } }
    const res = {
      viewport: [window.innerWidth, window.innerHeight], steps: total, lastSteps: steps.length,
      leftNeedsScroll: Math.max(0, left.scrollHeight - left.clientHeight),
      codeHScroll: Math.max(0, body.scrollWidth - body.clientWidth),
      overlaps: uniq.slice(0, 30), overlapCount: uniq.length,
    };
    $('av-check').textContent = JSON.stringify(res);
    document.title = 'AVCHECK ' + (res.leftNeedsScroll || res.codeHScroll || res.overlapCount ? 'FAIL' : 'OK');
  }

  function start(demo) {
    D = demo;
    buildShell();
    wire();
    setSpeed();
    apply();
    const h = new URLSearchParams(location.hash.slice(1));
    const pre = D.presets && D.presets[+h.get('preset')];
    if (h.has('preset') && pre) { for (const k in pre.values) $('in-' + k).value = pre.values[k]; apply(); }
    if (h.has('step')) withInstant(() => go(+h.get('step')));
    if (h.has('check')) setTimeout(runCheck, 50);
  }

  return { $, el, esc, clamp, dur, animate, flash, setText, keyed, lineOf, start, isInstant: () => instant };
})();
</script>

<script>
/* =====================================================================
   DEMO —— 本题专用：输入解析、步骤生成、可视化挂载与渲染（生成新演示时替换这里）
   示例：文远1.py · Belady 最优缓存替换
   ===================================================================== */
/* =====================================================================
   本题：滴滴加减2.py · 值域前缀和 + 奇偶修正
   ===================================================================== */
(() => {
const { el, setText, flash, keyed, animate, lineOf: L } = AV;
let U = null;
const cost = (v, x) => Math.floor(Math.abs(v - x) / 2);

const DEMO = {
  file: '滴滴加减2.py',
  title: '多次询问最少操作数 · 值域前缀和 + 奇偶修正（滴滴加减2）',
  subtitle: '把所有数都变成 x 的代价 = Σ⌊|v − x| / 2⌋。按值域做 cnt / sums / odd 前缀和：x 左右两段的 Σ|v − x| 都能 O(1) 算出，再减去差为奇数的个数 bad，最后除以 2',
  inputs: [
    { id: 'nums', label: 'nums', value: '1 2 3 4 5 6', flex: true },
    { id: 'asks', label: '询问 x', value: '3 0 8', width: 160 },
  ],
  presets: [
    { label: '1~6', values: { nums: '1 2 3 4 5 6', asks: '3 0 8' } },
    { label: '全相同', values: { nums: '4 4 4 4 4', asks: '4 5 7 0' } },
    { label: '乱序 8 个', values: { nums: '0 9 2 7 7 1 12 5', asks: '6 10 1' } },
    { label: 'x 超出值域', values: { nums: '5 11 2', asks: '20 1' } },
  ],
  stats: [
    { key: 'x', label: '当前询问 x', color: 'blue' },
    { key: 'c1', label: '左段个数 c1', color: 'green' },
    { key: 'c2', label: '右段个数 c2', color: 'amber' },
    { key: 'bad', label: '奇偶不同 bad', color: 'purple' },
    { key: 'res', label: '本次答案 res', color: 'red' },
  ],
  panels: {
    canvas: { title: '值域数组：nums 中每个值的个数，及 cnt / sums / odd（先计数，再原地变前缀和）', hint: '列 = 数值 v；淡出的列表示列表还没扩容到这么长' },
    state: { title: '当前计算' },
    aux: [{ id: 'ans', title: '询问结果', hint: '左段 ≤ x−1 · 右段 ≥ x+2 · 暴力 = Σ⌊|v−x|/2⌋', grow: true }],
  },

  parse(v) {
    const nums = String(v.nums).trim().split(/[\s,，]+/).filter(Boolean).map(Number);
    const asks = String(v.asks).trim().split(/[\s,，]+/).filter(Boolean).map(Number);
    if (!nums.length || nums.length > 12) return { error: 'nums 需要 1 ~ 12 个数' };
    if (!asks.length || asks.length > 5) return { error: '询问需要 1 ~ 5 个' };
    if ([...nums, ...asks].some(x => !Number.isInteger(x) || x < 0 || x > 20)) return { error: '数值与询问取 0 ~ 20 的整数（值域数组要放进一屏）' };
    const len = Math.max(Math.max(...nums) + 1, Math.max(...asks) + 2);
    return { nums, asks, len };
  },

  build({ nums, asks, len: LEN }) {
    const n = nums.length, q = asks.length, steps = [];
    const cnt = [], sums = [], odd = [], raw = new Array(LEN).fill(0), ans = [], rows = [];
    let Q = null, pf = 0, tot = null;
    const S = o => ({
      cnt: [...cnt], sums: [...sums], odd: [...odd], raw: [...raw], pf, rows: rows.map(r => ({ ...r })), Q: Q && { ...Q },
      stats: {
        x: Q ? Q.x : '—',
        c1: Q && Q.c1 != null ? { v: Q.c1, sub: `s1 = ${Q.s1}，o1 = ${Q.o1}` } : '—',
        c2: Q && Q.c2 != null ? { v: Q.c2, sub: `s2 = ${Q.s2}，o2 = ${Q.o2}` } : '—',
        bad: Q && Q.bad != null ? { v: Q.bad, sub: Q.x % 2 ? '偶数个数' : '奇数个数' } : '—',
        res: Q && Q.res != null ? Q.res : '—',
      },
      ...o,
    });
    const grow = v => { let k = 0; while (cnt.length <= v) { cnt.push(0); sums.push(0); odd.push(0); k++; } return k; };
    const P0 = '准备 · 值域计数', P1 = '前缀和', P2 = '回答询问';

    steps.push(S({ phase: P0, tag: { text: '读入', kind: 'info' }, lines: [L('n = int(data[0])'), L('q = int(data[1])'), L('nums = [int(x)'), L('asks = [int(x)'), L('cnt = []'), L('sums = []'), L('odd = []')],
      formula: `n = ${n}，q = ${q}<br>nums = [${nums.join(', ')}]<br>asks = [${asks.join(', ')}]`,
      desc: `每个询问 x 都要求"把所有数变成 x 的最少操作"。若对每个 x 都遍历 nums 是 O(nq)；改为按<b>数值</b>建桶并做前缀和，每个询问 O(1)。cnt / sums / odd 先建成空列表，按需扩容。` }));

    nums.forEach((v, k) => {
      const g = grow(v);
      cnt[v] += 1; sums[v] += v; if (v % 2) odd[v] += 1; raw[v]++;
      steps.push(S({ phase: P0, tag: { text: `计数 ${k + 1} / ${n}`, kind: 'pre' }, cur: v, hl: [[v, 'upd']],
        lines: [L('for v in nums'), ...(g ? [L('while len(cnt) <= v'), L('cnt.append(0)')] : []), L('cnt[v] += 1'), L('sums[v] += v'), ...(v % 2 ? [L('if v % 2 == 1'), L('odd[v] += 1')] : [L('if v % 2 == 1')])],
        formula: `v = <span class="b">${v}</span>${g ? `　列表扩容 ${g} 格，长度 → ${cnt.length}` : ''}<br>cnt[${v}] = <span class="g">${cnt[v]}</span>　sums[${v}] = <span class="g">${sums[v]}</span>　odd[${v}] = <span class="g">${odd[v]}</span>`,
        desc: `第 ${k + 1} 个数 <b>${v}</b>${g ? `：列表长度不够，先 append 到下标 ${v}` : ''}。在值 ${v} 的桶里：个数 +1，数值和 +${v}，${v % 2 ? '它是<b>奇数</b>，奇数个数 +1' : '它是偶数，odd 不变'}。` }));
    });

    const maxX = Math.max(...asks), g2 = grow(maxX + 1);
    steps.push(S({ phase: P0, tag: { text: '扩容到询问', kind: 'pre' }, lines: [L('max_x = max(asks)'), L('while len(cnt) <= max_x + 1'), L('cnt.append(0)', 2)],
      formula: `max_x = ${maxX}，需要下标 max_x + 1 = ${maxX + 1}<br>len(cnt) = <span class="b">${cnt.length}</span>${g2 ? `（扩容 ${g2} 格）` : '（已经够长）'}`,
      desc: `询问时要读 cnt[x + 1]，而 x 可能比 nums 里的最大值还大，所以把长度补到至少 max_x + 2，避免越界。` }));

    for (let i = 1; i < cnt.length; i++) {
      cnt[i] += cnt[i - 1]; sums[i] += sums[i - 1]; odd[i] += odd[i - 1]; pf = i;
      steps.push(S({ phase: P1, tag: { text: `前缀和 i = ${i}`, kind: 'pre' }, arc: i, hl: [[i - 1, 'src'], [i, 'upd']],
        lines: [L('for i in range(1, len(cnt))'), L('cnt[i] += cnt[i - 1]'), L('sums[i] += sums[i - 1]'), L('odd[i] += odd[i - 1]')],
        formula: `cnt[${i}] = ${cnt[i] - cnt[i - 1]} + <span class="p">${cnt[i - 1]}</span> = <span class="g">${cnt[i]}</span><br>sums[${i}] = ${sums[i] - sums[i - 1]} + <span class="p">${sums[i - 1]}</span> = <span class="g">${sums[i]}</span><br>odd[${i}] = ${odd[i] - odd[i - 1]} + <span class="p">${odd[i - 1]}</span> = <span class="g">${odd[i]}</span>`,
        desc: `原地累加：现在 cnt[${i}] 表示<b>数值 ≤ ${i}</b> 的数有几个，sums[${i}] 是它们的和，odd[${i}] 是其中奇数的个数。` }));
    }
    pf = cnt.length; tot = [cnt.at(-1), sums.at(-1), odd.at(-1)];
    steps.push(S({ phase: P1, tag: { text: '总量', kind: 'pre' }, hl: [[cnt.length - 1, 'tot']], lines: [L('total_cnt = cnt[-1]'), L('total_sum = sums[-1]'), L('total_odd = odd[-1]')],
      formula: `total_cnt = <span class="r">${tot[0]}</span>　total_sum = <span class="r">${tot[1]}</span>　total_odd = <span class="r">${tot[2]}</span>`,
      desc: `前缀和的最后一格就是全体数的个数、总和、奇数个数，用来求"数值 ≥ 某值"的后缀。` }));

    const len = cnt.length;
    asks.forEach((x, qi) => {
      Q = { x, qi };
      const row = { k: qi, x, c1: '', s1: '', o1: '', c2: '', s2: '', o2: '', bad: '', res: '', bf: '' };
      rows.push(row);
      const Pq = `${P2} · 第 ${qi + 1} / ${q} 个`;
      if (x >= 1) { Q.c1 = cnt[x - 1]; Q.s1 = sums[x - 1]; Q.o1 = odd[x - 1]; } else { Q.c1 = Q.s1 = Q.o1 = 0; }
      Object.assign(row, { c1: Q.c1, s1: Q.s1, o1: Q.o1 });
      steps.push(S({ phase: Pq, tag: { text: `x = ${x} · 左段`, kind: 'hit' }, part: 'L', hl: x >= 1 ? [[x - 1, 'rdL']] : [],
        lines: x >= 1 ? [L('for x in asks'), L('if x >= 1'), L('c1 = cnt[x - 1]'), L('s1 = sums[x - 1]'), L('o1 = odd[x - 1]')] : [L('for x in asks'), L('if x >= 1'), L('c1 = s1 = o1 = 0')],
        formula: x >= 1
          ? `左段 = 数值 ≤ x − 1 = ${x - 1}<br>c1 = cnt[${x - 1}] = <span class="g">${Q.c1}</span>　s1 = sums[${x - 1}] = <span class="g">${Q.s1}</span>　o1 = odd[${x - 1}] = <span class="g">${Q.o1}</span>`
          : `x = 0，没有比它小的数<br>c1 = s1 = o1 = <span class="g">0</span>`,
        desc: x >= 1
          ? `比 x 小的数都要<b>往上</b>变到 ${x}，总距离 Σ(x − v) = x·c1 − s1，直接读前缀和第 x − 1 格（绿色）即可。`
          : `x = 0 时左段为空，cnt[−1] 会读到最后一格，所以单独置 0。` }));

      Q.c2 = tot[0] - cnt[x + 1]; Q.s2 = tot[1] - sums[x + 1]; Q.o2 = tot[2] - odd[x + 1];
      Object.assign(row, { c2: Q.c2, s2: Q.s2, o2: Q.o2 });
      steps.push(S({ phase: Pq, tag: { text: `x = ${x} · 右段`, kind: 'warn' }, part: 'R', hl: [[x + 1, 'rdR'], [len - 1, 'tot']],
        lines: [L('if x + 1 < len(cnt)'), L('c2 = total_cnt - cnt[x + 1]'), L('s2 = total_sum - sums[x + 1]'), L('o2 = total_odd - odd[x + 1]')],
        formula: `右段 = 总量 − 前缀[x + 1 = ${x + 1}] = 数值 ≥ ${x + 2}<br>c2 = ${tot[0]} − ${cnt[x + 1]} = <span class="a">${Q.c2}</span>　s2 = ${tot[1]} − ${sums[x + 1]} = <span class="a">${Q.s2}</span>　o2 = ${tot[2]} − ${odd[x + 1]} = <span class="a">${Q.o2}</span>`,
        desc: `比 x 大的数<b>往下</b>变，总距离 s2 − x·c2。注意 total − cnt[x+1] 实际是<b>数值 ≥ x + 2</b>（代码注释写的 x + 1 不准确）：v = x + 1 差 1，代价 ⌊1/2⌋ = 0，漏掉也不影响结果。扩容保证了 x + 1 < len(cnt)，else 分支不会走到。` }));

      Q.bad = x % 2 === 0 ? Q.o1 + Q.o2 : (Q.c1 - Q.o1) + (Q.c2 - Q.o2);
      row.bad = Q.bad;
      steps.push(S({ phase: Pq, tag: { text: `x = ${x} · 奇偶修正`, kind: 'pre' }, part: 'B',
        lines: [L('bad = 0'), L('if x % 2 == 0'), x % 2 === 0 ? L('bad = o1 + o2') : L('bad = (c1 - o1) + (c2 - o2)')],
        formula: x % 2 === 0
          ? `x = ${x} 是偶数 → 奇数 v 与它差为奇数<br>bad = o1 + o2 = ${Q.o1} + ${Q.o2} = <span class="p">${Q.bad}</span>`
          : `x = ${x} 是奇数 → 偶数 v 与它差为奇数<br>bad = (c1 − o1) + (c2 − o2) = ${Q.c1 - Q.o1} + ${Q.c2 - Q.o2} = <span class="p">${Q.bad}</span>`,
        desc: `单个数的代价是 ⌊|v − x| / 2⌋：差为偶数时正好是一半；<b>差为奇数</b>（v 与 x 奇偶不同，红框）时要先减 1 再除以 2。所以总距离要减去这类数的个数 bad。` }));

      const dL = Math.abs(x * Q.c1 - Q.s1), dR = Math.abs(x * Q.c2 - Q.s2);
      Q.res = (dL + dR - Q.bad) / 2;
      const bf = nums.reduce((p, v) => p + cost(v, x), 0);
      row.res = Q.res; row.bf = bf; ans.push(Q.res);
      steps.push(S({ phase: Pq, tag: { text: `x = ${x} · 答案`, kind: 'hit' }, part: 'C',
        lines: [L('res = (abs(x * c1 - s1)'), L('ans.append(str(res))')],
        formula: `|x·c1 − s1| = |${x}×${Q.c1} − ${Q.s1}| = <span class="g">${dL}</span><br>|x·c2 − s2| = |${x}×${Q.c2} − ${Q.s2}| = <span class="a">${dR}</span><br>res = (${dL} + ${dR} − <span class="p">${Q.bad}</span>) // 2 = <span class="r">${Q.res}</span>`,
        desc: `答案 <b style="color:var(--red)">${Q.res}</b>。最下面一行是逐个值的 ⌊|v − x|/2⌋ × 个数，加起来 = ${bf}，与公式一致${bf === Q.res ? ' ✓' : ' ✗'}。` }));
    });
    Q = null;
    steps.push(S({ phase: '输出', tag: { text: '完成', kind: 'warn' }, done: true, lines: [L("print(' '.join(ans))")],
      formula: `输出：<span class="r">${ans.join(' ')}</span>`,
      desc: `全部询问回答完毕，输出 <b style="font-size:18px;color:var(--red)">${ans.join(' ')}</b>。预处理 O(值域 + n)，每个询问 O(1)。` }));
    return steps;
  },

  mount({ len }, P) {
    P.canvas.innerHTML = `<div class="gwrap"><div class="grid" style="--len:${len}"></div><svg><defs><marker id="mk-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:#7c3aed;stroke:none"/></marker></defs><g><path marker-end="url(#mk-purple)"/></g></svg><div class="cursor"></div></div>
      <div class="legend"><span><i style="background:var(--green-l);border:1px solid #86efac"></i>左段 v ≤ x−1</span><span><i style="background:var(--amber-l);border:1px solid #fcd34d"></i>右段 v ≥ x+2</span>
      <span><i style="background:repeating-linear-gradient(135deg,#e2e8f0 0 3px,#fff 3px 6px)"></i>v = x+1（代价 0，未计入）</span><span><i style="box-shadow:inset 0 0 0 2px var(--red)"></i>与 x 奇偶不同（bad）</span><span><i style="background:var(--purple)"></i>前缀和累加方向</span></div>`;
    const grid = P.canvas.querySelector('.grid');
    const row = (label, cls) => { grid.appendChild(el('div', 'rh', label)); return Array.from({ length: len }, () => grid.appendChild(el('div', cls))); };
    const lane = row('', 'lane');
    const ix = row('数值 v', 'ix'); ix.forEach((c, i) => { c.textContent = i; });
    const dv = row('nums 个数', 'dv');
    const arcLane = row('', 'lane');
    const ac = { cnt: row('cnt', 'ac'), sums: row('sums', 'ac'), odd: row('odd', 'ac') };
    const co = row('代价', 'co');
    P.state.innerHTML = '<div class="formula"></div>';
    P.aux.ans.innerHTML = `<div class="tbl"><div class="trow head"><span>x</span><span>c1</span><span>s1</span><span>o1</span><span>c2</span><span>s2</span><span>o2</span><span>bad</span><span>res</span><span>暴力</span></div><div class="tscroll"></div></div>`;
    P.aux.ans.style.overflow = 'hidden';
    U = { grid, lane, ix, dv, arcLane, ac, co, path: P.canvas.querySelector('svg > g path'), cursor: P.canvas.querySelector('.cursor'), arcCur: null,
      formula: P.state.querySelector('.formula'), tb: P.aux.ans.querySelector('.tscroll') };
  },

  layout() { U.arcCur = null; },

  render(s, prev, { len }) {
    const Q = s.Q, x = Q ? Q.x : null, part = Q ? 'LRBC'.indexOf(s.part) : -1;
    const hl = new Map((s.hl || []).map(([i, c]) => [i, c]));
    for (let i = 0; i < len; i++) {
      const alive = i < s.cnt.length;
      U.ix[i].className = 'ix' + (i === x ? ' x' : '');
      // 数值分布
      let dc = 'dv' + (alive ? '' : ' gh');
      if (Q) dc += i <= x - 1 ? ' L' : i === x ? ' X' : i === x + 1 ? ' Z' : ' R';
      if (Q && part >= 2 && s.raw[i] && i !== x + 1 && (i - x) % 2) dc += ' bad';
      U.dv[i].className = dc;
      setText(U.dv[i], s.raw[i] ? '×' + s.raw[i] : '');
      for (const k of ['cnt', 'sums', 'odd']) {
        const c = U.ac[k][i];
        setText(c, alive ? s[k][i] : '', prev ? 'av-flash' : null);
        c.className = 'ac' + (alive ? '' : ' gh') + (alive && i <= s.pf && s.pf > 0 ? ' pf' : '') + (hl.has(i) ? ' ' + hl.get(i) : '');
      }
      setText(U.co[i], Q && part === 3 && s.raw[i] ? String(cost(i, x) * s.raw[i]) : '');
    }
    // x 游标
    const center = i => U.ix[i].offsetLeft + U.ix[i].offsetWidth / 2;
    U.cursor.style.opacity = Q ? 1 : 0;
    if (Q) { U.cursor.style.left = center(x) + 'px'; setText(U.cursor, `x = ${x}`); }
    // 前缀和箭头：i-1 → i
    if (s.arc) {
      const y = U.arcLane[0].offsetTop + U.arcLane[0].offsetHeight - 3, x0 = center(s.arc - 1) + 4, x1 = center(s.arc) - 4;
      const to = { x0, x1, y }, from = U.arcCur || to;
      U.path.style.opacity = 1;
      animate('arc', p => {
        const c = {}; for (const k in to) c[k] = from[k] + (to[k] - from[k]) * p;
        U.arcCur = c;
        U.path.setAttribute('d', `M${c.x0},${c.y} Q${(c.x0 + c.x1) / 2},${c.y - 20} ${c.x1},${c.y}`);
      });
    } else { U.path.style.opacity = 0; U.arcCur = null; }

    if (U.formula.innerHTML !== s.formula) { U.formula.innerHTML = s.formula; flash(U.formula, 'fade-in'); }

    keyed(U.tb, s.rows, r => r.k, () => el('div', 'trow', '<span></span>'.repeat(10)), (row, r) => {
      const sp = row.children;
      [r.x, r.c1, r.s1, r.o1, r.c2, r.s2, r.o2, r.bad, r.res, r.bf === '' ? '' : r.bf === r.res ? r.bf + ' ✓' : r.bf + ' ✗'].forEach((v, q) => setText(sp[q], v));
      ['', 'g', 'g', 'g', 'a', 'a', 'a', '', 'r', 'ok'].forEach((c, q) => { sp[q].className = c; });
      row.className = 'trow' + (Q && Q.qi === r.k ? ' cur' : '');
    });
  },
};

AV.start(DEMO);
})();
</script>
