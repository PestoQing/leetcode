<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>算法动态演示</title>
<style>
/* =====================================================================
   ENGINE STYLE —— 通用布局与风格（固定，生成新演示时不要改动）
   ===================================================================== */
:root {
  --bg: #f5f7fb; --card: #fff; --line: #e5e7eb; --text: #1f2937; --muted: #6b7280;
  --blue: #2563eb; --green: #16a34a; --red: #dc2626; --amber: #d97706; --purple: #7c3aed; --gray: #64748b;
  --blue-l: #eff6ff; --green-l: #f0fdf4; --red-l: #fef2f2; --amber-l: #fffbeb; --purple-l: #f5f3ff;
  --dur: 420ms; --ease: cubic-bezier(.4, 0, .2, 1);
  --code-w: 720px; --code-fs: 14px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 14px; }
body.instant *, body.instant *::before, body.instant *::after { transition: none !important; animation: none !important; }

header { flex: none; display: flex; align-items: baseline; gap: 14px; padding: 12px 20px 8px; min-width: 0; }
header h1 { margin: 0; font-size: 19px; white-space: nowrap; }
header .sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 12px var(--code-w);
  padding: 0 16px 14px 20px; transition: grid-template-columns var(--dur) var(--ease); }
.app.dragging { transition: none; user-select: none; }
.app.code-collapsed { grid-template-columns: minmax(0, 1fr) 12px 44px; }
.left { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; overflow: auto; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px;
  font-weight: 600; font-size: 15px; }
.card-h .hint { font-weight: 400; text-align: right; }
.hint { color: var(--muted); font-size: 12px; }
.mono { font-family: Consolas, "Courier New", monospace; }
.dim { opacity: .5; transition: opacity var(--dur); }

/* 工具栏 */
.toolbar { flex: none; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar label { color: var(--muted); }
input[type=text], input[type=number] { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px;
  font-family: inherit; transition: border-color .15s, box-shadow .15s; }
input[type=text]:focus, input[type=number]:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px #dbeafe; }
button { padding: 6px 12px; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer;
  font-size: 14px; font-family: inherit; color: var(--text); transition: background .15s, border-color .15s; }
button:hover { background: #eef2ff; border-color: #a5b4fc; }
button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
button.primary:hover { background: #1d4ed8; }
button.preset { font-size: 12px; padding: 3px 9px; }
.progress { flex: 1; min-width: 140px; height: 8px; background: var(--line); border-radius: 4px; cursor: pointer;
  position: relative; touch-action: none; margin: 0 8px; }
.progress::before { content: ""; position: absolute; left: -8px; right: -8px; top: -9px; bottom: -9px; }
.progress #prog { height: 100%; background: var(--blue); border-radius: 4px; transition: width var(--dur) var(--ease); }
.progress .thumb { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%;
  background: #fff; border: 3px solid var(--blue); box-shadow: 0 1px 4px rgba(0, 0, 0, .2); cursor: grab;
  transition: left var(--dur) var(--ease), transform .15s; }
.progress:hover .thumb, .progress.dragging .thumb { transform: scale(1.2); }
.progress.dragging .thumb { cursor: grabbing; }
.progress.dragging #prog, .progress.dragging .thumb { transition: none; }
.progress .tip { position: absolute; bottom: 18px; transform: translateX(-50%); background: var(--text); color: #fff;
  font-size: 12px; padding: 2px 8px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .15s; }
.progress.dragging .tip { opacity: 1; }
.err { color: var(--red); font-size: 13px; }

/* 统计卡片（保持这一风格：标题 + 大号彩色数字） */
.stats { flex: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 16px; transition: box-shadow .3s; }
.stat .lab { font-size: 14px; font-weight: 600; line-height: 20px; }
.stat .num { font-size: 32px; font-weight: 800; line-height: 1.45; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .num small { font-size: 15px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.stat .sub { font-size: 12px; color: var(--muted); height: 18px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.red .num { color: var(--red); } .stat.green .num { color: var(--green); } .stat.blue .num { color: var(--blue); }
.stat.amber .num { color: var(--amber); } .stat.purple .num { color: var(--purple); } .stat.gray .num { color: var(--gray); }
.stat.bump { animation: bump .6s var(--ease); }
@keyframes bump { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, .35); } 100% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); } }

/* 主画布 + 下方两列 */
.canvas-card { flex: none; }
.bottom { flex: 1; min-height: 200px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.col { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
.col > .card { flex: none; }
.col > .card.grow { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.card.grow > .card-b { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

/* 步骤说明 */
.desc { font-size: 15px; line-height: 1.75; }
.desc b { color: var(--blue); }
.fade-in { animation: fadeIn var(--dur) var(--ease); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.tag { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 12px; font-weight: 600; margin-right: 6px; color: #fff; line-height: 20px; }
.tag.pre { background: var(--purple); } .tag.hit { background: var(--green); } .tag.miss { background: var(--red); }
.tag.info { background: var(--blue); } .tag.warn { background: var(--amber); }
.phase { font-size: 12px; font-weight: 600; color: var(--blue); background: var(--blue-l); border-radius: 10px; padding: 1px 10px; }

/* 通用：进入 / 闪烁动画 */
.av-enter { animation: avEnter var(--dur) var(--ease); }
@keyframes avEnter { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.av-flash { animation: avFlash calc(var(--dur) * 1.6) var(--ease); }
@keyframes avFlash { 0% { background: #fde68a; } 100% { background: transparent; } }

/* 分隔条 */
.splitter { position: relative; cursor: col-resize; }
.splitter::after { content: ""; position: absolute; left: 5px; top: calc(50% - 30px); height: 60px; width: 3px; border-radius: 2px;
  background: #cbd5e1; transition: background .15s; }
.splitter:hover::after, .app.dragging .splitter::after { background: var(--blue); }
.app.code-collapsed .splitter { cursor: default; }

<!-- 对应 .py 的完整源码，用 scripts/embed_source.py 写入（保持与源文件一致） -->
<script type="text/plain" id="py-source">
import sys

# 本地调试时取消下面这行注释
sys.stdin = open('input1.txt', 'r')

def main():
    # 1. 读取并解析输入数据
    data = sys.stdin.read().split() # 一次性读取所有输入，按空白字符拆分
    if not data:
        return
    n = int(data[0])       # 服务器数量 N
    a = int(data[1])       # 中心服务器降温量 A
    b = int(data[2])       # 其他服务器降温量 B
    h = [int(x) for x in data[3:3+n]]  # 每台服务器的初始过热指数列表

    # 2. 初始化二分查找
    d = a - b              # 中心服务器比普通服务器每次多减的量（A - B）
    L = 0                  # 二分查找下界：最少操作 0 次
    R = max(h)             # 二分查找上界：最多操作 max(h) 次（因为B>=1，每次至少减1，肯定够）

    # 3. 二分查找主循环
    while L < R:
        M = (L + R) // 2   # M 是当前假设的总操作次数
        
        # 4. 验证 M 次操作是否足够 (贪心策略)
        s = 0              # s 记录需要将某些服务器选为“中心”的总次数
        for x in h:
            # 如果经过 M 次全局降温 (每次减 B)，这台服务器还没降到 0 以下
            # 则它必须被选为“中心”至少若干次
            if x > M * b:
                # 额外需要减少 x - M*b
                # 每次被选为中心，可以额外多减 d
                # 向上取整计算需要选为中心的次数：(x - M*b + d - 1) // d
                s += (x - M * b + d - 1) // d
                
        # 5. 判断可行性并调整二分区间
        if s <= M:         # 如果所需中心次数 s 不超过总操作次数 M，说明 M 次操作可行
            R = M          # 尝试更少的操作次数
        else:              # 如果所需的中心次数超过了总操作次数，说明 M 次不够
            L = M + 1      # 必须增加操作次数

    # 6. 输出结果
    print(L)               # 当 L == R 时，即为最少需要的操作次数

if __name__ == "__main__":
    main()
</script>

<script>
/* =====================================================================
   ENGINE —— 播放器 / 布局 / 代码高亮 / 平滑过渡 / 自检（通用，勿改）
   ===================================================================== */
const AV = (() => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  let DUR = 420, instant = false;
  const dur = () => (instant ? 0 : DUR);

    const want = new Set(items.map(it => String(keyOf(it))));

  // ---------- Python 高亮（VS Code Dark Modern + Pylance 语义配色） ----------

        else if (CLS.has(w)) c = 'cls';
        else if (/^[A-Z][A-Z0-9_]+$/.test(w)) c = 'const';
        return `<span class="t-${c}">${esc(w)}</span>`;
      }).join('');

    });

      withInstant(() => { for (let k = 0; k < steps.length; k++) { go(k); checkOnce(k, tagged); } go(0); });
      total += steps.length;
      tagged.forEach(it => { it.step = (p ? p.label + ' · ' : '') + 'step ' + it.step; issues.push(it); });
    });
    const left = $('left'), body = $('codeBody');
    const uniq = [], seen = new Set();
    for (const it of issues) { const key = it.type + it.a + '|' + it.b; if (!seen.has(key)) { seen.add(key); uniq.push(it); } }
    const res = {
      viewport: [window.innerWidth, window.innerHeight], steps: total, lastSteps: steps.length,
      leftNeedsScroll: Math.max(0, left.scrollHeight - left.clientHeight),
      codeHScroll: Math.max(0, body.scrollWidth - body.clientWidth),
      overlaps: uniq.slice(0, 30), overlapCount: uniq.length,
    };
    $('av-check').textContent = JSON.stringify(res);
    document.title = 'AVCHECK ' + (res.leftNeedsScroll || res.codeHScroll || res.overlapCount ? 'FAIL' : 'OK');
  }

  function start(demo) {
    D = demo;
    buildShell();
    wire();
    setSpeed();
    apply();
    const h = new URLSearchParams(location.hash.slice(1));
    const pre = D.presets && D.presets[+h.get('preset')];
    if (h.has('preset') && pre) { for (const k in pre.values) $('in-' + k).value = pre.values[k]; apply(); }
    if (h.has('step')) withInstant(() => go(+h.get('step')));
    if (h.has('check')) setTimeout(runCheck, 50);
  }

  return { $, el, esc, clamp, dur, animate, flash, setText, keyed, lineOf, start, isInstant: () => instant };
})();
</script>

<script>
/* =====================================================================
   DEMO —— 本题专用：输入解析、步骤生成、可视化挂载与渲染（生成新演示时替换这里）
   示例：文远1.py · Belady 最优缓存替换
   ===================================================================== */
/* =====================================================================
   本题：滴滴紧急降温.py · 二分答案 + 贪心验证
   ===================================================================== */
(() => {
const { el, setText, flash, keyed, lineOf: L } = AV;
let U = null;
const cdiv = (p, q) => Math.floor((p + q - 1) / q);

const DEMO = {
  file: '滴滴紧急降温.py',
  title: '紧急降温最少操作次数 · 二分答案 + 贪心验证（滴滴）',
  subtitle: '每次操作选一台当"中心"降 A，其余都降 B。做 M 次后每台至少降 M·B，超出部分只能靠当中心每次多降 d = A − B → 所需中心次数之和 s ≤ M 即可行；可行性随 M 单调，二分最小的 M',
  inputs: [
    { id: 'n', label: 'N =', value: '4', type: 'number', width: 60 },
    { id: 'a', label: 'A =', value: '5', type: 'number', width: 60 },
    { id: 'b', label: 'B =', value: '3', type: 'number', width: 60 },
    { id: 'h', label: '过热指数 h', value: '8 7 6 5', flex: true },
  ],
  presets: [
    { label: '样例 input1', values: { n: 4, a: 5, b: 3, h: '8 7 6 5' } },
    { label: '一台特别热', values: { n: 3, a: 10, b: 1, h: '20 3 5' } },
    { label: '全都一样', values: { n: 5, a: 4, b: 2, h: '9 9 9 9 9' } },
    { label: '只有 1 台', values: { n: 1, a: 3, b: 1, h: '7' } },
    { label: '已经不热', values: { n: 3, a: 3, b: 2, h: '0 0 0' } },
    { label: '6 台', values: { n: 6, a: 7, b: 2, h: '15 4 22 9 1 13' } },
  ],
  stats: [
    { key: 'ans', label: '最少操作次数', color: 'red' },
    { key: 'lr', label: '二分区间 [L, R]', color: 'purple' },
    { key: 'M', label: '假设操作次数 M', color: 'blue' },
    { key: 's', label: '所需中心次数 s', color: 'amber' },
    { key: 'round', label: '二分轮数', color: 'gray' },
  ],
  panels: {
    canvas: { title: '服务器过热指数（柱高）与 M 次全局降温线 · 下方为二分区间', hint: '红色 = M·B 之上还要靠当中心降掉的部分，每格 = 一次中心多降 d' },
    state: { title: '当前计算' },
    aux: [{ id: 'hist', title: '二分过程', hint: 's ≤ M 可行 → R = M；否则 L = M + 1', grow: true }],
  },

  parse(v) {
    const n = parseInt(v.n, 10), a = parseInt(v.a, 10), b = parseInt(v.b, 10);
    const h = String(v.h).trim().split(/[\s,，]+/).filter(Boolean).map(Number);
    if (!(n >= 1 && n <= 10)) return { error: 'N 取 1 ~ 10（保证一屏放下）' };
    if (h.length !== n) return { error: `需要 ${n} 个过热指数，当前 ${h.length} 个` };
    if (h.some(x => !Number.isInteger(x) || x < 0 || x > 60)) return { error: '过热指数取 0 ~ 60 的整数' };
    if (!(b >= 1 && a > b)) return { error: '需满足 A > B ≥ 1（d = A − B 作除数）' };
    return { n, a, b, h };
  },

  build({ n, a, b, h }) {
    const steps = [], d = a - b, hist = [];
    let lo = null, hi = null, M = null, s = null, round = 0, need = new Array(n).fill(null);
    const S = o => ({
      lo, hi, M, s, need: [...need], hist: hist.map(r => ({ ...r })),
      stats: {
        ans: o.done ? lo : '—',
        lr: lo == null ? '—' : `[${lo}, ${hi}]`,
        M: M == null ? '—' : { v: M, sub: `全局降温 M·B = ${M * b}` },
        s: s == null ? '—' : { v: s, sub: o.verdict ? (o.verdict === 'ok' ? `≤ M = ${M}，可行` : `> M = ${M}，不够`) : `需要 ≤ M = ${M}` },
        round,
      },
      ...o,
    });
    const P0 = '准备 · 读入', P1 = '二分答案', P2 = '输出';

    steps.push(S({ phase: P0, tag: { text: '读入', kind: 'info' },
      lines: [L('data = sys.stdin.read()'), L('n = int(data[0])'), L('a = int(data[1])'), L('b = int(data[2])'), L('h = [int(x)')],
      formula: `N = ${n}　A = <span class="b">${a}</span>　B = <span class="p">${b}</span><br>h = [${h.join(', ')}]`,
      desc: `${n} 台服务器，每次操作选一台当<b>中心</b>降 ${a}，其余每台降 ${b}。问最少几次操作让所有过热指数 ≤ 0。` }));

    lo = 0; hi = Math.max(...h);
    steps.push(S({ phase: P0, tag: { text: '初始化', kind: 'pre' }, lines: [L('d = a - b'), L('L = 0'), L('R = max(h)')],
      formula: `d = A − B = ${a} − ${b} = <span class="g">${d}</span><br>L = 0，R = max(h) = <span class="p">${hi}</span>`,
      desc: `换个角度看每次操作：<b>所有服务器都降 B</b>，被选中的中心<b>再额外降 d = ${d}</b>。答案上界取 max(h) = ${hi}：B ≥ 1，做 max(h) 次时每台都至少降了 max(h)，一定够。` }));

    while (lo < hi) {
      round++;
      M = (lo + hi) >> 1; s = 0; need = new Array(n).fill(null);
      const row = { round, L: lo, R: hi, M, s: '…', res: '' };
      hist.push(row);
      steps.push(S({ phase: P1, tag: { text: `第 ${round} 轮 · 取 M`, kind: 'info' }, lines: [L('while L < R'), L('M = (L + R) // 2'), L('s = 0')], hl: round,
        formula: `M = (L + R) // 2 = (${lo} + ${hi}) // 2 = <span class="b">${M}</span><br>全局降温线 M·B = ${M} × ${b} = <span class="p">${M * b}</span>`,
        desc: `假设一共做 <b>${M}</b> 次操作。不管中心选谁，每台都会被降 M·B = ${M * b}（紫色虚线）。接下来逐台检查虚线之上还剩多少，只能靠当中心来补。` }));
      for (let k = 0; k < n; k++) {
        const x = h[k];
        if (x > M * b) {
          need[k] = cdiv(x - M * b, d); s += need[k];
          row.s = s;
          steps.push(S({ phase: P1, tag: { text: `第 ${round} 轮 · 服务器 ${k}`, kind: 'miss' }, cur: k, hl: round,
            lines: [L('for x in h'), L('if x > M * b'), L('s += (x - M * b + d - 1) // d')],
            formula: `${x} > ${M * b}，还差 ${x} − ${M * b} = <span class="r">${x - M * b}</span><br>需当中心 ⌈${x - M * b} / ${d}⌉ = (${x - M * b} + ${d - 1}) // ${d} = <span class="r">${need[k]}</span> 次<br>s = <span class="b">${s}</span>`,
            desc: `服务器 ${k} 的 ${x} 高于虚线，多出的 ${x - M * b} 只能靠当中心降掉，每次多降 ${d}，向上取整要 <b style="color:var(--red)">${need[k]}</b> 次。` }));
        } else {
          need[k] = 0; row.s = s;
          steps.push(S({ phase: P1, tag: { text: `第 ${round} 轮 · 服务器 ${k}`, kind: 'hit' }, cur: k, hl: round,
            lines: [L('for x in h'), L('if x > M * b')],
            formula: `${x} ≤ ${M * b}　不需要当中心<br>s = <span class="b">${s}</span>`,
            desc: `服务器 ${k} 的 ${x} 不超过虚线 ${M * b}：光靠全局降温就够了，<b style="color:var(--green)">不需要</b>当中心。` }));
        }
      }
      const ok = s <= M, oL = lo, oR = hi;
      if (ok) hi = M; else lo = M + 1;
      row.res = ok ? `可行 → R = ${M}` : `不够 → L = ${M + 1}`; row.ok = ok;
      steps.push(S({ phase: P1, tag: { text: ok ? '可行 · 收缩右端' : '不够 · 收缩左端', kind: ok ? 'hit' : 'miss' }, verdict: ok ? 'ok' : 'no', hl: round,
        lines: ok ? [L('if s <= M'), L('R = M')] : [L('if s <= M'), L('L = M + 1')],
        formula: `s = ${s} ${ok ? '≤' : '>'} M = ${M}　→　${ok ? `<span class="g">可行</span>` : `<span class="r">不够</span>`}<br>[${oL}, ${oR}] → <span class="p">[${lo}, ${hi}]</span>`,
        desc: ok
          ? `${M} 次操作里有 ${s} 次指定中心就能满足，剩下 ${M - s} 次中心随便选（只会降得更多），所以 <b style="color:var(--green)">M = ${M} 可行</b>。答案不超过 ${M}，令 R = M 再试更少的。`
          : `需要 ${s} 次当中心，但总共只有 ${M} 次操作，<b style="color:var(--red)">不够</b>。M 更小只会更不够（单调性），令 L = M + 1。` }));
    }

    // 收尾：用最终答案再画一次，确认可行
    M = lo; s = 0;
    need = h.map(x => (x > M * b ? cdiv(x - M * b, d) : 0));
    s = need.reduce((p, q) => p + q, 0);
    steps.push(S({ phase: P2, tag: { text: '完成', kind: 'warn' }, done: true, verdict: 'ok', lines: [L('print(L)')],
      formula: `L = R = <span class="r">${lo}</span><br>验证：M = ${lo} 时 s = ${s} ≤ ${lo}`,
      desc: `区间收缩到 L = R = ${lo}，${round ? `共二分 ${round} 轮，` : 'max(h) = 0，一开始 L = R，'}答案 <b style="font-size:20px;color:var(--red)">${lo}</b>。图中是 M = ${lo} 时的情况：每台超出虚线的部分都能用中心次数补上，总共 ${s} 次 ≤ ${lo}。` }));
    return steps;
  },

  mount({ n, h }, P) {
    const top = Math.max(1, ...h);
    P.canvas.innerHTML = `<div class="cv"><div class="plotwrap"><div class="plot"><div class="cols"></div><div class="mline"></div><div class="mlab"></div></div><div class="labs"></div></div>
      <div class="axis"><span class="tk t0">0</span><span class="tk t1">${top}</span><div class="track"><div class="rng"></div><div class="mk"></div><div class="ml"></div><div class="ll"></div><div class="rl"></div></div></div></div>
      <div class="legend"><span><i style="background:#cbd5e1"></i>过热指数 h</span><span><i style="background:#fca5a5"></i>虚线之上需要当中心降掉（白线分格，每格 d）</span>
      <span><i style="background:#bbf7d0"></i>全局降温已足够</span><span><i style="background:var(--purple)"></i>M·B 全局降温线</span><span><i style="background:var(--blue-l);border:2px solid var(--blue)"></i>二分区间 [L, R]</span></div>`;
    const cols = P.canvas.querySelector('.cols'), labs = P.canvas.querySelector('.labs');
    const bars = [], lab = [];
    for (let k = 0; k < n; k++) {
      const c = cols.appendChild(el('div', 'col'));
      const bar = c.appendChild(el('div', 'bar'));
      const ex = bar.appendChild(el('div', 'ex'));
      bars.push({ bar, ex });
      const l = labs.appendChild(el('div', 'lab', `<div class="id">#${k}</div><div class="hv">${h[k]}</div><div class="nd"></div>`));
      lab.push({ box: l, nd: l.querySelector('.nd') });
    }
    P.state.innerHTML = '<div class="formula"></div>';
    P.aux.hist.innerHTML = `<div class="tbl"><div class="trow head"><span>轮</span><span>L</span><span>R</span><span>M</span><span>s</span><span>结论</span></div><div class="tscroll"></div></div>`;
    P.aux.hist.style.overflow = 'hidden';
    const q = s => P.canvas.querySelector(s);
    U = { plot: q('.plot'), bars, lab, mline: q('.mline'), mlab: q('.mlab'), rng: q('.rng'), mk: q('.mk'), ml: q('.ml'), ll: q('.ll'), rl: q('.rl'),
      top, H: 100, formula: P.state.querySelector('.formula'), tb: P.aux.hist.querySelector('.tscroll') };
  },

  layout() { U.H = U.plot.clientHeight - 6; },

  render(s, prev, { n, b, a, h }) {
    const d = a - b, px = v => Math.min(v, U.top) / U.top * U.H + 'px';
    const line = s.M == null ? null : s.M * b;
    U.bars.forEach(({ bar, ex }, k) => {
      bar.style.height = px(h[k]);
      bar.style.setProperty('--ds', Math.max(3, d / U.top * U.H) + 'px');
      ex.style.height = s.need[k] ? px(h[k] - line) : '0px';
      bar.className = 'bar' + (s.cur === k ? ' cur' : '') + (s.need[k] === 0 ? ' ok' : s.need[k] > 0 ? ' bad' : '');
      const L2 = U.lab[k];
      L2.box.classList.toggle('cur', s.cur === k);
      setText(L2.nd, s.need[k] == null ? '' : s.need[k] ? `中心 ×${s.need[k]}` : '✓');
      L2.nd.className = 'nd' + (s.need[k] ? ' r' : s.need[k] === 0 ? ' g' : '');
    });
    for (const e of [U.mline, U.mlab]) { e.style.opacity = line == null ? 0 : 1; if (line != null) e.style.bottom = px(line); }
    if (line != null) setText(U.mlab, `M·B = ${line}${line > U.top ? ' ↑' : ''}`);

    // 二分区间数轴
    const pc = v => (v / U.top * 100) + '%';
    const on = s.lo != null;
    U.rng.style.opacity = U.ll.style.opacity = on ? 1 : 0;
    if (on) {
      U.rng.style.left = `calc(${pc(s.lo)} - 6px)`; U.rng.style.width = `calc(${pc(s.hi - s.lo)} + 12px)`;
      U.ll.style.left = pc(s.lo); U.rl.style.left = pc(s.hi);
      const same = s.lo === s.hi;
      setText(U.ll, same ? `L = R = ${s.lo}` : `L = ${s.lo}`);
      setText(U.rl, `R = ${s.hi}`);
      U.rl.style.opacity = same ? 0 : 1;
    } else U.rl.style.opacity = 0;
    const showM = s.M != null;
    U.mk.style.opacity = U.ml.style.opacity = showM ? 1 : 0;
    if (showM) { U.mk.style.left = pc(s.M); U.ml.style.left = pc(s.M); setText(U.ml, `M = ${s.M}`); }
    const vc = s.verdict === 'ok' ? ' ok' : s.verdict === 'no' ? ' no' : '';
    U.mk.className = 'mk' + vc; U.ml.className = 'ml' + vc;

    if (U.formula.innerHTML !== s.formula) { U.formula.innerHTML = s.formula; flash(U.formula, 'fade-in'); }

    keyed(U.tb, s.hist, r => r.round, () => el('div', 'trow', '<span></span>'.repeat(6)), (row, r) => {
      const sp = row.children;
      [r.round, r.L, r.R, r.M, r.s, r.res].forEach((v, q) => setText(sp[q], v));
      sp[5].className = r.res ? (r.ok ? 'ok' : 'no') : '';
      row.className = 'trow' + (s.done ? '' : r.round === s.hl ? ' cur' : '');
    });
    const last = U.tb.lastElementChild;
    if (last) U.tb.scrollTop = U.tb.scrollHeight;
  },
};

AV.start(DEMO);
})();
</script>
